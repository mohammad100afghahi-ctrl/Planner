   MIT License — Copyright (c) 2020 Behrang Norouzinia
   Algorithm: Kazimierz M. Borkowski. Bundled locally (no external CDN dependency). */
(function(global){
//#region src/index.ts
/**
* Jalaali years that begin a new 33-year leap cycle. Used by the
* Borkowski algorithm to locate the correct cycle for any given year.
*/
const BREAKS = [
	-61,
	9,
	38,
	199,
	426,
	686,
	756,
	818,
	1111,
	1181,
	1210,
	1635,
	2060,
	2097,
	2192,
	2262,
	2324,
	2394,
	2456,
	3178
];
/** Minimum supported Jalaali year (inclusive). */
const MIN_JALAALI_YEAR = BREAKS[0];
/** Maximum supported Jalaali year (inclusive). */
const MAX_JALAALI_YEAR = BREAKS[BREAKS.length - 1] - 1;
function toJalaali(gyOrDate, gm, gd) {
	if (gyOrDate instanceof Date) return d2j(g2d(gyOrDate.getFullYear(), gyOrDate.getMonth() + 1, gyOrDate.getDate()));
	return d2j(g2d(gyOrDate, gm, gd));
}
/**
* Converts a Jalaali date to Gregorian.
*
* @example
* toGregorian(1395, 1, 23) // { gy: 2016, gm: 4, gd: 11 }
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/
function toGregorian(jy, jm, jd) {
	return d2g(j2d(jy, jm, jd));
}
/**
* Returns `true` if `(jy, jm, jd)` is a real date in the Jalaali calendar.
*
* The check is **lenient** — non-integer inputs that happen to fall inside
* the allowed numeric ranges are accepted. Pass integers in production code.
*
* @example
* isValidJalaaliDate(1394, 12, 30) // false (1394 is a common year)
* isValidJalaaliDate(1395, 12, 30) // true  (1395 is leap)
*/
function isValidJalaaliDate(jy, jm, jd) {
	return jy >= MIN_JALAALI_YEAR && jy <= MAX_JALAALI_YEAR && jm >= 1 && jm <= 12 && jd >= 1 && jd <= jalaaliMonthLength(jy, jm);
}
/**
* Returns `true` if the given Jalaali year is leap (366 days).
*
* @example
* isLeapJalaaliYear(1394) // false
* isLeapJalaaliYear(1395) // true
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/
function isLeapJalaaliYear(jy) {
	return jalCalLeap(jy) === 0;
}
/**
* Returns the number of days in the given Jalaali month.
*
* The function trusts its inputs: `jm` is not range-checked, and an
* out-of-range `jm` will return whichever branch happens to match.
* For input validation, use {@link isValidJalaaliDate} instead.
*
* @example
* jalaaliMonthLength(1394, 12) // 29 (common year)
* jalaaliMonthLength(1395, 12) // 30 (leap year)
*/
function jalaaliMonthLength(jy, jm) {
	if (jm <= 6) return 31;
	if (jm <= 11) return 30;
	return isLeapJalaaliYear(jy) ? 30 : 29;
}
/**
* Computes the leap-cycle state of a Jalaali year and the Gregorian date
* of Farvardin 1 in that year.
*
* Use this directly when you need the leap field; if you only need
* `{ gy, march }`, prefer {@link jalCalShort}.
*
* @example
* jalCal(1391) // { leap: 0, gy: 2012, march: 20 }
* jalCal(1395) // { leap: 0, gy: 2016, march: 20 }
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/
function jalCal(jy) {
	const { gy, march, jump, n } = jalCalCore(jy);
	return {
		leap: leapFromCycle(jump, n),
		gy,
		march
	};
}
/**
* Like {@link jalCal} but omits the leap-cycle computation.
*
* @remarks
* Equivalent to v1's `jalCal(jy, true)` — extracted to its own export
* in v2 to give it a proper return type. Prefer this when the leap field
* isn't needed; it avoids a small amount of work per call.
*
* @example
* jalCalShort(1391) // { gy: 2012, march: 20 }
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/
function jalCalShort(jy) {
	const { gy, march } = jalCalCore(jy);
	return {
		gy,
		march
	};
}
/**
* Converts a Jalaali date to a Julian Day number.
*
* The result is an integer corresponding to noon UT on the given calendar
* day. Inputs are not range-checked — pass valid dates.
*
* @example
* j2d(1395, 1, 23) // 2457490
*/
function j2d(jy, jm, jd) {
	const r = jalCalShort(jy);
	return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
}
const FIRST_JALAALI_JDN = j2d(MIN_JALAALI_YEAR, 1, 1);
const LAST_JALAALI_JDN = j2d(MAX_JALAALI_YEAR, 12, jalaaliMonthLength(MAX_JALAALI_YEAR, 12));
/**
* Converts a Julian Day number to a Jalaali date.
*
* @example
* d2j(2457490) // { jy: 1395, jm: 1, jd: 23 }
*
* @throws {RangeError} if `jdn` falls outside the supported Jalaali range
*   `[-61, 3177]`.
*/
function d2j(jdn) {
	if (jdn < FIRST_JALAALI_JDN || jdn > LAST_JALAALI_JDN) throw new RangeError(`Invalid Julian Day number ${jdn}: outside the supported Jalaali range [${MIN_JALAALI_YEAR}, ${MAX_JALAALI_YEAR}]`);
	const gy = d2g(jdn).gy;
	let jy = Math.min(gy - 621, MAX_JALAALI_YEAR);
	const r = jalCal(jy);
	let k = jdn - g2d(r.gy, 3, r.march);
	if (k >= 0) {
		if (k <= 185) return {
			jy,
			jm: 1 + div(k, 31),
			jd: mod(k, 31) + 1
		};
		k -= 186;
	} else {
		jy -= 1;
		k += 179;
		if (r.leap === 1) k += 1;
	}
	return {
		jy,
		jm: 7 + div(k, 30),
		jd: mod(k, 30) + 1
	};
}
/**
* Converts a Gregorian date to a Julian Day number.
*
* Tested correct from 1 March, -100100 (of both calendars) through several
* million years into the future.
*
* @example
* g2d(2016, 4, 11) // 2457490
*/
function g2d(gy, gm, gd) {
	let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
	d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
	return d;
}
/**
* Converts a Julian Day number to a Gregorian date.
*
* Valid for `jdn ≥ -34839655` (year -100100 of both calendars).
*
* @example
* d2g(2457490) // { gy: 2016, gm: 4, gd: 11 }
*/
function d2g(jdn) {
	let j = 4 * jdn + 139361631;
	j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
	const i = div(mod(j, 1461), 4) * 5 + 308;
	const gd = div(mod(i, 153), 5) + 1;
	const gm = mod(div(i, 153), 12) + 1;
	return {
		gy: div(j, 1461) - 100100 + div(8 - gm, 6),
		gm,
		gd
	};
}
/**
* Converts a Jalaali date (optionally with a time of day) to a JavaScript
* `Date` constructed in the local time zone.
*
* Time components default to `0`. Out-of-range time components are *not*
* clamped — they overflow the way the `Date` constructor handles them
* (e.g. `h = 25` rolls into the next day).
*
* @example
* jalaaliToDateObject(1400, 4, 30)
*   // → new Date(2021, 6, 21, 0, 0, 0, 0)
*
* jalaaliToDateObject(1400, 4, 30, 14, 30)
*   // → new Date(2021, 6, 21, 14, 30)
*/
function jalaaliToDateObject(jy, jm, jd, h = 0, m = 0, s = 0, ms = 0) {
	const g = toGregorian(jy, jm, jd);
	return new Date(g.gy, g.gm - 1, g.gd, h, m, s, ms);
}
/**
* Returns the Saturday and Friday bounding the Jalaali week that contains
* the given date. The Jalaali week starts on **Saturday**.
*
* @example
* jalaaliWeek(1400, 4, 30)
*   // → { saturday: { jy: 1400, jm: 4, jd: 26 },
*   //     friday:   { jy: 1400, jm: 5, jd:  1 } }
*
* @remarks
* Uses {@link jalaaliToDateObject} to read the day-of-week, which reflects
* the host's local time zone. For dates near a DST boundary the underlying
* `Date.getDay()` is still correct because the conversion is done in local
* time on both sides.
*/
function jalaaliWeek(jy, jm, jd) {
	const dayOfWeek = jalaaliToDateObject(jy, jm, jd).getDay();
	const startDayDifference = dayOfWeek === 6 ? 0 : -(dayOfWeek + 1);
	const endDayDifference = 6 + startDayDifference;
	return {
		saturday: d2j(j2d(jy, jm, jd + startDayDifference)),
		friday: d2j(j2d(jy, jm, jd + endDayDifference))
	};
}
/**
* Core of the Borkowski algorithm: locate the Jalaali year inside the
* cycle table and compute Farvardin 1's Gregorian date.
*/
function jalCalCore(jy) {
	if (!Number.isFinite(jy) || jy < MIN_JALAALI_YEAR || jy > MAX_JALAALI_YEAR) throw new RangeError(`Invalid Jalaali year ${jy}: must be a finite number between ${MIN_JALAALI_YEAR} and ${MAX_JALAALI_YEAR} (inclusive)`);
	const gy = jy + 621;
	let leapJ = -14;
	let jp = BREAKS[0];
	let jm = 0;
	let jump = 0;
	for (let i = 1; i < BREAKS.length; i += 1) {
		jm = BREAKS[i];
		jump = jm - jp;
		if (jy < jm) break;
		leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
		jp = jm;
	}
	const n = jy - jp;
	leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
	if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
	const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
	return {
		gy,
		march: 20 + leapJ - leapG,
		jump,
		n
	};
}
/**
* Given a 33-year cycle length `jump` and the year offset `n` within that
* cycle, returns the number of years since the last leap year (`0 … 4`).
* `0` means the current year is leap.
*/
function leapFromCycle(jump, n) {
	let adjusted = n;
	if (jump - n < 6) adjusted = n - jump + div(jump + 4, 33) * 33;
	let leap = mod(mod(adjusted + 1, 33) - 1, 4);
	if (leap === -1) leap = 4;
	return leap;
}
/**
* Leap-only variant — same loop as {@link jalCalCore} without computing
* the Gregorian fields. Kept separate to avoid the per-call object
* allocation on the hot `isLeapJalaaliYear` path.
*/
function jalCalLeap(jy) {
	if (!Number.isFinite(jy) || jy < MIN_JALAALI_YEAR || jy > MAX_JALAALI_YEAR) throw new RangeError(`Invalid Jalaali year ${jy}: must be a finite number between ${MIN_JALAALI_YEAR} and ${MAX_JALAALI_YEAR} (inclusive)`);
	let jp = BREAKS[0];
	let jm = 0;
	let jump = 0;
	for (let i = 1; i < BREAKS.length; i += 1) {
		jm = BREAKS[i];
		jump = jm - jp;
		if (jy < jm) break;
		jp = jm;
	}
	return leapFromCycle(jump, jy - jp);
}
/**
* Integer division — `Math.trunc(a / b)` equivalent that's faster on V8
* for values that fit in 32 bits. Used pervasively inside the algorithm.
*/
function div(a, b) {
	return ~~(a / b);
}
/**
* Mathematical modulo — like `%` but always returns a non-negative result
* when `b` is positive (matches Python's `%` semantics, not JavaScript's).
*/
function mod(a, b) {
	return a - ~~(a / b) * b;
}
//#endregion
global.jalaali = {
  toJalaali: toJalaali,
  toGregorian: toGregorian,
  isValidJalaaliDate: isValidJalaaliDate,
  isLeapJalaaliYear: isLeapJalaaliYear,
  jalaaliMonthLength: jalaaliMonthLength,
  jalCal: jalCal,
  jalaaliToDateObject: jalaaliToDateObject,
  jalaaliWeek: jalaaliWeek,
  MIN_JALAALI_YEAR: MIN_JALAALI_YEAR,
  MAX_JALAALI_YEAR: MAX_JALAALI_YEAR
};
})(window);
</script>
<style>
  :root{
    /* ---- palette: an ink-and-hairline logbook, not a glowing panel ----
       One signal colour (amber) marks anything that is "now": today, the
       streak, the add button. One alert colour marks overdue. Everything
       else is neutral ink so the numbers can carry the page. */
    --bg:#0A0D14;
    --surface:#141A25;
    --surface-2:#1C2431;
    --surface-3:#28323F;
    --line: rgba(148,166,196,0.15);
    --line-strong: rgba(148,166,196,0.30);
    --text:#E7EAF1;
    --text-muted:#8592A6;
    --accent:#F2B134;
    --accent2:#7C8CFF;
    --danger:#DF5C6E;
    --python:#56BECE;
    --english:#BE76C4;
    --freelance:#71CC8D;
    --fitness:#DF5C6E;
    --gray-tag:#8592A6;
    --display:'Markazi Text', 'Vazirmatn', serif;
    /* flat surfaces: a hairline and a whisper of lift, nothing more */
    --glass-blur: none;
    --glass-fill: var(--surface);
    --glass-fill-2: var(--surface-2);
    --glass-fill-3: var(--surface-3);
    --glass-shadow: 0 1px 2px rgba(0,0,0,0.30);
    --glass-shadow-sm: 0 1px 2px rgba(0,0,0,0.24);
    --chip-shine: none;
    color-scheme: dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(148,166,196,0.05), transparent 220px);
  }
  .app{position:relative; z-index:1;}
  .mono{font-family:'JetBrains Mono', monospace; direction:ltr; display:inline-block;}
  button, input, textarea, select{font-family:inherit;}

  .app{max-width:800px; margin:0 auto; padding:26px 16px 90px;}

  header{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .brand h1{font-family:var(--display); font-size:34px; font-weight:700; line-height:1; letter-spacing:0;}
  .brand .sub{font-size:11.5px; color:var(--text-muted); font-weight:500; margin-top:3px;}
  .date-block{text-align:left;}
  .date-block .jalali{font-family:var(--display); font-size:20px; line-height:1.1; color:var(--text); font-weight:600;}
  .date-block .gregorian{font-size:11px; color:var(--text-muted); margin-top:3px;}

  /* ---- navigation ----
     Sections are grouped by what they're for (NAV_GROUPS). New sections join a
     group, so the bars never get more crowded than the number of groups:
       phones (≤640)      bottom bar of groups + the group's sections as tabs up top
       tablets (641–1099) the same groups in a right-hand rail, tabs up top
       laptops (≥1100)    full sidebar listing every section, no tabs needed */
  nav.main-nav{display:flex; background:var(--surface);}
  .nav-groups{display:flex;}
  .nav-scroll{display:none;}
  .nav-group-title{display:block; font-size:12px; font-weight:600; color:var(--text-muted); padding:0 12px 6px; opacity:.8;}
  .nav-item, .nav-group-btn{
    position:relative; background:transparent; border:none; color:var(--text-muted);
    font-family:inherit; font-weight:600; cursor:pointer; white-space:nowrap;
    display:flex; align-items:center; transition:background .15s, color .15s;
  }
  .nav-item:hover:not(.active), .nav-group-btn:hover:not(.active){color:var(--text); background:var(--surface-2);}
  .nav-item.active, .nav-group-btn.active{color:var(--text);}
  .nav-item.active{background:var(--surface-3);}
  .nav-item.active .nav-icon, .nav-group-btn.active .nav-icon{color:var(--accent);}
  .nav-item:focus-visible, .nav-group-btn:focus-visible, .nav-add:focus-visible, .subnav button:focus-visible{
    outline:2px solid var(--accent); outline-offset:-2px;
  }
  .nav-icon{display:inline-flex; align-items:center; justify-content:center;}
  .nav-add{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--accent); color:#16120A; border:none; cursor:pointer;
    font-family:inherit; font-weight:800;
  }
  .nav-add:hover{opacity:.92;}

  /* the current group's sections, as tabs under the header */
  .subnav{
    position:sticky; top:0; z-index:30; margin:0 -16px 18px; padding:8px 16px;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .subnav-scroll{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; overscroll-behavior-x:contain;}
  .subnav-scroll::-webkit-scrollbar{display:none;}
  .subnav button{
    flex:1 0 auto; justify-content:center; min-height:40px; padding:8px 14px; border-radius:10px;
    background:transparent; border:1px solid transparent; color:var(--text-muted);
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:7px;
  }
  .subnav button:hover:not(.active){color:var(--text); background:var(--surface-2);}
  .subnav button.active{background:var(--surface-3); border-color:var(--line-strong); color:var(--text);}
  /* only when a group has more tabs than fit: fade the far edge as a hint */
  .subnav-scroll.overflowing{
    -webkit-mask-image:linear-gradient(to left, transparent 0, #000 32px);
            mask-image:linear-gradient(to left, transparent 0, #000 32px);
    padding-inline-end:24px;
  }

  /* phones: bottom bar of groups */
  @media (max-width: 640px){
    nav.main-nav{
      position:fixed; bottom:0; left:0; right:0; z-index:45; gap:4px;
      padding:6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
      border-top:1px solid var(--line); box-shadow:0 -4px 16px -8px rgba(0,0,0,.7);
    }
    .nav-groups{flex:1; gap:4px;}
    .nav-group-btn{
      flex:1 1 0; min-width:0; min-height:56px; padding:6px 2px; border-radius:12px;
      flex-direction:column; justify-content:center; gap:5px; font-size:12.5px;
    }
    .nav-group-btn.active{background:var(--surface-3);}
    .nav-group-btn.active::after{
      content:''; position:absolute; top:0; left:28%; right:28%; height:2px;
      background:var(--accent); border-radius:0 0 2px 2px;
    }
    .nav-add{
      flex:0 0 60px; flex-direction:column; gap:5px; border-radius:12px;
      background:transparent; color:var(--accent); font-size:12.5px; font-weight:700;
    }
    .nav-add .nav-icon{width:30px; height:30px; border-radius:50%; background:var(--accent); color:#16120A;}
    /* leave room so the bottom bar never covers the last item
       (the undo-toast offset lives at the end of this stylesheet so it
        isn't overridden by the later base rule) */
    body{padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px));}
  }

  /* tablets and up: nav moves to a rail on the right edge */
  @media (min-width: 641px){
    nav.main-nav{
      position:fixed; top:0; bottom:0; right:0; z-index:45; flex-direction:column; gap:12px;
      width:96px; padding:16px 8px; border-left:1px solid var(--line); overflow-y:auto; scrollbar-width:thin;
    }
    body{padding-right:96px;}
    .nav-add{order:-1; flex-direction:column; gap:4px; min-height:56px; border-radius:12px; font-size:12.5px;}
    .nav-groups{flex-direction:column; gap:4px;}
    .nav-group-btn{
      flex-direction:column; justify-content:center; gap:5px; min-height:64px;
      padding:8px 4px; border-radius:12px; font-size:12.5px;
    }
    .nav-group-btn.active{background:var(--surface-3);}
    .nav-group-btn.active::before, .nav-item.active::before{
      content:''; position:absolute; right:-8px; top:12px; bottom:12px; width:3px;
      background:var(--accent); border-radius:3px 0 0 3px;
    }
  }

  /* laptops: full sidebar, every section listed, tabs not needed */
  @media (min-width: 1100px){
    nav.main-nav{width:240px; padding:22px 14px; gap:20px;}
    body{padding-right:240px;}
    .nav-add{flex-direction:row; min-height:44px; font-size:14px; border-radius:10px;}
    .nav-groups{display:none;}
    .nav-scroll{display:flex; flex-direction:column; gap:16px;}
    .nav-group{display:flex; flex-direction:column; gap:2px;}
    .nav-group + .nav-group{border-top:1px solid var(--line); padding-top:16px;}
    .nav-item{gap:12px; min-height:42px; padding:8px 12px; border-radius:10px; font-size:14px;}
    .nav-item.active::before{right:-14px; top:9px; bottom:9px;}
    .subnav{display:none;}
  }

  /* archive sub-tabs */
  .archive-tabs{display:flex; gap:6px; margin-bottom:14px;}
  .archive-tabs button{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted);
    font-family:inherit; font-size:13px; font-weight:700; padding:9px; border-radius:9px; cursor:pointer;
  }
  .archive-tabs button.active{background:var(--surface-3); color:var(--text); border-color:var(--accent);}

  /* purchases */
  .add-purchase-box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px;}
  .add-purchase-box > input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:14px;
    padding:10px 12px; border-radius:9px; outline:none; font-family:inherit; margin-bottom:10px;
  }
  .add-purchase-box > input:focus{border-color:var(--accent);}
  .add-purchase-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
  /* One look for every field. :where() keeps this at zero specificity, so any
     component rule (.modal-title-input, .add-idea-box textarea, …) still wins;
     this only catches inputs nobody styled, which used to fall back to the
     browser's grey box. */
  :where(input:not([type=checkbox],[type=radio],[type=color],[type=file],[type=range]), select, textarea){
    background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-family:inherit; font-size:13px; padding:7px 10px; border-radius:8px; outline:none;
  }
  :where(input, select, textarea):focus{border-color:var(--accent);}
  :where(input, textarea)::placeholder{color:var(--text-muted); opacity:.75;}
  input[type=number]{-moz-appearance:textfield; appearance:textfield;}
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; margin:0;}
  .num-text{
    width:80px; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-family:inherit; font-size:12.5px; padding:6px 10px; border-radius:8px; outline:none; text-align:center;
  }
  .num-text:focus{border-color:var(--accent);}
  .add-purchase-row .num-text{flex:1 1 60px; min-width:0; max-width:140px;}
  .add-purchase-row button{
    margin-right:auto; background:var(--accent); color:#12161C; border:none; font-family:inherit;
    font-size:13px; font-weight:700; padding:8px 16px; border-radius:8px; cursor:pointer;
  }
  .purchases-total{
    font-size:12.5px; font-weight:700; color:var(--accent); margin-bottom:12px; padding:8px 12px;
    background:color-mix(in srgb, var(--accent) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius:9px; text-align:center;
  }

  /* ideas */
  .add-idea-box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px;}
  .add-idea-box textarea{
    width:100%; min-height:80px; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:14px; padding:10px 12px; border-radius:9px; outline:none; font-family:inherit; resize:vertical; line-height:1.8;
  }
  .add-idea-box textarea:focus{border-color:var(--accent);}
  .move-pick-tags{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px;}
  .add-idea-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .add-idea-btn{
    margin-top:10px; background:var(--accent); color:#12161C; border:none; font-family:inherit;
    font-size:13px; font-weight:700; padding:9px 18px; border-radius:8px; cursor:pointer;
  }
  .idea-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
  .idea-body{font-size:14px; line-height:1.9; color:var(--text); white-space:pre-wrap;}
  .idea-footer{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px;}
  .idea-footer .item-del{
    background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:2px 6px; flex-shrink:0;
  }
  .idea-footer .item-del:hover{color:var(--danger);}
  .idea-actions{display:flex; align-items:center; gap:2px; flex-shrink:0;}
  .idea-actions .item-edit{
    background:none; border:none; color:var(--text-muted); cursor:pointer; padding:2px 6px; display:inline-flex;
  }
  .idea-actions .item-edit:hover{color:var(--accent);}
  .idea-image-strip{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .idea-thumb{position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden; border:1px solid var(--line);}
  .idea-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .idea-thumb-x, .idea-thumb-dl{
    position:absolute; top:4px; left:4px; width:22px; height:22px; border-radius:6px;
    background:rgba(8,10,20,.72); border:1px solid var(--line); color:#fff;
    font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .idea-thumb-x:hover{background:var(--danger);}
  .idea-thumb-dl:hover{background:var(--accent); color:#12161C;}
  .add-idea-actions{display:flex; align-items:stretch; gap:8px; margin-top:10px;}
  .add-idea-actions .add-idea-btn{margin-top:0;}
  .add-idea-actions .add-idea-btn, .add-idea-actions .idea-img-btn{
    font-size:13px; line-height:1.4; padding:9px 16px; justify-content:center;
  }
  .idea-img-btn{
    display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line);
    color:var(--text-muted); font-size:12.5px; font-weight:700; padding:9px 14px; border-radius:8px; cursor:pointer;
  }
  .idea-img-btn:hover{border-color:var(--accent); color:var(--accent);}
  .idea-editor-textarea{
    width:100%; min-height:110px; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:14px; padding:10px 12px; border-radius:9px; outline:none; font-family:inherit; resize:vertical; line-height:1.9;
  }
  .idea-editor-textarea:focus{border-color:var(--accent);}
  .idea-tags{display:flex; flex-wrap:wrap; gap:5px;}
  .ideas-filter{margin-bottom:14px;}

  .icn{display:inline-block; vertical-align:-0.18em; flex-shrink:0;}
  h2.section-title{font-family:var(--display); font-size:23px; font-weight:600; color:var(--text); margin:26px 0 12px; line-height:1.2;}
  .print-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); font-size:11.5px; font-weight:700;
    padding:7px 12px; border-radius:8px; cursor:pointer;
  }
  .print-btn:hover{border-color:var(--accent); color:var(--accent);}

  /* the print sheet is invisible on screen; only shown (and everything else hidden) when printing */
  .print-sheet{display:none;}
  @media print{
    body{background:#fff !important;}
    body::before{display:none !important;}
    #app > *:not(main){display:none !important;}
    main > *:not(.print-sheet){display:none !important;}
    .print-sheet{
      display:block !important; color:#000; background:#fff; font-family:'Vazirmatn', sans-serif; padding:0;
    }
    .print-sheet h1{font-size:20px; margin-bottom:4px;}
    .print-sheet .print-date{font-size:13px; color:#333; margin-bottom:20px;}
    .print-task{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #ccc; break-inside:avoid;}
    .print-checkbox{width:16px; height:16px; border:2px solid #000; flex-shrink:0; margin-top:3px;}
    .print-checkbox.small{width:12px; height:12px; border-width:1.5px;}
    .print-checkbox.checked{background:#000;}
    .print-task-title{font-size:15px; font-weight:700; color:#000;}
    .print-task-title.done{text-decoration:line-through; color:#666;}
    .print-task-meta{font-size:12px; color:#444; margin-top:4px;}
    .print-subtasks{margin-top:6px;}
    .print-subtask{display:flex; align-items:center; gap:6px; font-size:12.5px; color:#222; margin-top:4px;}
  }
  h2.section-title:first-child{margin-top:0;}

  .add-task-btn{
    width:100%; background:var(--surface); border:1px dashed var(--line); color:var(--text-muted);
    font-size:13.5px; font-weight:700; padding:13px; border-radius:9px; cursor:pointer; margin-bottom:18px; text-align:center;
  }
  .add-task-btn:hover{border-color:var(--accent); color:var(--accent);}

  .add-task-for-day-btn{
    width:100%; background:color-mix(in srgb, var(--accent) 14%, var(--surface));
    border:1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); color:var(--accent);
    font-size:13px; font-weight:700; padding:11px; border-radius:10px; cursor:pointer; text-align:center;
  }
  .add-task-for-day-btn:hover{opacity:.9;}
  .add-task-for-day-btn:disabled{opacity:.5; cursor:default;}
  .add-task-for-day-btn.secondary{
    background:var(--surface-2); border-color:var(--line); color:var(--text-muted);
  }
  .cal-day-actions{display:flex; flex-direction:column; gap:8px; margin-bottom:14px;}
  .cal-day-total{
    font-size:12.5px; font-weight:700; color:var(--freelance); margin-bottom:12px; padding:8px 12px;
    background:color-mix(in srgb, var(--freelance) 12%, transparent); border:1px solid color-mix(in srgb, var(--freelance) 30%, transparent);
    border-radius:9px; text-align:center;
  }

  /* Progress box */
  .progress-box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px;}
  .progress-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .progress-header h2{margin:0;}
  .goal-block{margin-bottom:14px;}
  .goal-block:last-child{margin-bottom:0;}
  /* label and figure share a line above a full-width bar, so neither the
     tag name nor the hours get squeezed into a 64px column */
  .progress-row{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px;}
  .progress-label{font-size:13px; color:var(--text); font-weight:600;}
  .progress-count{
    font-family:var(--display); font-size:17px; line-height:1; color:var(--text-muted);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .progress-count.reached{color:var(--freelance);}
  .progress-bar-track{height:4px; background:var(--surface-2); border-radius:2px; overflow:hidden;}
  .progress-bar-fill{height:100%; border-radius:2px; transition:width .3s;}

  /* Time-spent box */

  /* Tag manager */
  .tag-manager{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px;}
  .tag-manager-header{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .tag-manager-header h3{font-size:13px; font-weight:700; color:var(--text-muted);}
  .tag-manager-header .chev{color:var(--text-muted); font-size:12px;}
  .tag-manager-body{margin-top:12px;}
  .tag-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .tag-chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:7px;
    font-size:12px; font-weight:600; border:1px solid transparent; cursor:pointer; user-select:none;
    background:color-mix(in srgb, var(--chip-color) 16%, var(--surface-2)); color:var(--chip-color);
  }
  .tag-chip .tag-x{opacity:.6; font-size:11px;}
  .tag-color-dot{
    position:relative; width:14px; height:14px; border-radius:50%; flex-shrink:0; cursor:pointer;
    background:var(--chip-color); border:1px solid color-mix(in srgb, var(--chip-color) 60%, white 40%);
  }
  .tag-color-dot input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0;}
  .tag-chip .tag-x:hover{opacity:1;}
  .new-tag-row{display:flex; gap:8px; align-items:center;}
  .new-tag-row input[type=text]{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:13px; padding:8px 10px; border-radius:7px; outline:none;
  }
  .new-tag-row input[type=color]{
    width:34px; height:34px; border:1px solid var(--line); border-radius:7px; background:none; cursor:pointer; padding:2px;
  }
  .tag-goals-section{margin-top:16px; padding-top:14px; border-top:1px solid var(--line);}
  .tag-goal-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px;}
  .tag-goal-row .num-text{width:84px;}
  .goal-reason-input{
    width:100%; margin-top:6px; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:11.5px; padding:7px 10px; border-radius:8px; outline:none; font-family:inherit;
  }
  .goal-reason-input:focus{border-color:var(--accent);}
  .goal-reason{
    font-size:11.5px; color:var(--text-muted); margin-top:7px; line-height:1.7;
    border-right:2px solid var(--chip-color); padding-right:9px;
  }

  /* undo toast */
  .undo-toast{
    position:fixed; bottom:92px; left:50%; transform:translateX(-50%); z-index:60;
    display:flex; align-items:center; gap:12px; max-width:calc(100% - 32px);
    background:var(--glass-fill-3); backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--line); box-shadow:var(--glass-shadow); border-radius:14px; padding:12px 16px;
  }
  .undo-toast span{font-size:13px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .undo-toast button{
    background:none; border:none; color:var(--accent); font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0; padding:2px 4px;
  }
  .undo-toast .undo-close{color:var(--text-muted); font-weight:400; font-size:12px;}
  /* Same toast, but for a write that did NOT reach the server. No "undo" — the
     change was never persisted; the message only tells you it did not stick. */
  .undo-toast.failed{border-color:var(--danger);}
  .undo-toast.failed span{color:var(--danger); white-space:normal;}
  .recurring-tpl-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 12px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:9px; margin-bottom:8px;
  }
  .recurring-tpl-title{font-size:13px; font-weight:600; color:var(--text);}
  .recurring-tpl-days{font-size:11px; color:var(--text-muted); margin-top:3px;}
  .recurring-tpl-row.paused .recurring-tpl-title{color:var(--text-muted);}
  .recurring-paused-label{color:var(--text-muted); font-weight:700;}
  .recurring-tpl-actions{display:flex; align-items:center; gap:4px; flex-shrink:0;}
  .recurring-pause-btn{
    display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px;
    background:none; border:1px solid var(--line); border-radius:7px; color:var(--text-muted); cursor:pointer;
  }
  .recurring-pause-btn:hover{border-color:var(--accent); color:var(--accent);}
  .recurring-toggle, .apply-future-check{
    display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text); cursor:pointer; user-select:none;
  }
  .recurring-toggle input, .apply-future-check input{width:16px; height:16px; accent-color:var(--accent); cursor:pointer;}
  .recurring-instance-note{
    font-size:12px; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--line);
    border-radius:9px; padding:10px 12px; margin-bottom:14px; line-height:1.8;
  }
  .recurring-instance-note .apply-future-check{margin-top:8px;}
  .new-tag-row button{
    background:var(--surface-3); color:var(--text); border:1px solid var(--line); font-size:12.5px; font-weight:600;
    padding:8px 14px; border-radius:7px; cursor:pointer;
  }
  .new-tag-row button:hover{border-color:var(--accent); color:var(--accent);}

  /* Unified filter panel */
  .filter-panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px;}
  /* collapsed by default so the task list starts higher up the page */
  .filter-toggle{
    display:flex; align-items:center; gap:7px; margin-bottom:12px; cursor:pointer;
    background:transparent; border:1px solid var(--line); color:var(--text-muted);
    border-radius:8px; padding:7px 12px; font-size:12px; font-weight:600; font-family:inherit;
  }
  .filter-toggle.has-active{color:var(--text); border-color:var(--line-strong);}
  .filter-count{
    background:var(--accent); color:#16120A; border-radius:9px; min-width:17px; height:17px;
    display:inline-flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; padding:0 5px;
  }
  .filter-caret{display:inline-flex; margin-inline-start:auto; transition:transform .2s;}
  .filter-caret.open{transform:rotate(180deg);}

  /* one AI-written line per day, above today's plan */
  .encourage{
    display:flex; align-items:flex-start; gap:9px; margin-bottom:16px; padding:12px 14px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    border-inline-start:3px solid var(--accent);
  }
  .encourage-text{font-size:13.5px; line-height:1.85; color:var(--text); flex:1;}
  .encourage.loading .encourage-text{color:var(--text-muted);}

  /* reminders — the "don't let this slip" card at the top of امروز */
  .reminder-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    border-inline-start:3px solid var(--accent2); padding:12px 14px; margin-bottom:16px;
  }
  .reminder-card.urgent{border-inline-start-color:var(--danger);}
  .reminder-card-head{
    display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700;
    color:var(--text-muted); margin-bottom:10px;
  }
  .reminder-card-icon{display:flex; color:var(--accent2);}
  .reminder-card.urgent .reminder-card-icon{color:var(--danger);}
  .reminder-card-more{
    margin-inline-start:auto; background:none; border:none; cursor:pointer;
    font-family:inherit; font-size:11.5px; font-weight:600; color:var(--text-muted); padding:0;
  }
  .reminder-card-more:hover{color:var(--accent);}
  .reminder-line{display:flex; align-items:flex-start; gap:9px; padding:7px 0;}
  .reminder-line + .reminder-line{border-top:1px solid var(--line);}
  .reminder-tick{
    flex-shrink:0; width:20px; height:20px; margin-top:1px; border-radius:6px; cursor:pointer;
    background:transparent; border:1.5px solid var(--line-strong); color:transparent;
    font-size:12px; line-height:1; font-family:inherit;
  }
  .reminder-tick:hover{border-color:var(--accent); color:var(--accent);}
  .reminder-line-main{flex:1; min-width:0;}
  .reminder-line-title{font-size:13.5px; font-weight:600; color:var(--text); line-height:1.7;}
  .reminder-line-meta{
    font-size:11.5px; color:var(--text-muted); margin-top:3px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  }
  .reminder-due{font-weight:600;}
  .reminder-line.soon .reminder-due{color:var(--accent2);}
  .reminder-line.today .reminder-due{color:var(--accent);}
  .reminder-line.late .reminder-due, .reminder-line.expired .reminder-due{color:var(--danger);}
  .reminder-row.today{border-inline-start:3px solid var(--accent);}
  .reminder-row.soon, .reminder-row.pinned{border-inline-start:3px solid var(--accent2);}
  .reminder-row.late, .reminder-row.expired{border-inline-start:3px solid var(--danger);}
  .reminder-row.done{opacity:.5;}
  .reminder-kind-hint{font-size:11.5px; color:var(--text-muted); line-height:1.8; margin-top:8px;}
  .modal-section input[type=text]{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-family:inherit; font-size:13px; padding:9px 12px; border-radius:8px; outline:none;
  }
  .modal-section input[type=text]:focus{border-color:var(--accent);}

  /* subscriptions */
  .sub-row{
    display:flex; align-items:center; gap:10px; padding:13px 14px; margin-bottom:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
  }
  .sub-row.inactive{opacity:.5;}
  .sub-row.due{border-inline-start:3px solid var(--accent);}
  .sub-row.overdue{border-inline-start:3px solid var(--danger);}
  .sub-main{flex:1; min-width:0;}
  .sub-name{font-size:15px; font-weight:600; color:var(--text);}
  .sub-meta{font-size:11.5px; color:var(--text-muted); margin-top:5px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .sub-due{color:var(--text-muted);}
  .sub-row.due .sub-due{color:var(--accent); font-weight:600;}
  .sub-due.late{color:var(--danger); font-weight:600;}
  .sub-actions{display:flex; gap:4px; flex-shrink:0;}
  .sub-actions button{background:none; border:none; color:var(--text-muted); cursor:pointer; padding:5px; font-family:inherit;}
  .sub-section-label{font-size:12px; color:var(--text-muted); font-weight:600; margin:18px 0 10px;}

  /* prompts */
  .prompt-filters{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 16px;}
  .prompt-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;}
  .prompt-head{display:flex; align-items:flex-start; gap:8px;}
  .prompt-title{flex:1; min-width:0; font-size:14.5px; font-weight:700; color:var(--text); line-height:1.7;}
  .prompt-cat{
    display:inline-block; font-size:11px; font-weight:600; color:var(--text-muted); background:var(--surface-2);
    border:1px solid var(--line); border-radius:6px; padding:1px 8px; margin-top:4px;
  }
  .prompt-body{
    margin-top:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:10px 12px; cursor:pointer;
  }
  /* clamp lives on the inner text so the box's padding can't show a sliver of line five */
  .prompt-text{
    font-size:13px; line-height:1.85; color:var(--text); white-space:pre-wrap; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  .prompt-body.open .prompt-text{display:block;}
  .prompt-note{font-size:12px; color:var(--text-muted); line-height:1.8; margin-top:8px;}
  .prompt-actions{display:flex; gap:2px; flex-shrink:0;}
  .prompt-actions button{background:none; border:none; color:var(--text-muted); cursor:pointer; padding:5px; display:inline-flex;}
  .prompt-actions button:hover{color:var(--accent);}
  .prompt-actions button.fav{color:var(--accent);}
  .prompt-actions button.copied{color:var(--accent);}
  .prompt-copy-btn{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px; background:var(--surface-2); border:1px solid var(--line);
    color:var(--text-muted); font-family:inherit; font-size:12px; font-weight:700; padding:7px 14px; border-radius:8px; cursor:pointer;
  }
  .prompt-copy-btn:hover, .prompt-copy-btn.copied{border-color:var(--accent); color:var(--accent);}
  .filter-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .filter-group:last-of-type{margin-bottom:0;}
  .filter-group-label{font-size:11.5px; color:var(--text-muted); font-weight:700; margin-left:2px; flex-shrink:0;}
  .filter-chip{
    padding:5px 12px; border-radius:7px; font-size:11.5px; font-weight:600; cursor:pointer;
    background:transparent; border:1px solid var(--line); color:var(--text-muted);
  }
  .filter-chip.active{background:var(--surface-3); color:var(--text); border-color:var(--line-strong);}
  .filter-group input[type=date]{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); font-size:11.5px;
    padding:4px 8px; border-radius:8px; outline:none;
  }
  .reset-filters-btn{margin-top:4px; background:none; border:1px dashed var(--line); color:var(--text-muted); font-size:11.5px; padding:5px 12px; border-radius:8px; cursor:pointer;}
  .reset-filters-btn:hover{color:var(--danger); border-color:var(--danger);}

  /* Task card (read-only summary; editing happens in modal) */
  .task-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px;}
  .task-card.done{opacity:.5;}
  .task-main{display:flex; align-items:flex-start; gap:10px;}
  .task-check{
    width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line); background:transparent;
    cursor:pointer; flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:12px;
  }
  .task-check.checked{background:var(--accent); border-color:var(--accent);}
  .task-body{flex:1; min-width:0;}
  .task-title{
    font-size:15.5px; font-weight:600; background:transparent; border:none; color:var(--text);
    width:100%; outline:none; padding:2px 0; text-overflow:ellipsis; overflow:hidden;
  }
  .task-title:focus{text-overflow:clip;}
  .task-title.done-text{text-decoration:line-through; color:var(--text-muted); font-weight:500;}
  .task-del{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:15px; padding:2px 6px; flex-shrink:0;}
  .task-del:hover{color:var(--danger);}

  .task-meta-row{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:8px;}
  .summary-text{font-size:11.5px; color:var(--text-muted); font-weight:600;}
  .mini-tag{
    display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:5px; font-size:11px; font-weight:600;
    border:1px solid transparent; color:var(--chip-color);
  }
  .priority-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .priority-dot.high{background:var(--danger);}
  .priority-dot.medium{background:var(--accent);}
  .priority-dot.low{background:var(--freelance);}

  .edit-link{
    margin-top:12px; background:none; border:1px solid var(--line); color:var(--text-muted); font-size:12px; font-weight:600;
    padding:6px 14px; border-radius:8px; cursor:pointer;
  }
  .edit-link:hover{border-color:var(--accent); color:var(--accent);}

  .subtasks{margin-top:12px; padding-right:30px; border-right:2px solid var(--line);}
  .subtask-row{display:flex; align-items:center; gap:8px; padding:5px 0;}
  .subtask-check{
    width:16px; height:16px; border-radius:5px; border:1.5px solid var(--line); background:transparent;
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:10px;
  }
  .subtask-check.checked{background:var(--freelance); border-color:var(--freelance);}
  .subtask-title{flex:1; font-size:13px; color:var(--text);}
  .subtask-title.done-text{text-decoration:line-through; color:var(--text-muted);}
  .subtask-del{background:none; border:none; color:var(--text-muted); opacity:.5; cursor:pointer; font-size:13px;}
  .subtask-del:hover{opacity:1; color:var(--danger);}
  .add-subtask-row{display:flex; gap:8px; margin-top:6px;}
  .add-subtask-row input{
    flex:1; background:transparent; border:none; border-bottom:1px dashed var(--line); color:var(--text);
    font-size:12.5px; padding:5px 2px; outline:none;
  }
  .add-subtask-row input:focus{border-bottom-color:var(--accent);}
  .add-subtask-row button{background:none; border:none; color:var(--text-muted); font-size:12px; cursor:pointer; font-weight:600;}
  .add-subtask-row button:hover{color:var(--accent);}

  .empty-state{text-align:center; color:var(--text-muted); font-size:13px; padding:36px 0;}

  /* Today view scheduled items.
     Overdue used to shout three times at once (glowing border + red pill +
     priority dot). Now it says it once, on the leading edge of the row. */
  .today-item{background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden;}
  .today-item.done{opacity:.45;}
  .today-item.overdue:not(.done){border-inline-start:3px solid var(--danger);}
  .overdue-badge{
    display:inline-flex; align-items:center; padding:0; font-size:11.5px; font-weight:600;
    color:var(--danger); white-space:nowrap; background:none; border:none;
  }
  .today-item-row{display:flex; align-items:flex-start; gap:10px; padding:13px 14px; cursor:pointer;}
  .today-item-row .priority-dot, .today-item-row .task-check{margin-top:3px;}
  .today-item .ti-main{flex:1; min-width:0;}
  .today-item .ti-title-row{display:flex; align-items:center; gap:6px;}
  .today-item .ti-title{
    flex:1; font-size:15px; font-weight:600; min-width:0; line-height:1.55; color:var(--text);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .today-item .ti-title.done-text{text-decoration:line-through; color:var(--text-muted); font-weight:500;}
  .today-item .ti-meta-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:7px;}
  .today-item .dur{
    display:inline-flex; align-items:center; padding:0; font-size:11.5px; font-weight:600;
    font-variant-numeric:tabular-nums; color:var(--text-muted); background:none; border:none;
  }
  .today-item .expand-arrow{font-size:10px; color:var(--text-muted); transition:transform .15s; flex-shrink:0; margin-top:4px;}
  .today-item .expand-arrow.open{transform:rotate(180deg);}
  .today-item .ti-actions{display:flex; align-items:center; gap:0; flex-shrink:0;}
  .today-item .item-del{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:2px 4px; flex-shrink:0;}
  .today-item .item-del:hover{color:var(--danger);}
  .today-subtasks{padding:0 14px 12px 14px; border-top:1px solid var(--line); padding-top:8px;}

  /* Task editor modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,10,20,0.4); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  }
  .modal-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto;}
  .modal-box h3{font-size:15px; font-weight:700; margin-bottom:16px;}
  .modal-title-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:14px;
    padding:11px 14px; border-radius:9px; outline:none; margin-bottom:18px;
  }
  .modal-title-input:focus{border-color:var(--accent);}
  .modal-section{margin-bottom:16px;}
  .modal-section-label{font-size:11.5px; color:var(--text-muted); font-weight:700; margin-bottom:8px; display:block;}
  .pick-chip{
    display:inline-flex; align-items:center; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:600;
    cursor:pointer; margin:0 4px 4px 0; border:1px solid var(--line); background:var(--surface-2); color:var(--text-muted);
  }
  .pick-chip.on{background:color-mix(in srgb, var(--chip-color) 20%, var(--surface-2)); color:var(--chip-color); border-color:var(--chip-color);}
  .priority-chip{
    padding:4px 11px; border-radius:14px; font-size:11px; font-weight:700; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); margin-left:4px;
  }
  .priority-chip.high.active{background:color-mix(in srgb, var(--danger) 22%, var(--surface-2)); color:var(--danger); border-color:var(--danger);}
  .priority-chip.medium.active{background:color-mix(in srgb, var(--accent) 22%, var(--surface-2)); color:var(--accent); border-color:var(--accent);}
  .priority-chip.low.active{background:color-mix(in srgb, var(--freelance) 22%, var(--surface-2)); color:var(--freelance); border-color:var(--freelance);}
  .quick-group{display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .quick-chip{
    padding:4px 10px; border-radius:8px; font-size:11.5px; font-weight:600; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted);
  }
  .quick-chip.active{background:color-mix(in srgb, var(--accent) 20%, var(--surface-2)); color:var(--accent); border-color:var(--accent);}
  .quick-chip.suggestion-chip{background:color-mix(in srgb, var(--python) 18%, var(--surface-2)); color:var(--python); border-color:var(--python);}
  .modal-section input[type=date]{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); font-size:11.5px;
    padding:4px 8px; border-radius:8px; outline:none;
  }
  .modal-section input[type=number], .modal-section input.num-text{
    width:70px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); font-size:11.5px;
    padding:4px 6px; border-radius:8px; outline:none; text-align:center;
  }
  .modal-subtask-row{display:flex; align-items:center; gap:8px; padding:5px 0;}
  .modal-subtask-row span{flex:1; font-size:13px;}
  .modal-add-subtask{display:flex; gap:8px; margin-top:6px;}
  .modal-add-subtask input{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:12.5px;
    padding:7px 10px; border-radius:7px; outline:none;
  }
  .modal-add-subtask button{background:var(--surface-3); border:1px solid var(--line); color:var(--text); font-size:12px; padding:7px 12px; border-radius:7px; cursor:pointer;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:20px;}
  .modal-actions button{padding:10px 22px; border-radius:9px; font-size:13.5px; font-weight:700; cursor:pointer; border:1px solid var(--line); background:var(--surface-2); color:var(--text);}
  .modal-actions button.confirm{background:var(--accent); color:#12161C; border-color:var(--accent);}
  .modal-actions button.confirm:hover{opacity:.9;}
  .modal-actions button.cancel:hover{border-color:var(--danger); color:var(--danger);}

  .loading{text-align:center; color:var(--text-muted); font-size:13px; padding:60px 0;}

  /* today-item extra action buttons */
  .today-item .item-edit{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; padding:2px 4px; flex-shrink:0;}
  .today-item .item-edit:hover{color:var(--accent);}
  .today-item .item-copy{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; padding:2px 4px; flex-shrink:0;}
  .today-item .item-copy:hover{color:var(--freelance);}

  .copy-link{
    margin-top:12px; margin-right:8px; background:none; border:1px solid var(--line); color:var(--text-muted); font-size:12px; font-weight:600;
    padding:6px 14px; border-radius:8px; cursor:pointer;
  }
  .copy-link:hover{border-color:var(--freelance); color:var(--freelance);}
  .task-actions-row{display:flex; gap:0;}

  /* drag-and-drop subtask reordering (editor modal) — desktop mouse users */
  .modal-subtask-row{cursor:default;}
  .modal-subtask-row.dragging{opacity:.4;}
  .modal-subtask-row .drag-handle{cursor:grab; color:var(--text-muted); font-size:13px; padding:0 2px; flex-shrink:0; user-select:none;}
  .modal-subtask-row .drag-handle:active{cursor:grabbing;}

  /* up/down reorder buttons — reliable fallback for touch/mobile, since native
     HTML5 drag-and-drop does not work with touch on most mobile browsers */
  .subtask-move-btns{display:flex; flex-direction:column; gap:1px; flex-shrink:0;}
  .subtask-move-btn{
    background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:9px; line-height:1;
    padding:2px 4px; border-radius:4px;
  }
  .subtask-move-btn:hover:not(:disabled){color:var(--accent);}
  .subtask-move-btn:disabled{opacity:.25; cursor:default;}

  /* Custom Jalali calendar (task date picker) */
  .date-picker-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:12.5px; font-weight:600;
    padding:7px 12px; border-radius:8px; cursor:pointer;
  }
  .date-picker-btn:hover{border-color:var(--accent); color:var(--accent);}
  .task-calendar{margin-top:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px;}
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px;}
  .cal-nav{background:var(--surface-3); border:1px solid var(--line); color:var(--text); font-size:11px; font-weight:600; padding:6px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;}
  .cal-nav:hover{border-color:var(--accent); color:var(--accent);}
  .cal-title{display:flex; flex-direction:column; align-items:center; text-align:center; flex:1;}
  .cal-jalali{font-size:13px; font-weight:700; color:var(--text);}
  .cal-greg{font-size:10.5px; color:var(--text-muted); margin-top:2px;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
  .cal-weekdays span{text-align:center; font-size:11px; color:var(--text-muted); font-weight:700;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-cell{
    position:relative; min-height:46px; border-radius:8px; padding:4px 2px; cursor:pointer;
    background:var(--surface); border:1px solid transparent; display:flex; flex-direction:column; align-items:center;
  }
  .cal-cell.empty{background:transparent; cursor:default; border:none;}
  .cal-cell:not(.empty):hover{border-color:var(--accent);}
  .cal-cell.today{border-color:var(--freelance);}
  .cal-cell.selected{background:color-mix(in srgb, var(--accent) 22%, var(--surface)); border-color:var(--accent);}
  .cal-daynum{font-size:12px; font-weight:700; color:var(--text);}
  .cal-cell.today .cal-daynum{
    background:linear-gradient(155deg, color-mix(in srgb, var(--freelance) 65%, white 25%), var(--freelance) 65%);
    color:#0E2A18; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px -2px rgba(127,217,154,0.6), inset 0 1px 0.5px rgba(255,255,255,0.5);
  }
  .cal-info-btn{position:absolute; top:2px; left:2px; font-size:10px; color:var(--text-muted); cursor:pointer; line-height:1; padding:1px;}
  .cal-info-btn:hover{color:var(--accent);}
  .cal-tags{display:flex; gap:2px; margin-top:4px; align-items:center;}
  .cal-tag-dot{width:6px; height:6px; border-radius:50%; display:inline-block; flex-shrink:0;}
  .cal-tag-more{font-size:9px; color:var(--text-muted);}
  .cal-day-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px;}
  .cal-back{background:var(--surface-3); border:1px solid var(--line); color:var(--text); font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:7px; cursor:pointer; white-space:nowrap;}
  .cal-back:hover{border-color:var(--accent); color:var(--accent);}
  .cal-day-title{font-size:13px; font-weight:700; color:var(--text);}
  .cal-day-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:14px;}
  .cal-day-titlebox{flex:1; text-align:center;}
  .cal-day-weekday{font-size:11px; color:var(--text-muted); font-weight:600;}
  .cal-day-greg{font-size:10.5px; color:var(--text-muted); margin-top:2px; opacity:.85;}
  .cal-day-task{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px;}
  .cal-day-task.preview{background:transparent; border:1px dashed var(--line); opacity:.8;}
  .cal-day-task:last-child{margin-bottom:0;}
  .cal-day-task.done{opacity:.55;}
  .cal-day-task-title{font-size:13.5px; font-weight:600; color:var(--text); margin-bottom:6px;}
  .cal-day-task-title.done-text{text-decoration:line-through; color:var(--text-muted);}

  /* streak badge */
  .streak-badge{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:10px 14px; margin-bottom:16px; width:fit-content; max-width:100%;
  }
  .streak-badge .streak-count.figure-sm{font-size:19px; white-space:nowrap;}
  .streak-flame{display:inline-flex; align-items:center; color:var(--accent); transition:color .2s, opacity .2s;}
  .streak-badge.at-risk .streak-flame{color:var(--text-muted); opacity:.6;}
  .streak-count{font-family:var(--display); font-size:26px; font-weight:700; line-height:1; color:var(--accent); font-variant-numeric:tabular-nums;}
  .streak-badge.at-risk .streak-count{color:var(--text-muted);}
  .streak-label{font-size:11.5px; color:var(--text-muted);}
  .streak-freeze{
    display:inline-flex; align-items:center; gap:4px; margin-inline-start:6px; padding-inline-start:10px;
    border-inline-start:1px solid var(--line); color:var(--python); font-size:13px; font-weight:700;
  }
  .streak-freeze.empty{color:var(--text-muted); opacity:.6;}

  /* shared "pick a task from a list" pattern — used by the move-to-day calendar picker */
  .actual-time-row{font-size:11.5px; color:var(--freelance); margin-top:4px;}
  .pomo-task-pick-list{max-height:260px; overflow-y:auto; margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .pomo-task-pick-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:9px; padding:9px 12px; cursor:pointer; color:var(--text); font-size:13px;
    font-family:inherit; text-align:right; width:100%;
  }
  .pomo-task-pick-row:hover{border-color:var(--accent);}

  /* archive */
  .archive-search-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:13px;
    padding:9px 12px; border-radius:9px; outline:none;
  }
  .archive-search-input:focus{border-color:var(--accent);}
  .ai-report-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:12px;}
  .ai-report-period{font-size:11.5px; color:var(--text-muted); font-weight:700; margin-bottom:8px;}
  .ai-report-text{font-size:13.5px; line-height:1.9; color:var(--text); white-space:pre-wrap;}

  /* ============ surface system ============
     Flat ink panels separated by hairlines. No blur, no gradients, no rim
     highlights — depth is carried by the hairline and a 1px shadow, so the
     only things that glow on this page are the ones that mean something. */
  nav, .add-task-btn, .progress-box, .tag-manager, .filter-panel, .task-card, .today-item,
  .modal-box, .task-calendar, .cal-day-task, .streak-badge, .cal-nav, .cal-back,
  .date-picker-btn, .reset-filters-btn, .new-tag-row button, .modal-add-subtask button,
  .modal-actions button, .pomo-task-pick-row, .archive-search-input{
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--glass-shadow);
    position:relative;
  }
  .modal-actions button.confirm{background:var(--accent); color:#16120A; border-color:transparent; font-weight:700;}

  /* smaller controls */
  .modal-title-input, .new-tag-row input[type=text], .modal-add-subtask input, .modal-subtask-row,
  .modal-section input[type=date], .modal-section input[type=number], .modal-section input.num-text,
  .filter-group input[type=date], .cal-cell:not(.empty){
    background:var(--surface-2);
    border:1px solid var(--line);

function toFaDigits(str){
  const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return String(str).replace(/[0-9]/g, d => map[d]);
}
/* Shared utility: normalize Persian/Arabic-Indic digits to standard English digits.
   Reusable for any numeric input field on the site. */
function toEnDigits(str){
  const faMap = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
  const arMap = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  return String(str).replace(/[۰-۹٠-٩]/g, d => faMap[d] || arMap[d] || d);
}
/* Shared helper: live-normalizes a text input's value to plain English digits
   (strips anything else that isn't a digit). Call from oninput on numeric text fields. */
function normalizeNumericInput(el){
  const converted = toEnDigits(el.value).replace(/[^0-9]/g, '');
  if(el.value !== converted) el.value = converted;
  return converted;
}

/* ---------- Jalali conversion (Gregorian -> Jalali) ---------- */
function gregorianToJalali(gy, gm, gd){
  const gDayNo = [0,31,59,90,120,151,181,212,243,273,304,334];
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = 355666 + 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) + gd + gDayNo[gm-1];
  let jy = -1595 + 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    jy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  let jm, jd;
  if(days < 186){
    jm = 1 + Math.floor(days/31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + Math.floor((days-186)/30);
    jd = 1 + ((days-186) % 30);
  }
  return [jy, jm, jd];
}

  return `${y}-${m}-${day}`;
}

  const gYear = toFaDigits(d.getFullYear());
  const [jy, jm, jd] = gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  const jalali = `${toFaDigits(jd)} ${MONTHS_JALALI[jm-1]} ${toFaDigits(jy)}`;
  const gregorian = `${gDay} ${gMonth} ${gYear}`;
  return { wd, jalali, gregorian };
}

  if(!dateStr) return null;
  const d = new Date(dateStr);
  const [jy, jm, jd] = gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  return `${toFaDigits(jd)} ${MONTHS_JALALI[jm-1]}`;
}
function formatDuration(min){
  if(!min) return '۰ دقیقه';
  const h = Math.floor(min/60), m = min%60;

  if(h>0) return `${toFaDigits(h)} ساعت`;

}

/* ---------- realtime sync (incremental — no full reload per change) ----------
   Registers per-table INSERT/UPDATE/DELETE handlers on a shared channel. Each
   handler patches only the affected slice of local state, so the cost of every
   change stays constant no matter how much data or how many tables exist.
   To wire up a future table: call registerRealtimeSync(channel, 'table_name',
   { onInsert, onUpdate, onDelete }) inside startRealtimeSync — the rest of the
   plumbing (channel, subscribe, reconnect-reconcile) is already shared. */
function registerRealtimeSync(channel, table, handlers){
  if(handlers.onInsert) channel.on('postgres_changes', { event:'INSERT', schema:'public', table }, payload => handlers.onInsert(payload.new));
  if(handlers.onUpdate) channel.on('postgres_changes', { event:'UPDATE', schema:'public', table }, payload => handlers.onUpdate(payload.new, payload.old));
  if(handlers.onDelete) channel.on('postgres_changes', { event:'DELETE', schema:'public', table }, payload => handlers.onDelete(payload.old));
  return channel;
}
function startRealtimeSync(){
  const channel = sb.channel('planner-sync');

  registerRealtimeSync(channel, 'tags', {
    onInsert(row){
      if(state.tags.some(t => t.id === row.id)) return;
      state.tags.push({ id:row.id, name:row.name, color:row.color });
      render();
    },
    onUpdate(row){
      const t = state.tags.find(t => t.id === row.id);
      if(!t) return;
      t.name = row.name; t.color = row.color;
      render();
    },
    onDelete(old){
      state.tags = state.tags.filter(t => t.id !== old.id);
      state.tasks.forEach(task => { task.tagIds = task.tagIds.filter(id => id !== old.id); });
      state.todayFilters.tagIds = state.todayFilters.tagIds.filter(id => id !== old.id);
      state.tasksFilters.tagIds = state.tasksFilters.tagIds.filter(id => id !== old.id);
      state.ideasFilterTagIds = state.ideasFilterTagIds.filter(id => id !== old.id);
      render();

function sortPurchases(list){
  const arr = [...list];
  if(state.purchaseSort === 'default') return arr;
  return arr.sort((a,b) => {
    /* items without a price always sink to the bottom in either direction —
       "unknown price" is neither cheap nor expensive, so ranking it as either would mislead */
    if(a.price == null && b.price == null) return 0;
    if(a.price == null) return 1;
    if(b.price == null) return -1;
    return state.purchaseSort === 'cheapest' ? a.price - b.price : b.price - a.price;
  });
}

const IDEA_IMAGE_MAX_DIM = 1400;   // downscale before storing — keeps rows small and loads fast
const IDEA_IMAGE_QUALITY = 0.82;
function readAndCompressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, IDEA_IMAGE_MAX_DIM / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', IDEA_IMAGE_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function confirmIdeaEditor(){
  const ed = state.ideaEditor;
  const el = document.getElementById('idea-editor-body');
  if(el) ed.body = el.value;
  const idea = state.ideas.find(x => x.id === ed.ideaId);
  if(!idea){ state.ideaEditor = null; render(); return; }
  const prevImages = idea.images || [];
  idea.body = ed.body.trim();
  idea.tagIds = [...ed.tagIds];
  idea.images = ed.images.map(i => ({ ...i }));
  state.ideaEditor = null;
  render();

  const { error } = await sb.from('ideas').update({ body: idea.body }).eq('id', idea.id);
  if(error) writeFailed('update idea', error);

  const { error: delTagErr } = await sb.from('idea_tags').delete().eq('idea_id', idea.id);
  if(delTagErr) writeFailed('clear idea tags', delTagErr);
  if(idea.tagIds.length){
    const { error: tagErr } = await sb.from('idea_tags').insert(idea.tagIds.map(tagId => ({ idea_id:idea.id, tag_id:tagId })));
    if(tagErr) writeFailed('relink idea tags', tagErr);
  }

  /* diff images instead of wiping and reinserting, so untouched ones keep their
     ids (and we don't re-upload the same base64 payload on every edit) */
  const currIds = new Set(idea.images.map(i => i.id));
  const removed = prevImages.filter(i => !currIds.has(i.id)).map(i => i.id);
  const prevIds = new Set(prevImages.map(i => i.id));
  const added = idea.images.filter(i => !prevIds.has(i.id));
  if(removed.length){
    const { error: e } = await sb.from('idea_images').delete().in('id', removed);
    if(e) writeFailed('delete idea images', e);
  }
  if(added.length){
    const { error: e } = await sb.from('idea_images').insert(added.map(im => ({ id:im.id, idea_id:idea.id, data_url:im.dataUrl, position: idea.images.indexOf(im) })));
    if(e) writeFailed('insert idea images', e);
  }
  await Promise.all(idea.images.filter(i => prevIds.has(i.id)).map(im =>
    sb.from('idea_images').update({ position: idea.images.indexOf(im) }).eq('id', im.id)
      .then(({ error }) => { if(error) writeFailed('reposition idea image', error); })
  ));
}

function getCurrentWeekRange(){
  const today = new Date();
  const daysSinceSaturday = (today.getDay() + 1) % 7; // Sat=0, Sun=1, ... Fri=6
  const start = new Date(today);
  start.setDate(start.getDate() - daysSinceSaturday);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  return { start: dateKey(start), end: dateKey(end) };
}
/* Minutes a single task contributes toward weekly goals.
   Prefers real logged Pomodoro time; falls back to the planned estimate only for
   tasks that were actually completed without ever running a Pomodoro on them, so
   finishing work without the timer still counts. Never sums both — that would
   conflate estimate with reality. */
function taskGoalMinutes(t){
  if(t.actualMin && t.actualMin > 0) return t.actualMin;
  if(t.done && t.durationMin) return t.durationMin;
  return 0;
}
function computeTagWeeklyMinutes(tagId){
  const { start, end } = getCurrentWeekRange();
  return state.tasks
    .filter(t => t.tagIds.includes(tagId))
    .filter(t => {
      // count a completed task toward the week it was actually FINISHED in,
      // not the week it was originally scheduled for — otherwise an overdue
      // task from last week never counts even though you just did the work now
      const relevantDate = (t.done && t.completedAt) ? dateKey(new Date(t.completedAt)) : t.date;
      return relevantDate && relevantDate >= start && relevantDate <= end;
    })
    .reduce((s,t) => s + taskGoalMinutes(t), 0);
}
async function setTagGoal(tagId, weeklyMinutes){
  const existing = state.tagGoals.find(g => g.tagId === tagId);
  if(weeklyMinutes <= 0){
    state.tagGoals = state.tagGoals.filter(g => g.tagId !== tagId);
    render();
    if(existing){
      const { error } = await sb.from('tag_goals').delete().eq('tag_id', tagId);
      if(error) writeFailed('removeTagGoal', error);
    }
    return;
  }
  if(existing) existing.weeklyMinutes = weeklyMinutes;
  else state.tagGoals.push({ tagId, weeklyMinutes, reason:'' });
  render();
  const { error } = await sb.from('tag_goals').upsert({ tag_id:tagId, weekly_minutes:weeklyMinutes, reason: (existing && existing.reason) || '' });
  if(error) writeFailed('setTagGoal', error);
}

}

function applyFiltersAndSort(tasks, pageKey, opts){
  const f = state[pageKey];
  let list = tasks;
  if(f.tagIds.length) list = list.filter(t => t.tagIds.some(id => f.tagIds.includes(id)));
  if(f.priorities.length) list = list.filter(t => f.priorities.includes(t.priority));
  if(opts && opts.dateFilter && f.date){
    if(f.date === 'none') list = list.filter(t => !t.date);
    else list = list.filter(t => t.date === f.date);
  }
  if(f.sortBy === 'today-first'){
    // today's own tasks on top, then overdue ones (oldest overdue last),
    // so opening the app shows what you planned for today rather than a
    // wall of things you already missed
    const todayStr = dateKey(new Date());
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const aOver = !!(a.date && a.date < todayStr);
      const bOver = !!(b.date && b.date < todayStr);
      if(aOver !== bOver) return aOver ? 1 : -1;
      if(aOver && bOver && a.date !== b.date) return b.date.localeCompare(a.date);
      const ar = a.priority ? PRIORITY_RANK[a.priority] : 3;
      const br = b.priority ? PRIORITY_RANK[b.priority] : 3;
      return ar - br;
    });
  } else if(f.sortBy === 'duration-asc'){
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const ad = (a.durationMin==null) ? Infinity : a.durationMin;
      const bd = (b.durationMin==null) ? Infinity : b.durationMin;
      return ad - bd;
    });
  } else if(f.sortBy === 'duration-desc'){
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const ad = (a.durationMin==null) ? -1 : a.durationMin;
      const bd = (b.durationMin==null) ? -1 : b.durationMin;
      return bd - ad;
    });
  } else if(pageKey === 'tasksFilters'){
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const ad = a.date || '9999-99-99';
      const bd = b.date || '9999-99-99';
      if(ad !== bd) return ad.localeCompare(bd);
      const ar = a.priority ? PRIORITY_RANK[a.priority] : 3;
      const br = b.priority ? PRIORITY_RANK[b.priority] : 3;
      return ar - br;
    });
  } else {
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const ar = a.priority ? PRIORITY_RANK[a.priority] : 3;
      const br = b.priority ? PRIORITY_RANK[b.priority] : 3;
      return ar - br;
    });
  }
  return list;
}

  task.done = val;
  task.completedAt = val ? new Date().toISOString() : null;
  /* completing a task completes all its subtasks; re-opening it must re-open them
     too, otherwise you get an "unfinished" task whose every step reads finished */
  task.subtasks.forEach(s => s.done = val);
}

  /* keep local subtask state consistent when the parent's done flag arrives from
     another device — completing a task completes all its subtasks and re-opening
     it re-opens them, so a realtime echo has to mirror the same rule */

/* ---------- write guard ----------
   Every write here is optimistic: local state changes and the screen repaints
   before the server has confirmed anything. That is what makes the app feel
   instant, but it also means a write that never lands — offline, a flaky
   connection, a missing grant — used to be invisible. The failure was logged to
   the console and nothing else: the row sat there looking saved until the next
   reload quietly dropped it.

   Two entry points close that gap, and both say so out loud:
     persist(promise, { message, rollback })  — for a single write whose inverse
       is cheap and obvious. Reverts exactly that change.
     writeFailed(label, error)                — for everything else, including
       multi-statement saves (task + tags + subtasks) where a hand-written
       inverse would be its own source of bugs. It schedules one reconciliation
       against the server, which is authoritative, so local state snaps back to
       what actually got stored.
   scheduleReconcile() is deliberately hard to loop: loadAll() itself writes (it
   rolls over reminders and generates recurring instances), so a dead connection
   could otherwise fail -> reconcile -> fail forever. One in flight at a time,
   and at most one per 10s. */
let saveErrorTimer = null;
function showSaveError(message){
  state.saveError = { message };
  render();
  if(saveErrorTimer) clearTimeout(saveErrorTimer);
  saveErrorTimer = setTimeout(() => { state.saveError = null; render(); }, 8000);
}
function dismissSaveError(){
  state.saveError = null;
  if(saveErrorTimer) clearTimeout(saveErrorTimer);
  render();

const SAVE_FAILED_MSG = 'تغییرت ذخیره نشد — اینترنتت رو چک کن و دوباره امتحان کن.';

let reconcileTimer = null;
let reconcileInFlight = false;
let lastReconcileAt = 0;
function scheduleReconcile(){
  if(reconcileTimer || reconcileInFlight) return;
  if(Date.now() - lastReconcileAt < 10000) return;
  reconcileTimer = setTimeout(async () => {
    reconcileTimer = null;
    reconcileInFlight = true;
    try{ await loadAll(); }
    finally{ reconcileInFlight = false; lastReconcileAt = Date.now(); }
  }, 600);
}

/* Call from any `if(error) ...` branch on a write. Replaces the old bare
   console.error, which only ever reached the devtools console. */
function writeFailed(label, error, message){
  console.error(label + ' failed', error);
  showSaveError(message || SAVE_FAILED_MSG);
  scheduleReconcile();
  return false;
}

async function persist(promise, { message, rollback } = {}){
  let error = null;
  try{
    const res = await promise;
    error = res && res.error;
  } catch(e){
    error = e;
  }
  if(!error) return true;
  console.error('write failed', error);
  if(rollback){
    rollback();
    showSaveError(message || SAVE_FAILED_MSG);
    render();
    return false;
  }
  return writeFailed('write', error, message);
}

const pendingTaskDeleteTimers = {}; // taskId -> timeoutId, while the undo window is open
async function deleteTask(taskId, evt){
  if(evt) evt.stopPropagation();
  const idx = state.tasks.findIndex(t => t.id === taskId);
  if(idx === -1) return;
  const [removed] = state.tasks.splice(idx, 1);
  showUndoToast(`«${removed.title}» حذف شد`, () => {
    clearTimeout(pendingTaskDeleteTimers[taskId]);
    delete pendingTaskDeleteTimers[taskId];
    state.tasks.splice(idx, 0, removed);
    render();
  });
  render();
  /* the actual DB delete waits out the undo window — so undo never needs to
     re-insert anything server-side, it just cancels this timer */
  pendingTaskDeleteTimers[taskId] = setTimeout(async () => {
    delete pendingTaskDeleteTimers[taskId];
    const { error } = await sb.from('tasks').delete().eq('id', taskId);
    if(error) writeFailed('deleteTask', error);
  }, 5000);
}

async function toggleSubtask(taskId, subId, evt){
  if(evt) evt.stopPropagation();
  const t = state.tasks.find(t => t.id === taskId);
  const s = t.subtasks.find(s => s.id === subId);
  s.done = !s.done;
  const wasDone = t.done;
  const allDone = t.subtasks.length && t.subtasks.every(s => s.done);
  /* only flip the parent when the completion state actually changes — calling
     markDone(t, true) unconditionally would re-tick every subtask and clobber the
     very unticking the user just did */
  if(allDone && !wasDone){
    t.done = true;
    t.completedAt = new Date().toISOString();
  } else if(!allDone && wasDone){
    t.done = false;
    t.completedAt = null;
  }
  render();
  const { error } = await sb.from('subtasks').update({ done:s.done }).eq('id', subId);
  if(error) writeFailed('toggleSubtask', error);
  if(t.done !== wasDone){
    const { error: taskErr } = await sb.from('tasks').update({ done:t.done, completed_at:t.completedAt }).eq('id', taskId);
    if(taskErr) writeFailed('parent sync', taskErr);
    // finishing a task by ticking its last subtask should prompt for time/difficulty
    // just like ticking the task itself does
    if(t.done){
      state.taskCompletionModal = { taskId, minutes:null, difficulty:null };
      render();
    }
  }
}
