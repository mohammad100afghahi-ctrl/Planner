/**
* Jalaali years that begin a new 33-year leap cycle. Used by the
* Borkowski algorithm to locate the correct cycle for any given year.
*/
const BREAKS = [
	-61,
	9,
	38,
	199,
	426,
	686,
	756,
	818,
	1111,
	1181,
	1210,
	1635,
	2060,
	2097,
	2192,
	2262,
	2324,
	2394,
	2456,
	3178
];
/** Minimum supported Jalaali year (inclusive). */
const MIN_JALAALI_YEAR = BREAKS[0];
/** Maximum supported Jalaali year (inclusive). */
const MAX_JALAALI_YEAR = BREAKS[BREAKS.length - 1] - 1;
function toJalaali(gyOrDate, gm, gd) {
	if (gyOrDate instanceof Date) return d2j(g2d(gyOrDate.getFullYear(), gyOrDate.getMonth() + 1, gyOrDate.getDate()));

* Converts a Jalaali date to Gregorian.
*
* @example
* toGregorian(1395, 1, 23) // { gy: 2016, gm: 4, gd: 11 }
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/

}

* Returns `true` if `(jy, jm, jd)` is a real date in the Jalaali calendar.
*
* The check is **lenient** — non-integer inputs that happen to fall inside
* the allowed numeric ranges are accepted. Pass integers in production code.
*
* @example
* isValidJalaaliDate(1394, 12, 30) // false (1394 is a common year)
* isValidJalaaliDate(1395, 12, 30) // true  (1395 is leap)
*/

	return jy >= MIN_JALAALI_YEAR && jy <= MAX_JALAALI_YEAR && jm >= 1 && jm <= 12 && jd >= 1 && jd <= jalaaliMonthLength(jy, jm);
}
/**
* Returns `true` if the given Jalaali year is leap (366 days).
*
* @example
* isLeapJalaaliYear(1394) // false
* isLeapJalaaliYear(1395) // true
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/

	return jalCalLeap(jy) === 0;
}

* Returns the number of days in the given Jalaali month.
*
* The function trusts its inputs: `jm` is not range-checked, and an
* out-of-range `jm` will return whichever branch happens to match.
* For input validation, use {@link isValidJalaaliDate} instead.
*
* @example
* jalaaliMonthLength(1394, 12) // 29 (common year)
* jalaaliMonthLength(1395, 12) // 30 (leap year)
*/
function jalaaliMonthLength(jy, jm) {
	if (jm <= 6) return 31;
	if (jm <= 11) return 30;
	return isLeapJalaaliYear(jy) ? 30 : 29;
}
/**
* Computes the leap-cycle state of a Jalaali year and the Gregorian date
* of Farvardin 1 in that year.
*
* Use this directly when you need the leap field; if you only need
* `{ gy, march }`, prefer {@link jalCalShort}.
*
* @example
* jalCal(1391) // { leap: 0, gy: 2012, march: 20 }
* jalCal(1395) // { leap: 0, gy: 2016, march: 20 }
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/
function jalCal(jy) {
	const { gy, march, jump, n } = jalCalCore(jy);
	return {
		leap: leapFromCycle(jump, n),
		gy,
		march
	};
}
/**
* Like {@link jalCal} but omits the leap-cycle computation.
*
* @remarks
* Equivalent to v1's `jalCal(jy, true)` — extracted to its own export
* in v2 to give it a proper return type. Prefer this when the leap field
* isn't needed; it avoids a small amount of work per call.
*
* @example
* jalCalShort(1391) // { gy: 2012, march: 20 }
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/
function jalCalShort(jy) {
	const { gy, march } = jalCalCore(jy);
	return {
		gy,
		march
	};
}
/**
* Converts a Jalaali date to a Julian Day number.
*
* The result is an integer corresponding to noon UT on the given calendar
* day. Inputs are not range-checked — pass valid dates.
*
* @example
* j2d(1395, 1, 23) // 2457490
*/
function j2d(jy, jm, jd) {
	const r = jalCalShort(jy);
	return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
}
const FIRST_JALAALI_JDN = j2d(MIN_JALAALI_YEAR, 1, 1);
const LAST_JALAALI_JDN = j2d(MAX_JALAALI_YEAR, 12, jalaaliMonthLength(MAX_JALAALI_YEAR, 12));
/**
* Converts a Julian Day number to a Jalaali date.
*
* @example
* d2j(2457490) // { jy: 1395, jm: 1, jd: 23 }
*
* @throws {RangeError} if `jdn` falls outside the supported Jalaali range
*   `[-61, 3177]`.
*/
function d2j(jdn) {
	if (jdn < FIRST_JALAALI_JDN || jdn > LAST_JALAALI_JDN) throw new RangeError(`Invalid Julian Day number ${jdn}: outside the supported Jalaali range [${MIN_JALAALI_YEAR}, ${MAX_JALAALI_YEAR}]`);
	const gy = d2g(jdn).gy;
	let jy = Math.min(gy - 621, MAX_JALAALI_YEAR);
	const r = jalCal(jy);
	let k = jdn - g2d(r.gy, 3, r.march);
	if (k >= 0) {
		if (k <= 185) return {
			jy,
			jm: 1 + div(k, 31),
			jd: mod(k, 31) + 1
		};
		k -= 186;
	} else {
		jy -= 1;
		k += 179;
		if (r.leap === 1) k += 1;
	}
	return {
		jy,
		jm: 7 + div(k, 30),
		jd: mod(k, 30) + 1
	};
}
/**
* Converts a Gregorian date to a Julian Day number.
*
* Tested correct from 1 March, -100100 (of both calendars) through several
* million years into the future.
*
* @example
* g2d(2016, 4, 11) // 2457490
*/
function g2d(gy, gm, gd) {
	let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
	d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
	return d;
}
/**
* Converts a Julian Day number to a Gregorian date.
*
* Valid for `jdn ≥ -34839655` (year -100100 of both calendars).
*
* @example
* d2g(2457490) // { gy: 2016, gm: 4, gd: 11 }
*/
function d2g(jdn) {
	let j = 4 * jdn + 139361631;
	j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
	const i = div(mod(j, 1461), 4) * 5 + 308;
	const gd = div(mod(i, 153), 5) + 1;
	const gm = mod(div(i, 153), 12) + 1;
	return {
		gy: div(j, 1461) - 100100 + div(8 - gm, 6),
		gm,
		gd
	};
}
/**
* Converts a Jalaali date (optionally with a time of day) to a JavaScript
* `Date` constructed in the local time zone.
*
* Time components default to `0`. Out-of-range time components are *not*
* clamped — they overflow the way the `Date` constructor handles them
* (e.g. `h = 25` rolls into the next day).
*
* @example
* jalaaliToDateObject(1400, 4, 30)
*   // → new Date(2021, 6, 21, 0, 0, 0, 0)
*
* jalaaliToDateObject(1400, 4, 30, 14, 30)
*   // → new Date(2021, 6, 21, 14, 30)
*/
function jalaaliToDateObject(jy, jm, jd, h = 0, m = 0, s = 0, ms = 0) {
	const g = toGregorian(jy, jm, jd);
	return new Date(g.gy, g.gm - 1, g.gd, h, m, s, ms);
}
/**
* Returns the Saturday and Friday bounding the Jalaali week that contains
* the given date. The Jalaali week starts on **Saturday**.
*
* @example
* jalaaliWeek(1400, 4, 30)
*   // → { saturday: { jy: 1400, jm: 4, jd: 26 },
*   //     friday:   { jy: 1400, jm: 5, jd:  1 } }
*
* @remarks
* Uses {@link jalaaliToDateObject} to read the day-of-week, which reflects
* the host's local time zone. For dates near a DST boundary the underlying
* `Date.getDay()` is still correct because the conversion is done in local
* time on both sides.
*/
function jalaaliWeek(jy, jm, jd) {
	const dayOfWeek = jalaaliToDateObject(jy, jm, jd).getDay();
	const startDayDifference = dayOfWeek === 6 ? 0 : -(dayOfWeek + 1);
	const endDayDifference = 6 + startDayDifference;
	return {
		saturday: d2j(j2d(jy, jm, jd + startDayDifference)),
		friday: d2j(j2d(jy, jm, jd + endDayDifference))
	};
}
/**
* Core of the Borkowski algorithm: locate the Jalaali year inside the
* cycle table and compute Farvardin 1's Gregorian date.
*/
function jalCalCore(jy) {
	if (!Number.isFinite(jy) || jy < MIN_JALAALI_YEAR || jy > MAX_JALAALI_YEAR) throw new RangeError(`Invalid Jalaali year ${jy}: must be a finite number between ${MIN_JALAALI_YEAR} and ${MAX_JALAALI_YEAR} (inclusive)`);
	const gy = jy + 621;
	let leapJ = -14;
	let jp = BREAKS[0];
	let jm = 0;
	let jump = 0;
	for (let i = 1; i < BREAKS.length; i += 1) {
		jm = BREAKS[i];
		jump = jm - jp;
		if (jy < jm) break;
		leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
		jp = jm;
	}
	const n = jy - jp;
	leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
	if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
	const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
	return {
		gy,
		march: 20 + leapJ - leapG,
		jump,
		n
	};
}
/**
* Given a 33-year cycle length `jump` and the year offset `n` within that
* cycle, returns the number of years since the last leap year (`0 … 4`).
* `0` means the current year is leap.
*/
function leapFromCycle(jump, n) {
	let adjusted = n;
	if (jump - n < 6) adjusted = n - jump + div(jump + 4, 33) * 33;
	let leap = mod(mod(adjusted + 1, 33) - 1, 4);

	return leap;

* Leap-only variant — same loop as {@link jalCalCore} without computing
* the Gregorian fields. Kept separate to avoid the per-call object
* allocation on the hot `isLeapJalaaliYear` path.
*/

	if (!Number.isFinite(jy) || jy < MIN_JALAALI_YEAR || jy > MAX_JALAALI_YEAR) throw new RangeError(`Invalid Jalaali year ${jy}: must be a finite number between ${MIN_JALAALI_YEAR} and ${MAX_JALAALI_YEAR} (inclusive)`);
	let jp = BREAKS[0];
	let jm = 0;
	let jump = 0;
	for (let i = 1; i < BREAKS.length; i += 1) {
		jm = BREAKS[i];
		jump = jm - jp;
		if (jy < jm) break;
		jp = jm;
	}
	return leapFromCycle(jump, jy - jp);
}

* Integer division — `Math.trunc(a / b)` equivalent that's faster on V8
* for values that fit in 32 bits. Used pervasively inside the algorithm.
*/

	return ~~(a / b);
}
/**
* Mathematical modulo — like `%` but always returns a non-negative result
* when `b` is positive (matches Python's `%` semantics, not JavaScript's).
*/
function mod(a, b) {
	return a - ~~(a / b) * b;

  toJalaali: toJalaali,
  toGregorian: toGregorian,
  isValidJalaaliDate: isValidJalaaliDate,
  isLeapJalaaliYear: isLeapJalaaliYear,
  jalaaliMonthLength: jalaaliMonthLength,
  jalCal: jalCal,
  jalaaliToDateObject: jalaaliToDateObject,
  jalaaliWeek: jalaaliWeek,
  MIN_JALAALI_YEAR: MIN_JALAALI_YEAR,
  MAX_JALAALI_YEAR: MAX_JALAALI_YEAR
};
})(window);
</script>
<style>
  :root{
    --bg:#0A0E18;
    --surface: rgba(40, 51, 78, 0.40);
    --surface-2: rgba(46, 58, 88, 0.48);

    --text-muted:#9BA4B8;

    --accent2:#7C8CFF;
    --danger:#E8697A;
    --python:#5EC8D8;
    --english:#C97BD0;
    --freelance:#7FD99A;
    --fitness:#E8697A;
    --gray-tag:#9BA4B8;

    --glass-fill: linear-gradient(155deg, rgba(255,255,255,0.10), var(--surface) 45%);
    --glass-fill-2: linear-gradient(155deg, rgba(255,255,255,0.09), var(--surface-2) 45%);

      0 10px 26px -10px rgba(0,0,0,0.55),

      0 1px 1px rgba(0,0,0,0.25),

    color-scheme: dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    position:relative;
  }
  body::before{
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(380px 380px at 95% -6%, rgba(232,163,61,0.42), transparent 68%),
      radial-gradient(340px 340px at -8% 28%, rgba(124,140,255,0.34), transparent 68%),
      radial-gradient(280px 280px at 88% 60%, rgba(127,217,154,0.20), transparent 68%),
      radial-gradient(260px 260px at 15% 88%, rgba(201,123,208,0.18), transparent 68%);
    filter:blur(55px);
  }
  .app{position:relative; z-index:1;}
  .mono{font-family:'JetBrains Mono', monospace; direction:ltr; display:inline-block;}
  button, input, textarea, select{font-family:inherit;}

  .app{max-width:800px; margin:0 auto; padding:26px 16px 90px;}

  header{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);}
  .brand h1{font-size:21px; font-weight:800; letter-spacing:-0.5px;}
  .brand .sub{font-size:11.5px; color:var(--text-muted); font-weight:500;}
  .date-block{text-align:left;}
  .date-block .jalali{font-size:13px; color:var(--text); font-weight:700;}
  .date-block .gregorian{font-size:11px; color:var(--text-muted); margin-top:2px;}

  nav{display:flex; gap:5px; margin-bottom:22px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:4px; overflow-x:auto;}
  nav button{
    flex:1; white-space:nowrap; background:transparent; border:none; color:var(--text-muted);
    font-size:13.5px; font-weight:600; padding:9px 10px;
    border-radius:7px; cursor:pointer; transition:background .15s, color .15s;
  }
  nav button.active{background:var(--surface-3); color:var(--text);}
  nav button:hover:not(.active){color:var(--text);}

  h2.section-title{font-size:13px; font-weight:700; color:var(--text-muted); margin:22px 0 10px; text-transform:uppercase; letter-spacing:.4px;}
  h2.section-title:first-child{margin-top:0;}

  .add-task-btn{
    width:100%; background:var(--surface); border:1px dashed var(--line); color:var(--text-muted);
    font-size:13.5px; font-weight:700; padding:13px; border-radius:9px; cursor:pointer; margin-bottom:18px; text-align:center;
  }
  .add-task-btn:hover{border-color:var(--accent); color:var(--accent);}

  .add-task-for-day-btn{
    width:100%; background:var(--chip-shine), color-mix(in srgb, var(--accent) 14%, var(--surface));
    border:1px dashed color-mix(in srgb, var(--accent) 50%, var(--line)); color:var(--accent);
    font-size:13px; font-weight:700; padding:11px; border-radius:10px; cursor:pointer; margin-bottom:14px; text-align:center;
  }
  .add-task-for-day-btn:hover{opacity:.9;}

  /* Progress box */
  .progress-box{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px;}
  .progress-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .progress-header h2{margin:0;}
  .range-chips{display:flex; gap:6px;}
  .progress-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
  .progress-label{font-size:12px; width:64px; flex-shrink:0; color:var(--text-muted); font-weight:600;}
  .progress-bar-track{flex:1; height:9px; background:var(--surface-2); border-radius:5px; overflow:hidden;}
  .progress-bar-fill{height:100%; border-radius:5px; transition:width .3s;}
  .progress-count{font-size:11.5px; color:var(--text-muted); width:20px; text-align:left; flex-shrink:0;}

  /* Time-spent box */

  /* Tag manager */
  .tag-manager{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px;}
  .tag-manager-header{display:flex; align-items:center; justify-content:space-between; cursor:pointer;}
  .tag-manager-header h3{font-size:13px; font-weight:700; color:var(--text-muted);}
  .tag-manager-header .chev{color:var(--text-muted); font-size:12px;}
  .tag-manager-body{margin-top:12px;}
  .tag-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .tag-chip{
    display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:20px;
    font-size:12px; font-weight:600; border:1px solid transparent; cursor:pointer; user-select:none;
    background:color-mix(in srgb, var(--chip-color) 16%, var(--surface-2)); color:var(--chip-color);
  }
  .tag-chip .tag-x{opacity:.6; font-size:11px;}
  .tag-chip .tag-x:hover{opacity:1;}
  .new-tag-row{display:flex; gap:8px; align-items:center;}
  .new-tag-row input[type=text]{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:13px; padding:8px 10px; border-radius:7px; outline:none;
  }
  .new-tag-row input[type=color]{
    width:34px; height:34px; border:1px solid var(--line); border-radius:7px; background:none; cursor:pointer; padding:2px;
  }
  .new-tag-row button{
    background:var(--surface-3); color:var(--text); border:1px solid var(--line); font-size:12.5px; font-weight:600;
    padding:8px 14px; border-radius:7px; cursor:pointer;
  }
  .new-tag-row button:hover{border-color:var(--accent); color:var(--accent);}

  /* Unified filter panel */
  .filter-panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px;}
  .filter-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .filter-group:last-of-type{margin-bottom:0;}
  .filter-group-label{font-size:11.5px; color:var(--text-muted); font-weight:700; margin-left:2px; flex-shrink:0;}
  .filter-chip{
    padding:5px 12px; border-radius:20px; font-size:11.5px; font-weight:600; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted);
  }
  .filter-chip.active{background:var(--surface-3); color:var(--text); border-color:var(--text-muted);}
  .filter-group input[type=date]{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); font-size:11.5px;
    padding:4px 8px; border-radius:8px; outline:none;
  }
  .reset-filters-btn{margin-top:4px; background:none; border:1px dashed var(--line); color:var(--text-muted); font-size:11.5px; padding:5px 12px; border-radius:8px; cursor:pointer;}
  .reset-filters-btn:hover{color:var(--danger); border-color:var(--danger);}

  /* Task card (read-only summary; editing happens in modal) */
  .task-card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px;}
  .task-card.done{opacity:.5;}
  .task-main{display:flex; align-items:flex-start; gap:10px;}
  .task-check{
    width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line); background:transparent;
    cursor:pointer; flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:12px;
  }
  .task-check.checked{background:var(--accent); border-color:var(--accent);}
  .task-body{flex:1; min-width:0;}
  .task-title{
    font-size:14.5px; font-weight:600; background:transparent; border:none; color:var(--text);
    width:100%; outline:none; padding:2px 0; text-overflow:ellipsis; overflow:hidden;
  }
  .task-title:focus{text-overflow:clip;}
  .task-title.done-text{text-decoration:line-through; color:var(--text-muted);}
  .task-del{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:15px; padding:2px 6px; flex-shrink:0;}
  .task-del:hover{color:var(--danger);}

  .task-meta-row{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:8px;}
  .summary-text{font-size:11.5px; color:var(--text-muted); font-weight:600;}
  .mini-tag{
    display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:14px; font-size:11px; font-weight:600;
    background:color-mix(in srgb, var(--chip-color) 18%, var(--surface-2)); color:var(--chip-color);
  }
  .priority-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .priority-dot.high{background:var(--danger);}
  .priority-dot.medium{background:var(--accent);}
  .priority-dot.low{background:var(--freelance);}

  .edit-link{
    margin-top:12px; background:none; border:1px solid var(--line); color:var(--text-muted); font-size:12px; font-weight:600;
    padding:6px 14px; border-radius:8px; cursor:pointer;
  }
  .edit-link:hover{border-color:var(--accent); color:var(--accent);}

  .subtasks{margin-top:12px; padding-right:30px; border-right:2px solid var(--line);}
  .subtask-row{display:flex; align-items:center; gap:8px; padding:5px 0;}
  .subtask-check{
    width:16px; height:16px; border-radius:5px; border:1.5px solid var(--line); background:transparent;
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--bg); font-size:10px;
  }
  .subtask-check.checked{background:var(--freelance); border-color:var(--freelance);}
  .subtask-title{flex:1; font-size:13px; color:var(--text);}
  .subtask-title.done-text{text-decoration:line-through; color:var(--text-muted);}
  .subtask-del{background:none; border:none; color:var(--text-muted); opacity:.5; cursor:pointer; font-size:13px;}
  .subtask-del:hover{opacity:1; color:var(--danger);}
  .add-subtask-row{display:flex; gap:8px; margin-top:6px;}
  .add-subtask-row input{
    flex:1; background:transparent; border:none; border-bottom:1px dashed var(--line); color:var(--text);
    font-size:12.5px; padding:5px 2px; outline:none;
  }
  .add-subtask-row input:focus{border-bottom-color:var(--accent);}
  .add-subtask-row button{background:none; border:none; color:var(--text-muted); font-size:12px; cursor:pointer; font-weight:600;}
  .add-subtask-row button:hover{color:var(--accent);}

  .empty-state{text-align:center; color:var(--text-muted); font-size:13px; padding:36px 0;}

  /* Today view scheduled items */
  .today-item{background:var(--surface); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden;}
  .today-item.done{opacity:.5;}
  .today-item.overdue:not(.done){border-color:color-mix(in srgb, var(--danger) 45%, var(--line));}
  .overdue-badge{
    font-size:10px; font-weight:700; color:var(--danger); background:color-mix(in srgb, var(--danger) 18%, transparent);
    border:1px solid color-mix(in srgb, var(--danger) 40%, transparent); padding:2px 8px; border-radius:20px; white-space:nowrap;
  }
  .today-item-row{display:flex; align-items:flex-start; gap:10px; padding:12px 14px; cursor:pointer;}
  .today-item-row .priority-dot, .today-item-row .task-check{margin-top:2px;}
  .today-item .ti-main{flex:1; min-width:0;}
  .today-item .ti-title-row{display:flex; align-items:center; gap:6px;}
  .today-item .ti-title{
    flex:1; font-size:13.5px; min-width:0; line-height:1.5;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .today-item .ti-title.done-text{text-decoration:line-through; color:var(--text-muted);}
  .today-item .ti-meta-row{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:6px;}
  .today-item .dur{font-size:12px; color:var(--accent); font-weight:700; font-family:'JetBrains Mono',monospace; direction:ltr;}
  .today-item .expand-arrow{font-size:10px; color:var(--text-muted); transition:transform .15s; flex-shrink:0; margin-top:4px;}
  .today-item .expand-arrow.open{transform:rotate(180deg);}
  .today-item .ti-actions{display:flex; align-items:center; gap:0; flex-shrink:0;}
  .today-item .item-del{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:14px; padding:2px 4px; flex-shrink:0;}
  .today-item .item-del:hover{color:var(--danger);}
  .today-subtasks{padding:0 14px 12px 14px; border-top:1px solid var(--line); padding-top:8px;}

  /* Task editor modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,10,20,0.4); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
  }
  .modal-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px; max-width:480px; width:100%; max-height:85vh; overflow-y:auto;}
  .modal-box h3{font-size:15px; font-weight:700; margin-bottom:16px;}
  .modal-title-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:14px;
    padding:11px 14px; border-radius:9px; outline:none; margin-bottom:18px;
  }
  .modal-title-input:focus{border-color:var(--accent);}
  .modal-section{margin-bottom:16px;}
  .modal-section-label{font-size:11.5px; color:var(--text-muted); font-weight:700; margin-bottom:8px; display:block;}
  .pick-chip{
    display:inline-flex; align-items:center; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:600;
    cursor:pointer; margin:0 4px 4px 0; border:1px solid var(--line); background:var(--surface-2); color:var(--text-muted);
  }
  .pick-chip.on{background:color-mix(in srgb, var(--chip-color) 20%, var(--surface-2)); color:var(--chip-color); border-color:var(--chip-color);}
  .priority-chip{
    padding:4px 11px; border-radius:14px; font-size:11px; font-weight:700; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); margin-left:4px;
  }
  .priority-chip.high.active{background:color-mix(in srgb, var(--danger) 22%, var(--surface-2)); color:var(--danger); border-color:var(--danger);}
  .priority-chip.medium.active{background:color-mix(in srgb, var(--accent) 22%, var(--surface-2)); color:var(--accent); border-color:var(--accent);}
  .priority-chip.low.active{background:color-mix(in srgb, var(--freelance) 22%, var(--surface-2)); color:var(--freelance); border-color:var(--freelance);}
  .quick-group{display:flex; align-items:center; gap:5px; flex-wrap:wrap;}
  .quick-chip{
    padding:4px 10px; border-radius:8px; font-size:11.5px; font-weight:600; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted);
  }
  .quick-chip.active{background:color-mix(in srgb, var(--accent) 20%, var(--surface-2)); color:var(--accent); border-color:var(--accent);}
  .quick-chip.suggestion-chip{background:color-mix(in srgb, var(--python) 18%, var(--surface-2)); color:var(--python); border-color:var(--python);}
  .modal-section input[type=date]{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); font-size:11.5px;
    padding:4px 8px; border-radius:8px; outline:none;
  }
  .modal-section input[type=number], .modal-section input.num-text{
    width:70px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-muted); font-size:11.5px;
    padding:4px 6px; border-radius:8px; outline:none; text-align:center;
  }
  .modal-subtask-row{display:flex; align-items:center; gap:8px; padding:5px 0;}
  .modal-subtask-row span{flex:1; font-size:13px;}
  .modal-add-subtask{display:flex; gap:8px; margin-top:6px;}
  .modal-add-subtask input{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:12.5px;
    padding:7px 10px; border-radius:7px; outline:none;
  }
  .modal-add-subtask button{background:var(--surface-3); border:1px solid var(--line); color:var(--text); font-size:12px; padding:7px 12px; border-radius:7px; cursor:pointer;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:20px;}
  .modal-actions button{padding:10px 22px; border-radius:9px; font-size:13.5px; font-weight:700; cursor:pointer; border:1px solid var(--line); background:var(--surface-2); color:var(--text);}
  .modal-actions button.confirm{background:var(--accent); color:#12161C; border-color:var(--accent);}
  .modal-actions button.confirm:hover{opacity:.9;}
  .modal-actions button.cancel:hover{border-color:var(--danger); color:var(--danger);}

  /* Pomodoro */
  .pomo-box{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:28px 20px; text-align:center; margin-bottom:18px;}
  .pomo-mode{font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--text-muted); margin-bottom:14px;}
  .pomo-mode.work{color:var(--accent);}
  .pomo-mode.break{color:var(--freelance);}
  .pomo-timer{font-family:'JetBrains Mono', monospace; font-size:58px; font-weight:600; letter-spacing:1px; direction:ltr; margin-bottom:18px;}
  .pomo-controls{display:flex; gap:10px; justify-content:center; margin-bottom:20px;}
  .pomo-controls button{
    background:var(--surface-3); border:1px solid var(--line); color:var(--text); font-size:13.5px; font-weight:700;
    padding:10px 20px; border-radius:9px; cursor:pointer;
  }
  .pomo-controls button.primary{background:var(--accent); color:#12161C; border-color:var(--accent);}
  .pomo-controls button:hover{opacity:.9;}
  .pomo-settings{display:flex; gap:16px; justify-content:center; font-size:12px; color:var(--text-muted); flex-wrap:wrap;}
  .pomo-settings label{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .pomo-settings input{
    width:60px; text-align:center; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    font-size:13px; padding:6px; border-radius:7px; outline:none; font-family:'JetBrains Mono',monospace;
  }
  .pomo-cycles{font-size:12px; color:var(--text-muted); margin-top:14px;}
  .pomo-alarm-note{font-size:11px; color:var(--text-muted); margin-top:12px; line-height:1.7; opacity:.75;}
  .pomo-focus{margin-top:16px;}
  .pomo-focus input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:13px;
    padding:9px 12px; border-radius:8px; outline:none; text-align:center;
  }

  .loading{text-align:center; color:var(--text-muted); font-size:13px; padding:60px 0;}

  /* Floating add-task button */
  .fab{
    position:fixed; bottom:24px; right:24px; width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#12161C; border:none; font-size:28px; font-weight:700;
    cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.45); z-index:40; display:flex;
    align-items:center; justify-content:center; line-height:1; padding:0;
  }
  .fab:hover{opacity:.9;}

  /* today-item extra action buttons */
  .today-item .item-edit{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; padding:2px 4px; flex-shrink:0;}
  .today-item .item-edit:hover{color:var(--accent);}
  .today-item .item-copy{background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:13px; padding:2px 4px; flex-shrink:0;}
  .today-item .item-copy:hover{color:var(--freelance);}

  .copy-link{
    margin-top:12px; margin-right:8px; background:none; border:1px solid var(--line); color:var(--text-muted); font-size:12px; font-weight:600;
    padding:6px 14px; border-radius:8px; cursor:pointer;
  }
  .copy-link:hover{border-color:var(--freelance); color:var(--freelance);}
  .task-actions-row{display:flex; gap:0;}

  /* drag-and-drop subtask reordering (editor modal) */
  .modal-subtask-row{cursor:default;}
  .modal-subtask-row.dragging{opacity:.4;}
  .modal-subtask-row .drag-handle{cursor:grab; color:var(--text-muted); font-size:13px; padding:0 2px; flex-shrink:0; user-select:none;}
  .modal-subtask-row .drag-handle:active{cursor:grabbing;}

  /* Custom Jalali calendar (task date picker) */
  .date-picker-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:12.5px; font-weight:600;
    padding:7px 12px; border-radius:8px; cursor:pointer;
  }
  .date-picker-btn:hover{border-color:var(--accent); color:var(--accent);}
  .task-calendar{margin-top:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px;}
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px;}
  .cal-nav{background:var(--surface-3); border:1px solid var(--line); color:var(--text); font-size:11px; font-weight:600; padding:6px 10px; border-radius:7px; cursor:pointer; white-space:nowrap;}
  .cal-nav:hover{border-color:var(--accent); color:var(--accent);}
  .cal-title{display:flex; flex-direction:column; align-items:center; text-align:center; flex:1;}
  .cal-jalali{font-size:13px; font-weight:700; color:var(--text);}
  .cal-greg{font-size:10.5px; color:var(--text-muted); margin-top:2px;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;}
  .cal-weekdays span{text-align:center; font-size:11px; color:var(--text-muted); font-weight:700;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-cell{
    position:relative; min-height:46px; border-radius:8px; padding:4px 2px; cursor:pointer;
    background:var(--surface); border:1px solid transparent; display:flex; flex-direction:column; align-items:center;
  }
  .cal-cell.empty{background:transparent; cursor:default; border:none;}
  .cal-cell:not(.empty):hover{border-color:var(--accent);}
  .cal-cell.today{border-color:var(--freelance);}
  .cal-cell.selected{background:color-mix(in srgb, var(--accent) 22%, var(--surface)); border-color:var(--accent);}
  .cal-daynum{font-size:12px; font-weight:700; color:var(--text);}
  .cal-info-btn{position:absolute; top:2px; left:2px; font-size:10px; color:var(--text-muted); cursor:pointer; line-height:1; padding:1px;}
  .cal-info-btn:hover{color:var(--accent);}
  .cal-tags{display:flex; gap:2px; margin-top:4px; align-items:center;}
  .cal-tag-dot{width:6px; height:6px; border-radius:50%; display:inline-block; flex-shrink:0;}
  .cal-tag-more{font-size:9px; color:var(--text-muted);}
  .cal-day-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px;}
  .cal-back{background:var(--surface-3); border:1px solid var(--line); color:var(--text); font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:7px; cursor:pointer; white-space:nowrap;}
  .cal-back:hover{border-color:var(--accent); color:var(--accent);}
  .cal-day-title{font-size:13px; font-weight:700; color:var(--text);}
  .cal-day-task{background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:10px 12px; margin-bottom:8px;}
  .cal-day-task:last-child{margin-bottom:0;}
  .cal-day-task.done{opacity:.55;}
  .cal-day-task-title{font-size:13.5px; font-weight:600; color:var(--text); margin-bottom:6px;}
  .cal-day-task-title.done-text{text-decoration:line-through; color:var(--text-muted);}

  /* streak badge */
  .streak-badge{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:10px 14px; margin-bottom:16px; width:fit-content;
  }
  .streak-flame{font-size:20px; filter:grayscale(0); transition:filter .2s;}
  .streak-badge.at-risk .streak-flame{filter:grayscale(1); opacity:.55;}
  .streak-count{font-size:17px; font-weight:800; color:var(--text);}
  .streak-badge.at-risk .streak-count{color:var(--text-muted);}
  .streak-label{font-size:11.5px; color:var(--text-muted);}

  /* pomodoro <-> task link */
  .pomo-linked-task{font-size:12.5px; color:var(--freelance); text-align:center; margin-top:6px;}
  .actual-time-row{font-size:11.5px; color:var(--freelance); margin-top:4px;}
  .pomo-task-pick-list{max-height:260px; overflow-y:auto; margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .pomo-task-pick-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:9px; padding:9px 12px; cursor:pointer; color:var(--text); font-size:13px;
    font-family:inherit; text-align:right; width:100%;
  }
  .pomo-task-pick-row:hover{border-color:var(--accent);}

  /* archive */
  .archive-search-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:13px;
    padding:9px 12px; border-radius:9px; outline:none;
  }
  .archive-search-input:focus{border-color:var(--accent);}

  /* ============ Liquid-glass surface system ============
     Applied broadly across containers/cards/badges/buttons. Each gets:
     - a backdrop blur (real glass refraction against the page's glow blobs)
     - a diagonal gradient fill (light corner -> darker corner = curvature)
     - a layered box-shadow (outer lift + inset top highlight + inset bottom depth)
     - a thin bright rim across the top edge (::before) = specular highlight */
  nav, .add-task-btn, .progress-box, .tag-manager, .filter-panel, .task-card, .today-item,
  .modal-box, .pomo-box, .task-calendar, .cal-day-task, .streak-badge, .cal-nav, .cal-back,
  .date-picker-btn, .reset-filters-btn, .new-tag-row button, .modal-add-subtask button,
  .modal-actions button, .pomo-task-pick-row, .pomo-cycles, .archive-search-input{
    background:var(--glass-fill);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--line);
    box-shadow:var(--glass-shadow);
    position:relative;
  }
  nav::before, .add-task-btn::before, .progress-box::before, .tag-manager::before, .filter-panel::before,
  .task-card::before, .today-item::before, .modal-box::before, .pomo-box::before, .task-calendar::before,
  .cal-day-task::before, .streak-badge::before, .cal-nav::before, .cal-back::before, .date-picker-btn::before,
  .reset-filters-btn::before, .new-tag-row button::before, .modal-add-subtask button::before,
  .modal-actions button::before, .pomo-task-pick-row::before, .archive-search-input::before{
    content:'';
    position:absolute; top:0; left:12%; right:12%; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
    pointer-events:none;
  }
  .modal-actions button.confirm{box-shadow:var(--glass-shadow-sm), 0 6px 16px -6px rgba(232,163,61,0.5);}

  /* smaller controls: same glass fill, lighter shadow, no rim (too small to read one) */
  .modal-title-input, .new-tag-row input[type=text], .modal-add-subtask input, .modal-subtask-row,
  .modal-section input[type=date], .modal-section input[type=number], .modal-section input.num-text,
  .filter-group input[type=date], .cal-cell:not(.empty){
    background:var(--glass-fill-2);
    backdrop-filter:var(--glass-blur);
    -webkit-backdrop-filter:var(--glass-blur);
    border:1px solid var(--line);
    box-shadow:var(--glass-shadow-sm);
  }

  /* pill-shaped tags/chips: convex glass pebble look, tinted by --chip-color where present.
     Shine is baked into the gradient itself (not a separate blurred element), so it can
     never leak past the pill's own rounded border like an absolutely-positioned layer can. */
  .tag-chip, .mini-tag, .pick-chip, .filter-chip, .priority-chip, .quick-chip{
    position:relative;
  }
  .filter-chip, .priority-chip, .quick-chip{
    background:var(--chip-shine), var(--surface-2);
  }
  .tag-chip, .mini-tag, .pick-chip.on{
    background:var(--chip-shine), linear-gradient(160deg, color-mix(in srgb, var(--chip-color) 55%, transparent), color-mix(in srgb, var(--chip-color) 16%, transparent) 60%);
    box-shadow:
      0 3px 8px -3px color-mix(in srgb, var(--chip-color) 45%, transparent),
      inset 0 1px 0.5px rgba(255,255,255,0.5),
      inset 0 -3px 6px -4px rgba(0,0,0,0.4);
    border-color:color-mix(in srgb, var(--chip-color) 45%, white 10%);
  }
  .filter-chip.active, .priority-chip.high.active, .priority-chip.medium.active, .priority-chip.low.active,
  .quick-chip.active, .quick-chip.suggestion-chip{
    box-shadow:
      0 3px 8px -3px rgba(0,0,0,0.3),
      inset 0 1px 0.5px rgba(255,255,255,0.4),
      inset 0 -3px 6px -4px rgba(0,0,0,0.35);
  }

  .fab{

function toFaDigits(str){
  const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return String(str).replace(/[0-9]/g, d => map[d]);
}
/* Shared utility: normalize Persian/Arabic-Indic digits to standard English digits.
   Reusable for any numeric input field on the site. */
function toEnDigits(str){
  const faMap = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
  const arMap = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  return String(str).replace(/[۰-۹٠-٩]/g, d => faMap[d] || arMap[d] || d);
}
/* Shared helper: live-normalizes a text input's value to plain English digits
   (strips anything else that isn't a digit). Call from oninput on numeric text fields. */
function normalizeNumericInput(el){
  const converted = toEnDigits(el.value).replace(/[^0-9]/g, '');

}

/* ---------- Jalali conversion (Gregorian -> Jalali) ---------- */
function gregorianToJalali(gy, gm, gd){
  const gDayNo = [0,31,59,90,120,151,181,212,243,273,304,334];
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = 355666 + 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) + gd + gDayNo[gm-1];
  let jy = -1595 + 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    jy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  let jm, jd;
  if(days < 186){
    jm = 1 + Math.floor(days/31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + Math.floor((days-186)/30);
    jd = 1 + ((days-186) % 30);
  }
  return [jy, jm, jd];
}

function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function tomorrowDate(){ const d = new Date(); d.setDate(d.getDate()+1); return d; }

function fmtHeaderDate(d){
  const wd = WEEKDAYS_FA[d.getDay()];
  const gDay = toFaDigits(d.getDate());
  const gMonth = MONTHS_GREG_FA[d.getMonth()];
  const gYear = toFaDigits(d.getFullYear());
  const [jy, jm, jd] = gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  const jalali = `${toFaDigits(jd)} ${MONTHS_JALALI[jm-1]} ${toFaDigits(jy)}`;
  const gregorian = `${gDay} ${gMonth} ${gYear}`;
  return { wd, jalali, gregorian };
}
function formatDateShort(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  const [jy, jm, jd] = gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  return `${toFaDigits(jd)} ${MONTHS_JALALI[jm-1]}`;
}
function formatDuration(min){
  if(!min) return '۰ دقیقه';
  const h = Math.floor(min/60), m = min%60;

  if(h>0) return `${toFaDigits(h)} ساعت`;
  return `${toFaDigits(m)} دقیقه`;
}

/* ---------- realtime sync (incremental — no full reload per change) ----------
   Registers per-table INSERT/UPDATE/DELETE handlers on a shared channel. Each
   handler patches only the affected slice of local state, so the cost of every
   change stays constant no matter how much data or how many tables exist.
   To wire up a future table: call registerRealtimeSync(channel, 'table_name',
   { onInsert, onUpdate, onDelete }) inside startRealtimeSync — the rest of the
   plumbing (channel, subscribe, reconnect-reconcile) is already shared. */
function registerRealtimeSync(channel, table, handlers){
  if(handlers.onInsert) channel.on('postgres_changes', { event:'INSERT', schema:'public', table }, payload => handlers.onInsert(payload.new));
  if(handlers.onUpdate) channel.on('postgres_changes', { event:'UPDATE', schema:'public', table }, payload => handlers.onUpdate(payload.new, payload.old));
  if(handlers.onDelete) channel.on('postgres_changes', { event:'DELETE', schema:'public', table }, payload => handlers.onDelete(payload.old));
  return channel;
}
function startRealtimeSync(){
  const channel = sb.channel('planner-sync');

  registerRealtimeSync(channel, 'tags', {
    onInsert(row){
      if(state.tags.some(t => t.id === row.id)) return;
      state.tags.push({ id:row.id, name:row.name, color:row.color });
      render();
    },
    onUpdate(row){
      const t = state.tags.find(t => t.id === row.id);
      if(!t) return;
      t.name = row.name; t.color = row.color;
      render();
    },
    onDelete(old){
      state.tags = state.tags.filter(t => t.id !== old.id);
      state.tasks.forEach(task => { task.tagIds = task.tagIds.filter(id => id !== old.id); });
      state.todayFilters.tagIds = state.todayFilters.tagIds.filter(id => id !== old.id);
      state.tasksFilters.tagIds = state.tasksFilters.tagIds.filter(id => id !== old.id);
      render();
    },
  });

  registerRealtimeSync(channel, 'tasks', {
    onInsert(row){
      if(state.tasks.some(t => t.id === row.id)) return;
      state.tasks.unshift({
        id:row.id, title:row.title, done:!!row.done, completedAt:row.completed_at,
        tagIds:[], priority:row.priority, subtasks:[], date:row.date || '', durationMin:row.duration_min, actualMin:row.actual_min,
      });
      render();
    },
    onUpdate(row){
      const t = state.tasks.find(t => t.id === row.id);
      if(!t) return;
      t.title = row.title; t.done = !!row.done; t.completedAt = row.completed_at;
      t.priority = row.priority; t.date = row.date || ''; t.durationMin = row.duration_min; t.actualMin = row.actual_min;
      render();
    },
    onDelete(old){
      state.tasks = state.tasks.filter(t => t.id !== old.id);
      render();
    },
  });

  registerRealtimeSync(channel, 'task_tags', {
    onInsert(row){
      const t = state.tasks.find(t => t.id === row.task_id);
      if(!t || t.tagIds.includes(row.tag_id)) return;
      t.tagIds.push(row.tag_id);
      render();
    },
    onDelete(old){
      const t = state.tasks.find(t => t.id === old.task_id);
      if(!t) return;
      t.tagIds = t.tagIds.filter(id => id !== old.tag_id);
      render();
    },
  });

  registerRealtimeSync(channel, 'subtasks', {
    onInsert(row){
      const t = state.tasks.find(t => t.id === row.task_id);
      if(!t || t.subtasks.some(s => s.id === row.id)) return;
      t.subtasks.push({ id:row.id, title:row.title, done:!!row.done });
      render();
    },
    onUpdate(row){
      const t = state.tasks.find(t => t.id === row.task_id);
      if(!t) return;
      const s = t.subtasks.find(s => s.id === row.id);
      if(!s) return;
      s.title = row.title; s.done = !!row.done;
      render();
    },
    onDelete(old){
      // default replica identity only guarantees the primary key (id) on DELETE,
      // so we can't rely on old.task_id here — sweep every task's subtasks by id instead.
      state.tasks.forEach(t => { t.subtasks = t.subtasks.filter(s => s.id !== old.id); });
      render();
    },
  });

  let hasSubscribedBefore = false;
  channel.subscribe(status => {
    if(status === 'SUBSCRIBED'){
      // a re-subscribe after a dropped connection may have missed events in between;
      // one full reconciliation load fixes that. First-ever subscribe is a no-op here
      // since loadAll() already populated state right before this was called.
      if(hasSubscribedBefore) loadAll();
      hasSubscribedBefore = true;
    }
  });
}

function setFilterDateQuick(which){

function setFilterDateCustom(value){

function resetFilters(pageKey){

  else state.todayFilters = emptyFilters();

function filtersActive(f, hasDate){
  return f.tagIds.length > 0 || f.priorities.length > 0 || f.sortBy !== 'default' || (hasDate && !!f.date);
}
function applyFiltersAndSort(tasks, pageKey, opts){
  const f = state[pageKey];
  let list = tasks;
  if(f.tagIds.length) list = list.filter(t => t.tagIds.some(id => f.tagIds.includes(id)));
  if(f.priorities.length) list = list.filter(t => f.priorities.includes(t.priority));
  if(opts && opts.dateFilter && f.date){
    if(f.date === 'none') list = list.filter(t => !t.date);
    else list = list.filter(t => t.date === f.date);
  }
  if(f.sortBy === 'duration-asc'){
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const ad = (a.durationMin==null) ? Infinity : a.durationMin;
      const bd = (b.durationMin==null) ? Infinity : b.durationMin;
      return ad - bd;
    });
  } else if(f.sortBy === 'duration-desc'){
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const ad = (a.durationMin==null) ? -1 : a.durationMin;
      const bd = (b.durationMin==null) ? -1 : b.durationMin;
      return bd - ad;
    });
  } else if(pageKey === 'tasksFilters'){
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const ad = a.date || '9999-99-99';
      const bd = b.date || '9999-99-99';
      if(ad !== bd) return ad.localeCompare(bd);
      const ar = a.priority ? PRIORITY_RANK[a.priority] : 3;
      const br = b.priority ? PRIORITY_RANK[b.priority] : 3;
      return ar - br;
    });
  } else {
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const ar = a.priority ? PRIORITY_RANK[a.priority] : 3;
      const br = b.priority ? PRIORITY_RANK[b.priority] : 3;
      return ar - br;
    });
  }
  return list;
}
function renderFilterPanel(pageKey, opts){
  const f = state[pageKey];

  return `

        </div>

      </div>
      ${active ? `<button class="reset-filters-btn" onclick="resetFilters('${pageKey}')">پاک‌کردن فیلترها</button>` : ''}
    </div>

/* ---------- tasks: quick inline actions (no jump risk) ---------- */
function markDone(task, val){
  task.done = val;
  task.completedAt = val ? new Date().toISOString() : null;
  if(val) task.subtasks.forEach(s => s.done = true);
}
async function deleteTask(taskId, evt){
  if(evt) evt.stopPropagation();
  state.tasks = state.tasks.filter(t => t.id !== taskId);
  render();
  const { error } = await sb.from('tasks').delete().eq('id', taskId);
  if(error) console.error('deleteTask failed', error);
}
async function toggleTaskDone(taskId, evt){
  if(evt) evt.stopPropagation();
  const t = state.tasks.find(t => t.id === taskId);
  if(!t) return;
  markDone(t, !t.done);
  render();
  const { error } = await sb.from('tasks').update({ done:t.done, completed_at:t.completedAt }).eq('id', taskId);
  if(error) console.error('toggleTaskDone failed', error);
  if(t.done && t.subtasks.length){
    const { error: subErr } = await sb.from('subtasks').update({ done:true }).eq('task_id', taskId);
    if(subErr) console.error('subtask sync failed', subErr);
  }
}
async function commitTaskTitle(taskId, value){

  t.title = value.trim();

async function toggleSubtask(taskId, subId, evt){
  if(evt) evt.stopPropagation();
  const t = state.tasks.find(t => t.id === taskId);
  const s = t.subtasks.find(s => s.id === subId);

  else markDone(t, false);
  render();
  const { error } = await sb.from('subtasks').update({ done:s.done }).eq('id', subId);
  if(error) console.error('toggleSubtask failed', error);
  const { error: taskErr } = await sb.from('tasks').update({ done:t.done, completed_at:t.completedAt }).eq('id', taskId);
  if(taskErr) console.error('parent sync failed', taskErr);
}
async function deleteSubtask(taskId, subId){
  const t = state.tasks.find(t => t.id === taskId);

  if(error) console.error('deleteSubtask failed', error);
}

/* ---------- duration suggestion engine ----------
   Suggests a duration for a new/edited task based on ACTUAL time previously
   logged (via Pomodoro) on similar past tasks. Three tiers, most confident first:
   1. exact  — prior tasks with the exact same title (case-insensitive)
   2. keyword — prior tasks sharing a tag AND at least one meaningful title word
   3. tag     — prior tasks sharing a tag only (rough fallback)
   Never invented from nothing: each tier requires real matching history. */
const SUGGESTION_STOPWORDS = new Set([
  'و','در','با','برای','از','به','رو','این','آن','یک','تا','هم','که','یا','بر','را','های','ها',
  'می','شد','شده','کن','کردن','است','بود','چند','هر','یه','اون','این‌','روی','بین','چه',
]);
const SUGGESTION_NUMBER_WORDS = new Set([
  'صفر','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده',
  'یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده','بیست',
  'سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود','صد',
]);
function tokenizeTaskTitle(str){
  return toEnDigits(str || '')
    .replace(/[^\u0600-\u06FF\u0750-\u077Fa-zA-Z0-9\s]/g, ' ')
    .split(/\s+/)
    .map(w => w.trim())
    .filter(w => w.length >= 2)
    .filter(w => !SUGGESTION_STOPWORDS.has(w))
    .filter(w => !SUGGESTION_NUMBER_WORDS.has(w))
    .filter(w => !/^[0-9]+$/.test(w));
}
function computeDurationSuggestion(){
  const ed = state.taskEditor;
  if(!ed) return null;
  const title = (ed.draft.title || '').trim();
  const tagIds = ed.draft.tagIds;
  if(!tagIds.length) return null;

  const candidates = state.tasks.filter(t =>
    t.actualMin && t.actualMin > 0 &&
    t.tagIds.some(id => tagIds.includes(id)) &&
    (!ed.taskId || t.id !== ed.taskId)
  );
  if(!candidates.length) return null;

  if(title){
    const exact = candidates.filter(t => t.title.trim().toLowerCase() === title.toLowerCase());
    if(exact.length){
      const avg = Math.round(exact.reduce((s,t) => s + t.actualMin, 0) / exact.length);
      return { minutes: avg, tier:'exact', count: exact.length };
    }
  }

  const myTokens = new Set(tokenizeTaskTitle(title));
  if(myTokens.size){
    const keywordMatches = candidates.filter(t => tokenizeTaskTitle(t.title).some(tok => myTokens.has(tok)));
    if(keywordMatches.length >= 3){
      const avg = Math.round(keywordMatches.reduce((s,t) => s + t.actualMin, 0) / keywordMatches.length);
      return { minutes: avg, tier:'keyword', count: keywordMatches.length };
    }
  }

  if(candidates.length >= 3){
    const avg = Math.round(candidates.reduce((s,t) => s + t.actualMin, 0) / candidates.length);
    return { minutes: avg, tier:'tag', count: candidates.length };
  }
  return null;
}
function renderDurationSuggestionChip(){
  const sug = computeDurationSuggestion();
  if(!sug) return '';
  const labels = {
    exact:   `پیشنهادی (دقیق، بر اساس ${toFaDigits(sug.count)} کار هم‌نام)`,
    keyword: `پیشنهادی (مشابه، بر اساس ${toFaDigits(sug.count)} کار مرتبط)`,
    tag:     `تخمین کلی برچسب (بر اساس ${toFaDigits(sug.count)} کار، شاید دقیق نباشه)`,
  };
  return `<span class="quick-chip suggestion-chip" onclick="editorQuickDuration(${sug.minutes})" title="${labels[sug.tier]}">🔵 ${labels[sug.tier]}: ${formatDuration(sug.minutes)}</span>`;
}

let dragSubIndex = null;
function editorSubtaskDragStart(evt, idx){
  dragSubIndex = idx;
  evt.dataTransfer.effectAllowed = 'move';
  evt.currentTarget.classList.add('dragging');
}

  evt.preventDefault();
  evt.dataTransfer.dropEffect = 'move';

  evt.preventDefault();
  if(dragSubIndex === null || dragSubIndex === idx){ dragSubIndex = null; return; }
  const arr = state.taskEditor.draft.subtasks;

  arr.splice(idx, 0, moved);

  evt.currentTarget.classList.remove('dragging');

async function confirmTaskEditor(){
  const titleInput = document.getElementById('editor-title');
  const title = titleInput.value.trim();
  if(!title){ titleInput.focus(); return; }
  const ed = state.taskEditor;
  ed.draft.title = title;

  const taskRow = {
    title: ed.draft.title, priority: ed.draft.priority,
    date: ed.draft.date || null, duration_min: ed.draft.durationMin,
  };

  if(ed.mode === 'create'){
    const newTask = {
      id: uid(), title: ed.draft.title, done:false, completedAt:null,
      tagIds: ed.draft.tagIds, priority: ed.draft.priority,
      subtasks: ed.draft.subtasks, date: ed.draft.date, durationMin: ed.draft.durationMin, actualMin: null,
    };
    state.tasks.unshift(newTask);
    state.taskEditor = null;
    render();

    const { error: taskErr } = await sb.from('tasks').insert({ id:newTask.id, ...taskRow, done:false });
    if(taskErr){ console.error('create task failed', taskErr); return; }
    if(newTask.tagIds.length){
      const { error: tagErr } = await sb.from('task_tags').insert(newTask.tagIds.map(tagId => ({ task_id:newTask.id, tag_id:tagId })));
      if(tagErr) console.error('link tags failed', tagErr);
    }
    if(newTask.subtasks.length){
      const { error: subErr } = await sb.from('subtasks').insert(newTask.subtasks.map(s => ({ id:s.id, task_id:newTask.id, title:s.title, done:false })));
      if(subErr) console.error('create subtasks failed', subErr);
    }
  } else {
    const t = state.tasks.find(t => t.id === ed.taskId);
    if(!t){ state.taskEditor = null; render(); return; }
    t.title = ed.draft.title; t.tagIds = ed.draft.tagIds; t.priority = ed.draft.priority;
    t.date = ed.draft.date; t.durationMin = ed.draft.durationMin; t.subtasks = ed.draft.subtasks;
    state.taskEditor = null;
    render();

    const { error: taskErr } = await sb.from('tasks').update(taskRow).eq('id', t.id);
    if(taskErr) console.error('update task failed', taskErr);

    const { error: delTagErr } = await sb.from('task_tags').delete().eq('task_id', t.id);
    if(delTagErr) console.error('clear tags failed', delTagErr);
    if(t.tagIds.length){
      const { error: tagErr } = await sb.from('task_tags').insert(t.tagIds.map(tagId => ({ task_id:t.id, tag_id:tagId })));
      if(tagErr) console.error('relink tags failed', tagErr);
    }

    const { error: delSubErr } = await sb.from('subtasks').delete().eq('task_id', t.id);
    if(delSubErr) console.error('clear subtasks failed', delSubErr);
    if(t.subtasks.length){
      const { error: subErr } = await sb.from('subtasks').insert(t.subtasks.map(s => ({ id: uid(), task_id:t.id, title:s.title, done:s.done })));
      if(subErr) console.error('recreate subtasks failed', subErr);
    }
  }
}

/* ---------- rendering: custom Jalali calendar ---------- */
function renderTaskCalendar(){
  const ed = state.taskEditor;
  if(ed.calendarPanel === 'day') return renderCalendarDayPanel();
  const jy = ed.calendarViewJY, jm = ed.calendarViewJM;
  const monthLen = window.jalaali.jalaaliMonthLength(jy, jm);
  const firstG = window.jalaali.toGregorian(jy, jm, 1);
  const firstDate = new Date(firstG.gy, firstG.gm - 1, firstG.gd);
  const jsDay = firstDate.getDay(); // 0=Sun..6=Sat
  const startOffset = (jsDay + 1) % 7; // Persian week starts Saturday

  const dayTagsMap = {};
  for(let dnum = 1; dnum <= monthLen; dnum++){
    const g = window.jalaali.toGregorian(jy, jm, dnum);
    const key = dateKey(new Date(g.gy, g.gm - 1, g.gd));
    const dayTasks = state.tasks.filter(t => t.date === key);
    if(dayTasks.length){
      const tagIds = [];
      dayTasks.forEach(t => t.tagIds.forEach(tid => { if(!tagIds.includes(tid)) tagIds.push(tid); }));
      dayTagsMap[dnum] = { tagIds, key };
    }
  }

  const todayJ = window.jalaali.toJalaali(new Date());
  const selJ = ed.draft.date ? window.jalaali.toJalaali(new Date(ed.draft.date)) : null;

  const cells = [];
  for(let i = 0; i < startOffset; i++) cells.push(null);
  for(let dnum = 1; dnum <= monthLen; dnum++) cells.push(dnum);

  return `
    <div class="task-calendar">
      <div class="cal-header">
        <button type="button" class="cal-nav" onclick="calendarPrevMonth()">ماه قبل</button>
        <div class="cal-title">
          <span class="cal-jalali">${MONTHS_JALALI[jm-1]} ${toFaDigits(jy)}</span>
          <span class="cal-greg">${MONTHS_GREG_FA[firstG.gm-1]} ${firstG.gy}</span>
        </div>
        <button type="button" class="cal-nav" onclick="calendarNextMonth()">ماه بعد</button>
      </div>
      <div class="cal-weekdays">
        ${['ش','ی','د','س','چ','پ','ج'].map(w => `<span>${w}</span>`).join('')}
      </div>
      <div class="cal-grid">
        ${cells.map(dnum => {
          if(dnum === null) return `<div class="cal-cell empty"></div>`;
          const info = dayTagsMap[dnum];
          const isToday = (jy===todayJ.jy && jm===todayJ.jm && dnum===todayJ.jd);
          const isSelected = selJ && jy===selJ.jy && jm===selJ.jm && dnum===selJ.jd;
          return `
            <div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="calendarPickDay(${jy},${jm},${dnum})">
              ${info ? `<span class="cal-info-btn" onclick="calendarShowDayDetail('${info.key}', event)" title="جزئیات این روز">ⓘ</span>` : ''}
              <span class="cal-daynum">${toFaDigits(dnum)}</span>
              ${info ? `
                <div class="cal-tags">
                  ${info.tagIds.slice(0,3).map(tid => { const tag = state.tags.find(t=>t.id===tid); return tag ? `<span class="cal-tag-dot" style="background:${tag.color}" title="${escapeHtml(tag.name)}"></span>` : ''; }).join('')}
                  ${info.tagIds.length > 3 ? `<span class="cal-tag-more">+${toFaDigits(info.tagIds.length-3)}</span>` : ''}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}
function renderCalendarDayPanel(){
  const ed = state.taskEditor;
  const key = ed.calendarSelectedDayKey;

  const jObj = window.jalaali.toJalaali(new Date(key));

/* ---------- rendering: progress ---------- */
function computeProgress(days){
  const from = new Date();
  from.setDate(from.getDate() - days + 1);
  from.setHours(0,0,0,0);
  const counts = {};
  state.tasks.forEach(t => {
    if(t.done && t.completedAt){
      const cd = new Date(t.completedAt);
      if(cd >= from){
        if(t.tagIds.length === 0){ counts['__none__'] = (counts['__none__']||0) + 1; }
        t.tagIds.forEach(tid => { counts[tid] = (counts[tid]||0) + 1; });
      }
    }
  });
  return counts;
}
function setProgressRange(d){ state.progressRange = d; render(); }
function renderProgress(){
  const counts = computeProgress(state.progressRange);
  const entries = Object.entries(counts).map(([tid, count]) => {
    if(tid === '__none__') return { name:'بدون تگ', color:'var(--gray-tag)', count };
    const tag = state.tags.find(t => t.id === tid);
    return tag ? { name: tag.name, color: tag.color, count } : null;
  }).filter(Boolean).sort((a,b) => b.count - a.count);
  const max = entries.length ? entries[0].count : 1;
  const rangeLabels = { 7:'۷ روز اخیر', 30:'۳۰ روز اخیر', 90:'۹۰ روز اخیر' };
  return `
    <div class="progress-box">
      <div class="progress-header">
        <h2 class="section-title">پیشرفت</h2>
        <div class="range-chips">
          ${[7,30,90].map(d => `<span class="filter-chip ${state.progressRange===d?'active':''}" onclick="setProgressRange(${d})">${rangeLabels[d]}</span>`).join('')}
        </div>
      </div>
      ${entries.length === 0
        ? `<div class="empty-state" style="padding:14px 0;">در این بازه کاری تکمیل نشده</div>`
        : entries.map(e => `
          <div class="progress-row">
            <span class="progress-label">${escapeHtml(e.name)}</span>
            <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${Math.max(4, e.count/max*100)}%; background:${e.color}"></div></div>
            <span class="progress-count mono">${toFaDigits(e.count)}</span>
          </div>
        `).join('')
      }
    </div>
  `;
}

let pomoAudioCtx = null;
function playAlarm(endedMode){
  try{
    if(!pomoAudioCtx) pomoAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = pomoAudioCtx;
    if(ctx.state === 'suspended') ctx.resume();
    /* urgent alternating two-tone pattern (like a real alarm clock), louder
       and much longer than a few soft beeps — repeats for ~6 seconds */
    const pattern = [988, 740, 988, 740, 988, 740, 988, 740, 988, 740, 988, 740];
    pattern.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i*0.5;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.55, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.38);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  }catch(e){ console.error('alarm failed', e); }
  if(navigator.vibrate) navigator.vibrate([350,150,350,150,350,150,350,150,350]);
  notifyPomodoroDone(endedMode);
}
async function notifyPomodoroDone(endedMode){
  try{
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    const title = endedMode === 'work' ? '⏰ وقت کار تموم شد' : '⏰ وقت استراحت تموم شد';
    const body = endedMode === 'work' ? 'وقت یه استراحت کوتاهه' : 'وقت شروع دوباره‌ست';
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      reg.showNotification(title, { body, icon:'./icon-192.png', badge:'./icon-192.png', vibrate:[350,150,350,150,350] });
    } else {
      new Notification(title, { body, icon:'./icon-192.png' });
    }
  }catch(e){ console.error('notify failed', e); }
}

async function addActualMinToTask(taskId, deltaMin){
  const t = state.tasks.find(t => t.id === taskId);
  if(!t || deltaMin <= 0) return;
  t.actualMin = (t.actualMin || 0) + deltaMin;
  render();
  const { error } = await sb.from('tasks').update({ actual_min: t.actualMin }).eq('id', taskId);
  if(error) console.error('addActualMinToTask failed', error);
}
/* Credits whatever work-time has elapsed in the current phase to the linked task,
   without double-counting time already credited (tracked via creditedMin). Safe to
   call on every stop/skip/natural-completion. */
function pomoFlushCredit(){
  const p = state.pomo;
  if(p.mode !== 'work' || !p.linkedTaskId) return;
  const elapsedSec = p.workMin*60 - p.remaining;
  const elapsedMin = Math.floor(elapsedSec/60);
  const deltaMin = elapsedMin - p.creditedMin;
  if(deltaMin > 0){
    addActualMinToTask(p.linkedTaskId, deltaMin);
    p.creditedMin = elapsedMin;
  }
}

function pomoTick(){
  const p = state.pomo;
  if(p.remaining > 0){
    p.remaining--;
    const el = document.querySelector('.pomo-timer');
    if(el) el.textContent = formatTime(p.remaining);
  } else {
    playAlarm(p.mode);
    if(p.mode === 'work'){
      pomoFlushCredit();
      p.creditedMin = 0;
      p.cyclesDone++;
      p.mode = 'break';
      p.remaining = p.breakMin * 60;
    } else {
      p.mode = 'work';
      p.remaining = p.workMin * 60;
    }
    render();
  }
}
function pomoActuallyStart(){
  const p = state.pomo;
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
  p.running = true;
  p.timerId = setInterval(pomoTick, 1000);
  render();
}
function pomoToggle(){
  const p = state.pomo;
  if(p.running){
    pomoFlushCredit();
    p.running = false;
    clearInterval(p.timerId);
    render();
    return;
  }
  if(!p.taskDecided){
    state.pomoTaskPicker = { search:'' };
    render();
    return;
  }
  pomoActuallyStart();
}
function pomoPickTask(taskId){
  state.pomo.linkedTaskId = taskId;
  state.pomo.taskDecided = true;
  state.pomoTaskPicker = null;
  pomoActuallyStart();
}
function pomoSkipTaskPick(){
  state.pomo.linkedTaskId = null;
  state.pomo.taskDecided = true;
  state.pomoTaskPicker = null;
  pomoActuallyStart();
}
function pomoCancelTaskPick(){
  state.pomoTaskPicker = null;
  render();
}
function pomoSetTaskPickerSearch(v){ state.pomoTaskPicker.search = v; render(); }
function pomoReset(){
  const p = state.pomo;
  clearInterval(p.timerId);
  p.running = false;
  p.mode = 'work';
  p.remaining = p.workMin * 60;
  p.creditedMin = 0;
  p.linkedTaskId = null;
  p.taskDecided = false;
  render();
}
function pomoSkip(){
  const p = state.pomo;
  if(p.mode === 'work'){
    pomoFlushCredit();
    p.creditedMin = 0;
    p.mode = 'break'; p.remaining = p.breakMin*60;
  } else {
    p.mode = 'work'; p.remaining = p.workMin*60;
  }
  render();
}
async function setPomoSetting(key, value){
  const v = Math.max(1, parseInt(value) || 1);
  state.pomo[key] = v;
  if(!state.pomo.running){
    state.pomo.remaining = (state.pomo.mode === 'work' ? state.pomo.workMin : state.pomo.breakMin) * 60;
  }
  render();
  const { error } = await sb.from('pomo_settings').update({ work_min:state.pomo.workMin, break_min:state.pomo.breakMin }).eq('id', 1);
  if(error) console.error('setPomoSetting failed', error);
}
function p_setFocusLabel(v){ state.pomo.focusLabel = v; }


/* ---------- floating add-task button ---------- */
function renderFab(){
  return `<button class="fab" onclick="openTaskEditorNew()" title="افزودن تسک" aria-label="افزودن تسک">+</button>`;
}

/* ---------- streak (Duolingo-style: consecutive days with >=1 task completed on that task's own date) ---------- */
function computeStreak(){
  const doneDates = new Set();
  state.tasks.forEach(t => { if(t.done && t.date) doneDates.add(t.date); });

  const todayKey = dateKey(new Date());
  const atRisk = !doneDates.has(todayKey);

  let streak = 0;
  const cursor = new Date();
  if(atRisk) cursor.setDate(cursor.getDate() - 1); // today not done yet: count contiguous days ending yesterday
  while(doneDates.has(dateKey(cursor))){
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return { streak, atRisk };
}
function renderStreakBadge(){
  const { streak, atRisk } = computeStreak();
  return `
    <div class="streak-badge ${atRisk ? 'at-risk' : ''}" title="${atRisk ? 'امروز هنوز تسکی تکمیل نکردی — استریکت در خطره' : 'امروز حفظ شد'}">
      <span class="streak-flame">🔥</span>
      <span class="streak-count mono">${toFaDigits(streak)}</span>
      <span class="streak-label">روز پیاپی</span>
    </div>
  `;
}

/* ---------- archive (completed tasks older than the threshold, hidden from the main list) ---------- */
const ARCHIVE_THRESHOLD_DAYS = 7;
function isArchived(t){
  if(!t.done || !t.completedAt) return false;
  const days = (Date.now() - new Date(t.completedAt).getTime()) / (1000*60*60*24);
  return days > ARCHIVE_THRESHOLD_DAYS;
}
function setArchiveSearch(v){ state.archiveFilters.search = v; render(); }
function toggleArchiveTag(tagId){
  const f = state.archiveFilters;
  f.tagIds = f.tagIds.includes(tagId) ? f.tagIds.filter(id => id !== tagId) : [...f.tagIds, tagId];
  render();
}
function setArchiveDateFrom(v){ state.archiveFilters.dateFrom = v || null; render(); }
function setArchiveDateTo(v){ state.archiveFilters.dateTo = v || null; render(); }
function resetArchiveFilters(){ state.archiveFilters = { search:'', tagIds:[], dateFrom:null, dateTo:null }; render(); }

/* ---------- nav / render ---------- */
function setView(v){ state.view = v; render(); }

function render(){
  const { jalali, gregorian } = fmtHeaderDate(state.today);
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <div class="brand">
        <h1>مدار</h1>
        <div class="sub">سیستم برنامه‌ریزی شخصی</div>
      </div>
      <div class="date-block">
        <div class="jalali">${jalali}</div>
        <div class="gregorian">${gregorian}</div>
      </div>
    </header>

    <nav>
      <button class="${state.view==='today' ? 'active' : ''}" onclick="setView('today')">امروز</button>
      <button class="${state.view==='tasks' ? 'active' : ''}" onclick="setView('tasks')">تسک‌ها</button>
      <button class="${state.view==='calendar' ? 'active' : ''}" onclick="setView('calendar')">تقویم</button>
      <button class="${state.view==='pomodoro' ? 'active' : ''}" onclick="setView('pomodoro')">پومودورو</button>
      <button class="${state.view==='archive' ? 'active' : ''}" onclick="setView('archive')">آرشیو</button>
    </nav>

    ${loadError ? `<div class="empty-state" style="background:var(--surface);border:1px solid var(--danger);border-radius:10px;color:var(--danger);margin-bottom:16px;">اتصال به دیتابیس برقرار نشد — اینترنتت رو چک کن و صفحه رو رفرش کن.</div>` : ''}

    <main>
      ${state.view === 'today' ? renderToday() : ''}
      ${state.view === 'tasks' ? renderTasksView() : ''}
      ${state.view === 'calendar' ? renderCalendarPage() : ''}
      ${state.view === 'pomodoro' ? renderPomodoro() : ''}
      ${state.view === 'archive' ? renderArchivePage() : ''}
    </main>
    ${(state.view === 'today' || state.view === 'tasks') ? renderFab() : ''}
    ${renderTaskEditorModal()}
  `;
}

loadAll();

/* ---------- PWA: register the app-shell service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.error('SW register failed', e));
  });
}
</script>
