/* ---------- duration suggestion engine ----------
   Suggests a duration for a new/edited task based on ACTUAL time previously
   logged (via Pomodoro) on similar past tasks. Three tiers, most confident first:
   1. exact  — prior tasks with the exact same title (case-insensitive)
   2. keyword — prior tasks sharing a tag AND at least one meaningful title word
   3. tag     — prior tasks sharing a tag only (rough fallback)
   Never invented from nothing: each tier requires real matching history. */
const SUGGESTION_STOPWORDS = new Set([
  'و','در','با','برای','از','به','رو','این','آن','یک','تا','هم','که','یا','بر','را','های','ها',
  'می','شد','شده','کن','کردن','است','بود','چند','هر','یه','اون','این‌','روی','بین','چه',
]);
const SUGGESTION_NUMBER_WORDS = new Set([
  'صفر','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده',
  'یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده','بیست',
  'سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود','صد',
]);
function tokenizeTaskTitle(str){
  return toEnDigits(str || '')
    .replace(/[^\u0600-\u06FF\u0750-\u077Fa-zA-Z0-9\s]/g, ' ')
    .split(/\s+/)
    .map(w => w.trim())
    .filter(w => w.length >= 2)
    .filter(w => !SUGGESTION_STOPWORDS.has(w))
    .filter(w => !SUGGESTION_NUMBER_WORDS.has(w))
    .filter(w => !/^[0-9]+$/.test(w));
}
function computeDurationSuggestion(){
  const ed = state.taskEditor;
  if(!ed) return null;
  const title = (ed.draft.title || '').trim();
  const tagIds = ed.draft.tagIds;
  if(!tagIds.length) return null;

  const candidates = state.tasks.filter(t =>
    t.actualMin && t.actualMin > 0 &&
    t.tagIds.some(id => tagIds.includes(id)) &&
    (!ed.taskId || t.id !== ed.taskId)
  );
  if(!candidates.length) return null;

  if(title){
    const exact = candidates.filter(t => t.title.trim().toLowerCase() === title.toLowerCase());
    if(exact.length){
      const avg = Math.round(exact.reduce((s,t) => s + t.actualMin, 0) / exact.length);
      return { minutes: avg, tier:'exact', count: exact.length };
    }
  }

  const myTokens = new Set(tokenizeTaskTitle(title));
  if(myTokens.size){
    const keywordMatches = candidates.filter(t => tokenizeTaskTitle(t.title).some(tok => myTokens.has(tok)));
    if(keywordMatches.length >= 3){
      const avg = Math.round(keywordMatches.reduce((s,t) => s + t.actualMin, 0) / keywordMatches.length);
      return { minutes: avg, tier:'keyword', count: keywordMatches.length };
    }
  }

  if(candidates.length >= 3){
    const avg = Math.round(candidates.reduce((s,t) => s + t.actualMin, 0) / candidates.length);
    return { minutes: avg, tier:'tag', count: candidates.length };
  }
  return null;
}
function renderDurationSuggestionChip(){
  const sug = computeDurationSuggestion();
  if(!sug) return '';
  const labels = {
    exact:   `پیشنهادی (دقیق، بر اساس ${toFaDigits(sug.count)} کار هم‌نام)`,
    keyword: `پیشنهادی (مشابه، بر اساس ${toFaDigits(sug.count)} کار مرتبط)`,
    tag:     `تخمین کلی برچسب (بر اساس ${toFaDigits(sug.count)} کار، شاید دقیق نباشه)`,
  };
  return `<span class="quick-chip suggestion-chip" onclick="editorQuickDuration(${sug.minutes})" title="${labels[sug.tier]}">${icon('target',12)} ${labels[sug.tier]}: ${formatDuration(sug.minutes)}</span>`;
}

async function confirmTaskEditor(){
  const titleInput = document.getElementById('editor-title');
  const title = titleInput.value.trim();
  if(!title){ titleInput.focus(); return; }
  const ed = state.taskEditor;
  ed.draft.title = title;

  if(ed.mode === 'create' && ed.draft.recurring.enabled){
    if(ed.draft.recurring.weekdays.length === 0){ return; } // need at least one day picked
    await createRecurringTemplate();
    return;
  }

  const taskRow = {
    title: ed.draft.title, priority: ed.draft.priority,
    date: ed.draft.date || null, duration_min: ed.draft.durationMin,
  };

  if(ed.mode === 'create'){
    const newTask = {
      id: uid(), title: ed.draft.title, done:false, completedAt:null,
      tagIds: ed.draft.tagIds, priority: ed.draft.priority,
      subtasks: ed.draft.subtasks, date: ed.draft.date, durationMin: ed.draft.durationMin, actualMin: null,
      recurringTemplateId: null,
    };
    state.tasks.unshift(newTask);
    state.taskEditor = null;
    render();

    const { error: taskErr } = await sb.from('tasks').insert({ id:newTask.id, ...taskRow, done:false });
    if(taskErr){ writeFailed('create task', taskErr); return; }
    if(newTask.tagIds.length){
      const { error: tagErr } = await sb.from('task_tags').insert(newTask.tagIds.map(tagId => ({ task_id:newTask.id, tag_id:tagId })));
      if(tagErr) writeFailed('link tags', tagErr);
    }
    if(newTask.subtasks.length){
      const { error: subErr } = await sb.from('subtasks').insert(newTask.subtasks.map((s,i) => ({ id:s.id, task_id:newTask.id, title:s.title, done:false, position:i })));
      if(subErr) writeFailed('create subtasks', subErr);
    }
  } else {
    const t = state.tasks.find(t => t.id === ed.taskId);
    if(!t){ state.taskEditor = null; render(); return; }
    const prevSubtasks = t.subtasks;
    const prevDate = t.date;
    t.title = ed.draft.title; t.tagIds = ed.draft.tagIds; t.priority = ed.draft.priority;
    t.date = ed.draft.date; t.durationMin = ed.draft.durationMin; t.subtasks = ed.draft.subtasks;
    const applyToFuture = ed.isRecurringInstance && ed.applyToFutureRecurring && ed.recurringTemplateId;
    state.taskEditor = null;
    render();

    const { error: taskErr } = await sb.from('tasks').update(taskRow).eq('id', t.id);
    if(taskErr) writeFailed('update task', taskErr);
    if(prevDate !== t.date) logTaskDateChange(t.id, prevDate, t.date);

    const { error: delTagErr } = await sb.from('task_tags').delete().eq('task_id', t.id);
    if(delTagErr) writeFailed('clear tags', delTagErr);
    if(t.tagIds.length){
      const { error: tagErr } = await sb.from('task_tags').insert(t.tagIds.map(tagId => ({ task_id:t.id, tag_id:tagId })));
      if(tagErr) writeFailed('relink tags', tagErr);
    }

    /* Sync subtasks by diffing against what existed before, instead of deleting
       everything and reinserting with brand-new ids — that used to desync local
       state from the DB (and made realtime echo back a spurious delete). */
    const prevIds = new Set(prevSubtasks.map(s => s.id));
    const currIds = new Set(t.subtasks.map(s => s.id));
    const removedIds = prevSubtasks.filter(s => !currIds.has(s.id)).map(s => s.id);
    const newOnes = t.subtasks.filter(s => !prevIds.has(s.id));
    const keptOnes = t.subtasks.filter(s => prevIds.has(s.id));

    if(removedIds.length){
      const { error } = await sb.from('subtasks').delete().in('id', removedIds);
      if(error) writeFailed('delete removed subtasks', error);
    }
    if(newOnes.length){
      const { error } = await sb.from('subtasks').insert(newOnes.map(s => ({
        id:s.id, task_id:t.id, title:s.title, done:s.done, position:t.subtasks.indexOf(s),
      })));
      if(error) writeFailed('insert new subtasks', error);
    }
    await Promise.all(keptOnes.map(s =>
      sb.from('subtasks').update({ title:s.title, done:s.done, position:t.subtasks.indexOf(s) }).eq('id', s.id)
        .then(({ error }) => { if(error) writeFailed('update subtask', error); })
    ));

    if(applyToFuture){
      await updateRecurringTemplateFromInstance(ed.recurringTemplateId, t);
    }
  }
}
async function createRecurringTemplate(){
  const ed = state.taskEditor;
  const d = ed.draft;
  const tpl = {
    id: uid(), title: d.title, priority: d.priority, durationMin: d.durationMin,
    weekdays: [...d.recurring.weekdays], active:true, tagIds: [...d.tagIds],
  };
  state.recurringTemplates.push(tpl);
  state.taskEditor = null;
  render();

  const { error: tplErr } = await sb.from('recurring_templates').insert({
    id: tpl.id, title: tpl.title, priority: tpl.priority, duration_min: tpl.durationMin,
    weekdays: tpl.weekdays, active: true,
  });
  if(tplErr){ writeFailed('create recurring template', tplErr); return; }
  if(tpl.tagIds.length){
    const { error: tagErr } = await sb.from('recurring_template_tags').insert(tpl.tagIds.map(tagId => ({ template_id:tpl.id, tag_id:tagId })));
    if(tagErr) writeFailed('link recurring template tags', tagErr);
  }
  await maybeGenerateTodayForTemplate(tpl);
}
async function updateRecurringTemplateFromInstance(templateId, instance){
  const tpl = state.recurringTemplates.find(t => t.id === templateId);
  if(!tpl) return;
  tpl.title = instance.title; tpl.priority = instance.priority; tpl.durationMin = instance.durationMin; tpl.tagIds = [...instance.tagIds];
  render();

  const { error: tplErr } = await sb.from('recurring_templates')
    .update({ title: tpl.title, priority: tpl.priority, duration_min: tpl.durationMin })
    .eq('id', templateId);
  if(tplErr) writeFailed('update recurring template', tplErr);

  const { error: delErr } = await sb.from('recurring_template_tags').delete().eq('template_id', templateId);
  if(delErr) writeFailed('clear recurring template tags', delErr);
  if(tpl.tagIds.length){
    const { error: tagErr } = await sb.from('recurring_template_tags').insert(tpl.tagIds.map(tagId => ({ template_id:templateId, tag_id:tagId })));
    if(tagErr) writeFailed('relink recurring template tags', tagErr);
  }
}
/* A recurring instance that was never finished stays on "today" as an overdue
   item ONLY until the task comes round again. The moment the next scheduled day
   arrives, the stale instance is dropped and a fresh one takes its place — an
   overdue chore never stacks up, and what you see is always the current turn. */
async function dropStaleRecurringInstances(templateId, todayStr){
  const stale = state.tasks.filter(t =>
    t.recurringTemplateId === templateId && !t.done && t.date && t.date < todayStr
  );
  if(!stale.length) return;
  const ids = stale.map(t => t.id);
  state.tasks = state.tasks.filter(t => !ids.includes(t.id));
  const { error } = await sb.from('tasks').delete().in('id', ids);
  if(error) writeFailed('drop stale recurring instances', error);
}
async function maybeGenerateTodayForTemplate(tpl){
  if(!tpl.active) return;
  const todayStr = dateKey(new Date());
  const todayWeekday = new Date().getDay();
  if(!tpl.weekdays.includes(todayWeekday)) return;
  if(state.tasks.some(t => t.recurringTemplateId === tpl.id && t.date === todayStr)) return;
  await dropStaleRecurringInstances(tpl.id, todayStr);

  const newTask = {
    id: uid(), title: tpl.title, done:false, completedAt:null,
    tagIds: [...tpl.tagIds], priority: tpl.priority, subtasks:[], date: todayStr,
    durationMin: tpl.durationMin, actualMin: null, recurringTemplateId: tpl.id,
  };
  state.tasks.unshift(newTask);
  render();

  const { error: taskErr } = await sb.from('tasks').insert({
    id:newTask.id, title:newTask.title, priority:newTask.priority, date:newTask.date,
    duration_min:newTask.durationMin, done:false, recurring_template_id:tpl.id,
  });
  if(taskErr){ writeFailed('generate recurring instance', taskErr); return; }
  if(newTask.tagIds.length){
    const { error: tagErr } = await sb.from('task_tags').insert(newTask.tagIds.map(tagId => ({ task_id:newTask.id, tag_id:tagId })));
    if(tagErr) writeFailed('link recurring instance tags', tagErr);
  }
}
function generateRecurringInstances(){
  state.recurringTemplates.forEach(tpl => { maybeGenerateTodayForTemplate(tpl); });
}

/* ---------- rendering: custom Jalali calendar ---------- */
function renderTaskCalendar(){
  const ed = state.taskEditor;
  if(ed.calendarPanel === 'day') return renderCalendarDayPanel();
  const jy = ed.calendarViewJY, jm = ed.calendarViewJM;
  const monthLen = window.jalaali.jalaaliMonthLength(jy, jm);
  const firstG = window.jalaali.toGregorian(jy, jm, 1);
  const firstDate = new Date(firstG.gy, firstG.gm - 1, firstG.gd);
  const jsDay = firstDate.getDay(); // 0=Sun..6=Sat
  const startOffset = (jsDay + 1) % 7; // Persian week starts Saturday

  const dayTagsMap = {};
  for(let dnum = 1; dnum <= monthLen; dnum++){
    const g = window.jalaali.toGregorian(jy, jm, dnum);
    const key = dateKey(new Date(g.gy, g.gm - 1, g.gd));
    const dayTasks = state.tasks.filter(t => t.date === key);
    const previews = getRecurringPreviewsForDate(key);
    if(dayTasks.length || previews.length){
      const tagIds = [];
      dayTasks.forEach(t => t.tagIds.forEach(tid => { if(!tagIds.includes(tid)) tagIds.push(tid); }));
      previews.forEach(tpl => tpl.tagIds.forEach(tid => { if(!tagIds.includes(tid)) tagIds.push(tid); }));
      dayTagsMap[dnum] = { tagIds, key, hasReal: dayTasks.length > 0 };
    }
  }

  const todayJ = window.jalaali.toJalaali(new Date());
  const selJ = ed.draft.date ? window.jalaali.toJalaali(new Date(ed.draft.date)) : null;

  const cells = [];
  for(let i = 0; i < startOffset; i++) cells.push(null);
  for(let dnum = 1; dnum <= monthLen; dnum++) cells.push(dnum);

  return `
    <div class="task-calendar">
      <div class="cal-header">
        <button type="button" class="cal-nav" onclick="calendarPrevMonth()">ماه قبل</button>
        <div class="cal-title">
          <span class="cal-jalali">${MONTHS_JALALI[jm-1]} ${toFaDigits(jy)}</span>
          <span class="cal-greg">${MONTHS_GREG_FA[firstG.gm-1]} ${firstG.gy}</span>
        </div>
        <button type="button" class="cal-nav" onclick="calendarNextMonth()">ماه بعد</button>
      </div>
      <div class="cal-weekdays">
        ${['ش','ی','د','س','چ','پ','ج'].map(w => `<span>${w}</span>`).join('')}
      </div>
      <div class="cal-grid">
        ${cells.map(dnum => {
          if(dnum === null) return `<div class="cal-cell empty"></div>`;
          const info = dayTagsMap[dnum];
          const isToday = (jy===todayJ.jy && jm===todayJ.jm && dnum===todayJ.jd);
          const isSelected = selJ && jy===selJ.jy && jm===selJ.jm && dnum===selJ.jd;
          return `
            <div class="cal-cell ${isToday?'today':''} ${isSelected?'selected':''}" onclick="calendarPickDay(${jy},${jm},${dnum})">
              ${(info && info.hasReal) ? `<span class="cal-info-btn" onclick="calendarShowDayDetail('${info.key}', event)" title="جزئیات این روز">ⓘ</span>` : ''}
              <span class="cal-daynum">${toFaDigits(dnum)}</span>
              ${info ? `
                <div class="cal-tags">
                  ${info.tagIds.slice(0,3).map(tid => { const tag = state.tags.find(t=>t.id===tid); return tag ? `<span class="cal-tag-dot" style="background:${tag.color}" title="${escapeHtml(tag.name)}"></span>` : ''; }).join('')}
                  ${info.tagIds.length > 3 ? `<span class="cal-tag-more">+${toFaDigits(info.tagIds.length-3)}</span>` : ''}
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* Pausing stops new occurrences until resumed. An unfinished occurrence for
   today or later goes too — otherwise a "paused" task would still sit on today.
   Finished ones are history and stay. Resuming generates today's right away. */
async function toggleRecurringActive(templateId){
  const tpl = state.recurringTemplates.find(t => t.id === templateId);
  if(!tpl) return;
  tpl.active = !tpl.active;
  let dropIds = [];
  if(!tpl.active){
    const todayStr = dateKey(new Date());
    dropIds = state.tasks.filter(t => t.recurringTemplateId === templateId && !t.done && t.date && t.date >= todayStr).map(t => t.id);
    state.tasks = state.tasks.filter(t => !dropIds.includes(t.id));
  }
  render();
  const { error } = await sb.from('recurring_templates').update({ active: tpl.active }).eq('id', templateId);
  if(error){ writeFailed('toggleRecurringActive', error); return; }
  if(dropIds.length){
    const { error: delErr } = await sb.from('tasks').delete().in('id', dropIds);
    if(delErr) writeFailed('drop paused recurring instances', delErr);
  }
  if(tpl.active) await maybeGenerateTodayForTemplate(tpl);
}
async function deleteRecurringTemplate(templateId){
  state.recurringTemplates = state.recurringTemplates.filter(t => t.id !== templateId);
  state.tasks.forEach(t => { if(t.recurringTemplateId === templateId) t.recurringTemplateId = null; });
  render();
  const { error } = await sb.from('recurring_templates').delete().eq('id', templateId);
  if(error) writeFailed('deleteRecurringTemplate', error);
}
/* Stops a series from generating any FUTURE occurrences. Past instances and
   today's (already-generated) one are real tasks and stay untouched — deleting
   history would erase work you actually did. */
async function deleteRecurringFuture(templateId){
  const tpl = state.recurringTemplates.find(t => t.id === templateId);
  if(!tpl) return;
  const todayStr = dateKey(new Date());
  const futureInstances = state.tasks.filter(t => t.recurringTemplateId === templateId && t.date && t.date > todayStr);
  const futureIds = futureInstances.map(t => t.id);
  state.recurringTemplates = state.recurringTemplates.filter(t => t.id !== templateId);
  state.tasks = state.tasks.filter(t => !futureIds.includes(t.id));
  state.tasks.forEach(t => { if(t.recurringTemplateId === templateId) t.recurringTemplateId = null; });
  showUndoToast(`تکرارِ «${tpl.title}» متوقف شد`, () => {
    state.recurringTemplates.push(tpl);
    futureInstances.forEach(t => state.tasks.push(t));
    render();
  });
  render();
  if(futureIds.length){
    const { error: delErr } = await sb.from('tasks').delete().in('id', futureIds);
    if(delErr) writeFailed('delete future recurring instances', delErr);
  }
  const { error } = await sb.from('recurring_templates').delete().eq('id', templateId);
  if(error) writeFailed('deleteRecurringFuture', error);
}

async function generateAIReportNow(){
  state.aiReportGenerating = true;
  state.aiReportError = null;
  render();
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/generate-ai-report`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify({ force:true }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'خطای ناشناخته');
    if(data.skipped){
      state.aiReportError = 'هنوز وقتش نشده — هر ۴ روز یه گزارش تازه ساخته می‌شه.';
    } else {
      const { data: rows, error } = await sb.from('ai_reports').select('*').order('period_end', { ascending:false });
      if(error) throw error;
      state.aiReports = rows.map(r => ({ id:r.id, periodStart:r.period_start, periodEnd:r.period_end, text:r.report_text, createdAt:r.created_at }));
    }
  } catch(e){
    console.error('generateAIReportNow failed', e);
    state.aiReportError = e.message || 'خطا در تولید گزارش. اگه تازه کلید API رو اضافه کردی، چک کن درست ذخیره شده باشه.';
  }
  state.aiReportGenerating = false;
  render();
}
function renderAIReportsPage(){
  return `
    <h2 class="section-title">گزارش هوشمند</h2>
    <button type="button" class="add-task-for-day-btn" onclick="generateAIReportNow()" ${state.aiReportGenerating ? 'disabled' : ''}>
      ${state.aiReportGenerating ? 'در حال تولید…' : `${icon('sparkle',14)} تولید گزارش الان`}
    </button>
    ${state.aiReportError ? `<div class="empty-state" style="background:var(--surface);border:1px solid var(--danger);border-radius:10px;color:var(--danger);margin-top:12px;padding:12px;">${escapeHtml(state.aiReportError)}</div>` : ''}
    ${state.aiReports.length === 0 ? `
      <div class="empty-state" style="margin-top:16px;">
        هنوز گزارشی ساخته نشده. یه گزارش خودکار هر ۴ روز ساخته می‌شه، یا همین الان با دکمه‌ی بالا بساز.

function renderArchiveTasks(){

  const search = f.search.trim();
  let list = state.tasks.filter(isArchived);
  if(search) list = list.filter(t => t.title.includes(search));
  if(f.tagIds.length) list = list.filter(t => t.tagIds.some(id => f.tagIds.includes(id)));
  if(f.dateFrom) list = list.filter(t => t.completedAt && t.completedAt.slice(0,10) >= f.dateFrom);
  if(f.dateTo) list = list.filter(t => t.completedAt && t.completedAt.slice(0,10) <= f.dateTo);
  list = [...list].sort((a,b) => (b.completedAt||'').localeCompare(a.completedAt||''));
  const active = !!(search || f.tagIds.length || f.dateFrom || f.dateTo);
  return `

/* ---------- subscriptions ---------- */
function daysUntil(dateStr){
  if(!dateStr) return null;
  const todayStr = dateKey(new Date());
  const a = new Date(todayStr + 'T00:00:00');
  const b = new Date(dateStr + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function advanceRenewal(dateStr, cycle){
  const d = new Date(dateStr + 'T00:00:00');
  if(cycle === 'yearly') d.setFullYear(d.getFullYear() + 1);
  else d.setMonth(d.getMonth() + 1);
  return dateKey(d);
}
function subDueLabel(sub){
  const n = daysUntil(sub.nextRenewal);
  if(n === null) return { text:'تاریخ تمدید ثبت نشده', cls:'' };
  if(n < 0) return { text:`${toFaDigits(Math.abs(n))} روز از تمدید گذشته`, cls:'late' };
  if(n === 0) return { text:'امروز تمدید می‌شه', cls:'late' };
  if(n === 1) return { text:'فردا تمدید می‌شه', cls:'' };
  return { text:`${toFaDigits(n)} روز تا تمدید`, cls:'' };
}
function subState(sub){
  if(!sub.active) return 'inactive';
  const n = daysUntil(sub.nextRenewal);
  if(n === null) return '';
  if(n < 0) return 'overdue';
  if(n <= (sub.notifyDaysBefore || 0)) return 'due';
  return '';
}
function renderSubscriptionsPage(){
  const subs = state.subscriptions || [];
  const active = subs.filter(s => s.active);
  const inactive = subs.filter(s => !s.active);
  const alerts = active.filter(s => ['due','overdue'].includes(subState(s)));
  return `
    <h2 class="section-title">اشتراک‌ها</h2>
    ${alerts.length ? `
      <div class="encourage" style="border-inline-start-color:var(--danger);">
        <span style="color:var(--danger); flex-shrink:0; margin-top:2px;">${icon('clock',16)}</span>
        <span class="encourage-text">${toFaDigits(alerts.length)} اشتراک نزدیک تمدید یا گذشته‌ست: ${alerts.map(s => escapeHtml(s.name)).join('، ')}</span>
      </div>
    ` : ''}
    <button class="add-task-btn" onclick="openSubscriptionEditor(null)" style="margin-bottom:16px;">+ افزودن اشتراک</button>
    ${active.length === 0 ? `<div class="empty-state">اشتراک فعالی ثبت نشده</div>` : active.map(renderSubRow).join('')}
    ${inactive.length ? `
      <div class="sub-section-label">
        <button type="button" onclick="toggleInactiveSubs()" style="background:none;border:none;color:var(--text-muted);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0;">
          غیرفعال‌ها (${toFaDigits(inactive.length)}) ${state.subscriptionShowInactive ? '▲' : '▼'}
        </button>
      </div>
      ${state.subscriptionShowInactive ? inactive.map(renderSubRow).join('') : ''}
    ` : ''}
  `;
}
function toggleInactiveSubs(){ state.subscriptionShowInactive = !state.subscriptionShowInactive; render(); }
function renderSubRow(sub){
  const due = subDueLabel(sub);
  const st = subState(sub);
  return `
    <div class="sub-row ${st}">
      <div class="sub-main">
        <div class="sub-name">${escapeHtml(sub.name)}</div>

          ${sub.active ? `<span class="sub-due ${due.cls}">${due.text}</span>` : `<span>غیرفعال</span>`}

async function confirmSubscriptionEditor(){
  const ed = state.subscriptionEditor;
  if(!ed || !ed.name.trim()) return;
  const payload = {
    name: ed.name.trim(),
    cycle: ed.cycle,
    next_renewal: ed.nextRenewal || null,
    notify_days_before: ed.notifyDaysBefore,
    note: ed.note || null,
  };
  if(ed.subId){
    const sub = state.subscriptions.find(s => s.id === ed.subId);
    const before = { name:sub.name, cycle:sub.cycle, nextRenewal:sub.nextRenewal, notifyDaysBefore:sub.notifyDaysBefore, note:sub.note };
    Object.assign(sub, { name:payload.name, cycle:payload.cycle, nextRenewal:ed.nextRenewal, notifyDaysBefore:ed.notifyDaysBefore, note:ed.note });
    state.subscriptionEditor = null; render();
    await persist(sb.from('subscriptions').update(payload).eq('id', ed.subId), {
      message: `تغییرات «${before.name}» ذخیره نشد — اینترنتت رو چک کن و دوباره امتحان کن.`,
      rollback: () => Object.assign(sub, before),
    });
  } else {
    const id = crypto.randomUUID();
    state.subscriptions.push({ id, name:payload.name, cycle:payload.cycle, nextRenewal:ed.nextRenewal, active:true, notifyDaysBefore:ed.notifyDaysBefore, note:ed.note });
    state.subscriptionEditor = null; render();
    await persist(sb.from('subscriptions').insert({ id, ...payload, active:true }), {
      message: `«${payload.name}» ذخیره نشد — اینترنتت رو چک کن و دوباره اضافه‌ش کن.`,
      rollback: () => { state.subscriptions = state.subscriptions.filter(s => s.id !== id); },
    });
  }
}
async function toggleSubActive(subId){
  const sub = state.subscriptions.find(s => s.id === subId);
  if(!sub) return;
  sub.active = !sub.active;
  render();
  await persist(sb.from('subscriptions').update({ active: sub.active }).eq('id', subId), {
    message: `وضعیت «${sub.name}» ذخیره نشد — اینترنتت رو چک کن.`,
    rollback: () => { sub.active = !sub.active; },
  });
}
async function markSubRenewed(subId){
  const sub = state.subscriptions.find(s => s.id === subId);
  if(!sub || !sub.nextRenewal) return;
  const before = sub.nextRenewal;
  sub.nextRenewal = advanceRenewal(sub.nextRenewal, sub.cycle);
  render();
  await persist(sb.from('subscriptions').update({ next_renewal: sub.nextRenewal }).eq('id', subId), {
    message: `تمدید «${sub.name}» ذخیره نشد — اینترنتت رو چک کن.`,
    rollback: () => { sub.nextRenewal = before; },
  });
}
async function deleteSubscription(subId){
  const idx = state.subscriptions.findIndex(s => s.id === subId);
  if(idx === -1) return;
  const [removed] = state.subscriptions.splice(idx, 1);
  render();
  await persist(sb.from('subscriptions').delete().eq('id', subId), {
    message: `حذف «${removed.name}» ذخیره نشد — اینترنتت رو چک کن.`,
    rollback: () => { state.subscriptions.splice(idx, 0, removed); },
  });
}

function promptFromRow(row){
  return {

function promptCategories(){
  return [...new Set((state.prompts || []).map(p => p.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fa'));

function filteredPrompts(){
  const q = state.promptSearch.trim().toLowerCase();
  const f = state.promptFilter;
  return (state.prompts || [])
    .filter(p => f === 'all' || (f === 'fav' ? p.favorite : p.category === f))
    .filter(p => !q || [p.title, p.body, p.note, p.category].some(s => s.toLowerCase().includes(q)))
    // favorites float to the top; otherwise newest first, as loaded
    .sort((a, b) => (b.favorite - a.favorite) || (b.createdAt || '').localeCompare(a.createdAt || ''));

function renderPromptsPage(){
  const all = state.prompts || [];

  const chip = (val, label) => `<button class="filter-chip ${state.promptFilter===val?'active':''}" data-v="${escapeAttr(val)}" onclick="setPromptFilter(this.dataset.v)">${label}</button>`;

async function copyPrompt(id, btn){
  const p = state.prompts.find(x => x.id === id);
  if(!p) return;
  try{
    await navigator.clipboard.writeText(p.body);
  } catch(e){
    // older iOS Safari / non-secure origins: fall back to a hidden textarea
    const ta = document.createElement('textarea');
    ta.value = p.body; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if(!ok){ showSaveError('کپی نشد — متن رو دستی انتخاب و کپی کن.'); render(); return; }
  }
  if(btn){
    btn.classList.add('copied');
    btn.innerHTML = `${icon('check',14)}<span>کپی شد</span>`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `${icon('copy',14)}<span>کپی</span>`;
    }, 1500);
  }
}

const pendingPromptDeleteTimers = {}; // promptId -> timeoutId, while the undo window is open
function deletePrompt(id){
  const idx = state.prompts.findIndex(x => x.id === id);
  if(idx === -1) return;
  const [removed] = state.prompts.splice(idx, 1);
  showUndoToast('پرامپت حذف شد', () => {
    clearTimeout(pendingPromptDeleteTimers[id]);
    delete pendingPromptDeleteTimers[id];
    state.prompts.splice(idx, 0, removed);
    render();
  });
  render();
  pendingPromptDeleteTimers[id] = setTimeout(async () => {
    delete pendingPromptDeleteTimers[id];
    const { error } = await sb.from('prompts').delete().eq('id', id);
    if(error) writeFailed('deletePrompt', error);
  }, 5000);
}

/* ---------- reminders ("یادت نره") ----------
   Things that aren't tasks and have no place on a to-do list, but must not slip
   your mind: a subscription you paid for and haven't used, a birthday, a date
   you promised someone. Four shapes, one surface:
     once     — a single day ("۲۰ دی تبریک بگم")
     yearly   — the same Jalali day every year (birthdays, anniversaries)
     deadline — use-it-before-it-expires; counts down from far out
     always   — no date at all; sits at the top until you retire it
   Each one starts showing `leadDays` before its date and keeps showing until
   you tick it off, so nothing quietly passes while you weren't looking. */
const REMINDER_KIND_LABEL = { once:'یک‌بار', yearly:'سالانه', deadline:'مهلت‌دار', always:'همیشگی' };
const REMINDER_DEFAULT_LEAD = { once:3, yearly:7, deadline:14, always:0 };
const REMINDER_STATUS_RANK = { late:0, expired:0, today:1, soon:2, pinned:3 };
/* a yearly reminder you never ticked off rolls to next year once it's this far past */
const REMINDER_YEARLY_GRACE_DAYS = 30;

/* Same Jalali day, next Jalali year — not +365 days, so «۲۰ دی» stays ۲۰ دی. */
function advanceJalaliYear(dateStr){
  const j = window.jalaali.toJalaali(new Date(dateStr + 'T00:00:00'));
  const jy = j.jy + 1;
  const jd = Math.min(j.jd, window.jalaali.jalaaliMonthLength(jy, j.jm)); // ۳۰ اسفند in a common year
  const g = window.jalaali.toGregorian(jy, j.jm, jd);
  return dateKey(new Date(g.gy, g.gm - 1, g.gd));
}
function reminderStatus(r){
  if(r.kind === 'always' || !r.date) return 'pinned';
  const n = daysUntil(r.date);
  if(n < 0) return r.kind === 'deadline' ? 'expired' : 'late';
  if(n === 0) return 'today';
  return 'soon';
}
function reminderVisible(r){
  if(r.done) return false;
  if(r.kind === 'always' || !r.date) return true;
  return daysUntil(r.date) <= (r.leadDays || 0);
}
function activeReminders(){
  return (state.reminders || []).filter(reminderVisible).sort((a,b) => {
    const ra = REMINDER_STATUS_RANK[reminderStatus(a)], rb = REMINDER_STATUS_RANK[reminderStatus(b)];
    if(ra !== rb) return ra - rb;
    const da = a.date ? daysUntil(a.date) : 9999, db = b.date ? daysUntil(b.date) : 9999;
    return da - db;
  });
}
function reminderDueLabel(r){
  if(r.kind === 'always' || !r.date) return 'همیشه یادت باشه';
  const n = daysUntil(r.date);
  if(r.kind === 'deadline'){
    if(n < 0)  return `${toFaDigits(Math.abs(n))} روز از مهلتش گذشته`;
    if(n === 0) return 'امروز آخرین مهلته';
    if(n === 1) return 'فردا مهلتش تموم می‌شه';
    return `${toFaDigits(n)} روز تا تموم شدن مهلت`;
  }
  if(n < 0)   return `${toFaDigits(Math.abs(n))} روز گذشته`;
  if(n === 0) return 'همین امروزه';
  if(n === 1) return 'فرداست';
  return `${toFaDigits(n)} روز مونده`;
}

/* ---------- reminders: editor ---------- */
function openReminderEditor(reminderId){
  const r = reminderId ? state.reminders.find(x => x.id === reminderId) : null;
  const base = r ? { reminderId:r.id, title:r.title, kind:r.kind, date:r.date, leadDays:r.leadDays, note:r.note }
                 : { reminderId:null, title:'', kind:'once', date:'', leadDays:REMINDER_DEFAULT_LEAD.once, note:'' };
  const j = window.jalaali.toJalaali(base.date ? new Date(base.date + 'T00:00:00') : new Date());
  state.reminderEditor = Object.assign(base, { calendarOpen:false, calJY:j.jy, calJM:j.jm });
  render();
}
function closeReminderEditor(){ state.reminderEditor = null; render(); }
/* Title and note write straight to the draft from their oninput — re-rendering
   mid-word would steal the caret. Only the lead-days field, which commits on
   blur, needs the redraw. */
function reminderEditorSetLead(value){
  const ed = state.reminderEditor;
  if(!ed) return;
  ed.leadDays = Math.max(0, parseInt(toEnDigits(String(value)), 10) || 0);
  render();
}
function reminderEditorSetKind(kind){
  const ed = state.reminderEditor;
  ed.kind = kind;
  ed.leadDays = REMINDER_DEFAULT_LEAD[kind];
  if(kind === 'always'){ ed.date = ''; ed.calendarOpen = false; }
  render();
}
function toggleReminderCalendar(){
  const ed = state.reminderEditor;
  ed.calendarOpen = !ed.calendarOpen;
  if(ed.calendarOpen){
    const j = window.jalaali.toJalaali(ed.date ? new Date(ed.date + 'T00:00:00') : new Date());
    ed.calJY = j.jy; ed.calJM = j.jm;
  }
  render();
}
function reminderCalPrevMonth(){
  const ed = state.reminderEditor;
  ed.calJM--; if(ed.calJM < 1){ ed.calJM = 12; ed.calJY--; }
  render();
}
function reminderCalNextMonth(){
  const ed = state.reminderEditor;
  ed.calJM++; if(ed.calJM > 12){ ed.calJM = 1; ed.calJY++; }
  render();
}
function reminderCalPick(jy, jm, jd){
  const g = window.jalaali.toGregorian(jy, jm, jd);
  const ed = state.reminderEditor;
  ed.date = dateKey(new Date(g.gy, g.gm - 1, g.gd));
  ed.calendarOpen = false;
  render();
}
/* The same Jalali grid the task editor uses, minus the per-day task dots —
   a reminder only ever needs to pick one day. */
function renderReminderCalendar(){
  const ed = state.reminderEditor;
  const jy = ed.calJY, jm = ed.calJM;
  const monthLen = window.jalaali.jalaaliMonthLength(jy, jm);
  const firstG = window.jalaali.toGregorian(jy, jm, 1);
  const firstDate = new Date(firstG.gy, firstG.gm - 1, firstG.gd);
  const startOffset = (firstDate.getDay() + 1) % 7; // Persian week starts Saturday
  const todayJ = window.jalaali.toJalaali(new Date());
  const selJ = ed.date ? window.jalaali.toJalaali(new Date(ed.date + 'T00:00:00')) : null;
  const cells = [];
  for(let i = 0; i < startOffset; i++) cells.push(null);
  for(let d = 1; d <= monthLen; d++) cells.push(d);
  return `
    <div class="task-calendar">
      <div class="cal-header">
        <button type="button" class="cal-nav" onclick="reminderCalPrevMonth()">ماه قبل</button>
        <div class="cal-title">
          <span class="cal-jalali">${MONTHS_JALALI[jm-1]} ${toFaDigits(jy)}</span>
          <span class="cal-greg">${MONTHS_GREG_FA[firstG.gm-1]} ${firstG.gy}</span>
        </div>
        <button type="button" class="cal-nav" onclick="reminderCalNextMonth()">ماه بعد</button>
      </div>
      <div class="cal-weekdays">${['ش','ی','د','س','چ','پ','ج'].map(w => `<span>${w}</span>`).join('')}</div>
      <div class="cal-grid">
        ${cells.map(dnum => {
          if(dnum === null) return `<div class="cal-cell empty"></div>`;
          const isToday = (jy===todayJ.jy && jm===todayJ.jm && dnum===todayJ.jd);
          const isSel = selJ && jy===selJ.jy && jm===selJ.jm && dnum===selJ.jd;
          return `<div class="cal-cell ${isToday?'today':''} ${isSel?'selected':''}" onclick="reminderCalPick(${jy},${jm},${dnum})"><span class="cal-daynum">${toFaDigits(dnum)}</span></div>`;
        }).join('')}
      </div>
    </div>
  `;
}

async function confirmReminderEditor(){
  const ed = state.reminderEditor;
  if(!ed || !ed.title.trim()) return;
  if(ed.kind !== 'always' && !ed.date) return; // a dated reminder without a date would never fire
  const local = {
    title: ed.title.trim(), kind: ed.kind,
    date: ed.kind === 'always' ? '' : ed.date,
    leadDays: ed.kind === 'always' ? 0 : (ed.leadDays || 0),
    note: (ed.note || '').trim(),
  };
  const row = {
    title: local.title, kind: local.kind, date: local.date || null,
    lead_days: local.leadDays, note: local.note || null,
  };
  if(ed.reminderId){
    const r = state.reminders.find(x => x.id === ed.reminderId);
    if(r) Object.assign(r, local);
    state.reminderEditor = null; render();
    const { error } = await sb.from('reminders').update(row).eq('id', ed.reminderId);
    if(error) writeFailed('update reminder', error);
  } else {
    const id = uid();
    state.reminders.push(Object.assign({ id, done:false, createdAt:new Date().toISOString() }, local));
    state.reminderEditor = null; render();
    const { error } = await sb.from('reminders').insert(Object.assign({ id, done:false }, row));
    if(error) writeFailed('create reminder', error);
  }
}
/* Ticking a yearly reminder doesn't retire it — it books the next year. */
async function completeReminder(id){
  const r = state.reminders.find(x => x.id === id);
  if(!r) return;
  if(r.kind === 'yearly' && r.date){
    const next = advanceJalaliYear(r.date);
    r.date = next; render();
    const { error } = await sb.from('reminders').update({ date: next }).eq('id', id);
    if(error) writeFailed('roll yearly reminder', error);
    return;
  }
  r.done = true; render();
  const { error } = await sb.from('reminders').update({ done:true }).eq('id', id);
  if(error) writeFailed('complete reminder', error);
}
async function reopenReminder(id){
  const r = state.reminders.find(x => x.id === id);
  if(!r) return;
  r.done = false; render();
  const { error } = await sb.from('reminders').update({ done:false }).eq('id', id);
  if(error) writeFailed('reopen reminder', error);
}
const pendingReminderDeleteTimers = {};
async function deleteReminder(id){
  const idx = state.reminders.findIndex(r => r.id === id);
  if(idx === -1) return;
  const [removed] = state.reminders.splice(idx, 1);
  showUndoToast(`یادآوری «${removed.title}» حذف شد`, () => {
    clearTimeout(pendingReminderDeleteTimers[id]);
    delete pendingReminderDeleteTimers[id];
    state.reminders.splice(idx, 0, removed);
    render();
  });
  render();
  pendingReminderDeleteTimers[id] = setTimeout(async () => {
    delete pendingReminderDeleteTimers[id];
    const { error } = await sb.from('reminders').delete().eq('id', id);
    if(error) writeFailed('delete reminder', error);
  }, 5000);
}
/* A birthday you never ticked shouldn't sit there red forever — once it's a
   month past, it quietly books itself for next year. */
function rolloverYearlyReminders(){
  (state.reminders || []).forEach(r => {
    if(r.kind !== 'yearly' || r.done || !r.date) return;
    let d = r.date, guard = 0;
    while(daysUntil(d) < -REMINDER_YEARLY_GRACE_DAYS && guard++ < 200) d = advanceJalaliYear(d);
    if(d === r.date) return;
    r.date = d;
    sb.from('reminders').update({ date:d }).eq('id', r.id)
      .then(({ error }) => { if(error) writeFailed('rollover yearly reminder', error); });
  });
}

// One call per day, cached in localStorage so opening the app repeatedly
// doesn't hit the AI function over and over.
async function loadEncouragement(){
  const todayStr = dateKey(new Date());
  try{
    const cached = JSON.parse(localStorage.getItem('medar-encouragement') || 'null');
    if(cached && cached.date === todayStr && cached.text){
      state.encouragement = cached;
      render();
      return;
    }
  }catch(_e){ /* corrupt cache — just refetch */ }
  try{
    const { data, error } = await sb.functions.invoke('daily-encouragement');
    if(error || !data || !data.text) return;
    const fresh = { date: todayStr, text: data.text };
    state.encouragement = fresh;
    try{ localStorage.setItem('medar-encouragement', JSON.stringify(fresh)); }catch(_e){}
    render();
  }catch(_e){ /* offline or function down — the line is optional, skip silently */ }
}

/* ---------- rendering: progress ---------- */
function renderWeeklyGoals(){
  const goals = state.tagGoals.filter(g => g.weeklyMinutes > 0);
  if(goals.length === 0) return '';
  const rows = goals.map(g => {
    const tag = state.tags.find(t => t.id === g.tagId);
    if(!tag) return null;
    const actual = computeTagWeeklyMinutes(g.tagId);
    const pct = Math.min(100, Math.round(actual / g.weeklyMinutes * 100));
    const reached = actual >= g.weeklyMinutes;
    return { tag, actual, target: g.weeklyMinutes, pct, reached, reason: g.reason || '' };
  }).filter(Boolean);
  if(rows.length === 0) return '';
  return `
    <div class="progress-box">
      <div class="progress-header">
        <h2 class="section-title">اهداف هفتگی</h2>
      </div>
      ${rows.map(r => `
        <div class="goal-block">
          <div class="progress-row">
            <span class="progress-label">${escapeHtml(r.tag.name)}</span>
            <span class="progress-count ${r.reached ? 'reached' : ''}">${r.reached ? '✓ ' : ''}${formatDuration(r.actual)} از ${formatDuration(r.target)}</span>
          </div>
          <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${Math.max(3, r.pct)}%; background:${r.reached ? 'var(--freelance)' : r.tag.color}"></div></div>
          ${r.reason ? `<div class="goal-reason" style="--chip-color:${r.tag.color}">${escapeHtml(r.reason)}</div>` : ''}
        </div>
      `).join('')}

}

function sortForPrint(tasks){
  const order = { high:0, medium:1, low:2 };
  return [...tasks].sort((a,b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    const pa = a.priority ? order[a.priority] : 3;
    const pb = b.priority ? order[b.priority] : 3;
    return pa - pb;
  });
}
function renderPrintSheet(tasks, wd){
  const sorted = sortForPrint(tasks);
  return `
    <div class="print-sheet">
      <h1>کارهای امروز</h1>
      <div class="print-date">${wd} — ${fmtHeaderDate(state.today).jalali}</div>
      ${sorted.length === 0 ? `<p>کاری برای امروز ثبت نشده.</p>` : sorted.map(t => `
        <div class="print-task">
          <span class="print-checkbox ${t.done ? 'checked' : ''}"></span>
          <div>
            <div class="print-task-title ${t.done ? 'done' : ''}">${escapeHtml(t.title)}</div>
            <div class="print-task-meta">
              ${t.priority ? `اولویت: ${PRIORITY_LABEL[t.priority]}` : ''}
              ${t.durationMin ? ` · مدت: ${toFaDigits(t.durationMin)} دقیقه` : ''}
              ${t.tagIds.length ? ` · تگ: ${t.tagIds.map(tid => { const tag = state.tags.find(x=>x.id===tid); return tag ? tag.name : ''; }).filter(Boolean).join('، ')}` : ''}
            </div>
            ${t.subtasks.length ? `
              <div class="print-subtasks">
                ${t.subtasks.map(s => `<div class="print-subtask"><span class="print-checkbox small ${s.done?'checked':''}"></span> ${escapeHtml(s.title)}</div>`).join('')}
              </div>
            ` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
function renderToday(){
  const { wd } = fmtHeaderDate(state.today);
  const todayStr = dateKey(state.today);
  /* Today's own tasks, plus any overdue task from a past day — an overdue task
     stays visible until it's actually finished, and once finished TODAY it stays
     on today's list for the rest of the day (so you see the completion, and can
     untick it if it was a misclick) instead of vanishing the instant you tap it. */
  const todayTasksRaw = state.tasks.filter(t => {
    if(t.date === todayStr) return true;
    if(!t.date || t.date >= todayStr) return false;
    if(!t.done) return true; // still-open overdue task
    return t.completedAt && dateKey(new Date(t.completedAt)) === todayStr; // finished today
  });
  const scheduled = applyFiltersAndSort(todayTasksRaw, 'todayFilters', { dateFilter:false });

  return `
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">${wd}</div>
    ${renderReminderAlert()}
    <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
      ${renderStreakBadge()}
      ${renderTimeBadge(todayTasksRaw)}
    </div>
    ${renderWeeklyGoals()}
    ${renderEncouragement()}
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <h2 class="section-title" style="margin:0;">برنامه امروز</h2>
      <button type="button" class="print-btn" onclick="window.print()">چاپِ کارهای امروز</button>
    </div>
    ${renderFilterPanel('todayFilters', { dateFilter:false })}
    ${scheduled.length === 0 ? `<div class="empty-state">کاری با این فیلترها برای امروز نیست</div>` : scheduled.map(t => renderTodayItem(t, todayStr)).join('')}
    ${renderPrintSheet(todayTasksRaw, wd)}
  `;
}


/* ---------- streak (Duolingo-style: consecutive days with >=1 task completed on that task's own date) ----------
   Streak freezes are derived from history rather than stored, so every device
   agrees and nothing can drift: replay each day from the first completion. Every
   STREAK_FREEZE_EVERY active days earns one freeze (holding at most
   STREAK_FREEZE_MAX); a missed day while a streak is alive spends one
   automatically. A frozen day keeps the streak alive but doesn't add to it. */
const STREAK_FREEZE_EVERY = 7;
const STREAK_FREEZE_MAX = 2;
function computeStreak(){
  const doneDates = new Set();
  state.tasks.forEach(t => {
    if(!t.done) return;
    // same fix as the weekly goals: a completed task counts toward the day it was
    // actually FINISHED, not the day it was originally scheduled for — otherwise
    // finishing an overdue task today never credits today's streak
    const completedKey = t.completedAt ? dateKey(new Date(t.completedAt)) : t.date;
    if(completedKey) doneDates.add(completedKey);
  });

  const todayKey = dateKey(new Date());
  const atRisk = !doneDates.has(todayKey);

  let streak = 0, freezes = 0, towardFreeze = 0, frozeYesterday = false;
  const first = [...doneDates].sort()[0];
  if(first && first <= todayKey){
    const [y, m, d] = first.split('-').map(Number);
    const cursor = new Date(y, m - 1, d);
    for(let key = dateKey(cursor); key <= todayKey; cursor.setDate(cursor.getDate() + 1), key = dateKey(cursor)){
      if(doneDates.has(key)){
        streak++;
        if(++towardFreeze >= STREAK_FREEZE_EVERY){
          towardFreeze = 0;
          if(freezes < STREAK_FREEZE_MAX) freezes++;
        }
        frozeYesterday = false;
      } else if(key === todayKey){
        // today isn't over yet: not a miss, just at risk
      } else if(streak > 0 && freezes > 0){
        freezes--;
        frozeYesterday = true;
      } else {
        streak = 0; towardFreeze = 0; frozeYesterday = false;
      }
    }
  }
  return { streak, atRisk, freezes, frozeYesterday };
}
function renderStreakBadge(){
  const { streak, atRisk, freezes, frozeYesterday } = computeStreak();
  const title = frozeYesterday ? 'دیروز یه فریز خرج شد و استریکت حفظ شد'
    : atRisk ? 'امروز هنوز تسکی تکمیل نکردی — استریکت در خطره'
    : 'امروز حفظ شد';
  return `
    <div class="streak-badge ${atRisk ? 'at-risk' : ''}" title="${title}">
      <span class="streak-flame">${icon('flame',18)}</span>
      <span class="streak-count mono">${toFaDigits(streak)}</span>
      <span class="streak-label">روز پیاپی</span>
      <span class="streak-freeze ${freezes ? '' : 'empty'}" title="فریز: هر ${toFaDigits(STREAK_FREEZE_EVERY)} روز پیاپی یکی جایزه می‌گیری (حداکثر ${toFaDigits(STREAK_FREEZE_MAX)} تا) و روزی که جا بندازی خودکار خرج می‌شه">
        ${icon('snowflake',14)}<span class="mono">${toFaDigits(freezes)}</span>
      </span>
    </div>
  `;
}

/* ---------- archive (completed tasks older than the threshold, hidden from the main list) ---------- */
const ARCHIVE_THRESHOLD_DAYS = 7;
function isArchived(t){
  if(!t.done || !t.completedAt) return false;
  const days = (Date.now() - new Date(t.completedAt).getTime()) / (1000*60*60*24);
  return days > ARCHIVE_THRESHOLD_DAYS;
}
function setArchiveSearch(v){ state.archiveFilters.search = v; render(); }
function toggleArchiveTag(tagId){
  const f = state.archiveFilters;
  f.tagIds = f.tagIds.includes(tagId) ? f.tagIds.filter(id => id !== tagId) : [...f.tagIds, tagId];
  render();
}
function setArchiveDateFrom(v){ state.archiveFilters.dateFrom = v || null; render(); }
function setArchiveDateTo(v){ state.archiveFilters.dateTo = v || null; render(); }
function resetArchiveFilters(){ state.archiveFilters = { search:'', tagIds:[], dateFrom:null, dateTo:null }; render(); }

/* ---------- nav / render ---------- */
function setView(v){ state.view = v; render(); }

/* Every render() replaces the whole #app, which destroys a focused textarea —
   on a phone that closes the keyboard mid-sentence. Background renders (realtime
   echoes, the reconnect reload, toast timers) arrive with no user event behind
   them, so while a [data-preserve] field has focus they're held back and flushed
   once it blurs. Renders caused by the user's own taps/typing still run at once. */
const USER_EVENT_TYPES = new Set(['click','change','input','keydown','keyup','submit','pointerdown','pointerup','mousedown','mouseup','touchstart','touchend']);
let renderDeferred = false;
function preservedFieldFocused(){
  const ae = document.activeElement;
  return !!(ae && ae.matches && ae.matches('[data-preserve]'));
}
document.addEventListener('focusout', e => {
  if(!renderDeferred || !(e.target.matches && e.target.matches('[data-preserve]'))) return;
  // wait out the tap that caused the blur, so its click still lands on the old DOM
  setTimeout(() => { if(renderDeferred && !preservedFieldFocused()) render(); }, 300);
});

function render(){
  const ev = window.event;
  if(preservedFieldFocused() && !(ev && USER_EVENT_TYPES.has(ev.type))){ renderDeferred = true; return; }
  renderDeferred = false;
  const { jalali, gregorian } = fmtHeaderDate(state.today);
  const app = document.getElementById('app');
  const prevStrip = document.querySelector('.subnav-scroll');
  const stripScroll = prevStrip ? prevStrip.scrollLeft : 0;
  app.innerHTML = `
    <header>
      <div class="brand">
        <h1>مدار</h1>
        <div class="sub">سیستم برنامه‌ریزی شخصی</div>
      </div>
      <div class="date-block">
        <div class="jalali">${jalali}</div>
        <div class="gregorian">${gregorian}</div>
      </div>
    </header>

    ${renderNav()}
    ${renderSubnav()}

    ${loadError ? `<div class="empty-state" style="background:var(--surface);border:1px solid var(--danger);border-radius:10px;color:var(--danger);margin-bottom:16px;">اتصال به دیتابیس برقرار نشد — اینترنتت رو چک کن و صفحه رو رفرش کن.</div>` : ''}

    <main>
      ${state.view === 'today' ? renderToday() : ''}
      ${state.view === 'tasks' ? renderTasksView() : ''}
      ${state.view === 'calendar' ? renderCalendarPage() : ''}
      ${state.view === 'ideas' ? renderIdeasPage() : ''}
      ${state.view === 'purchases' ? renderPurchasesPage() : ''}
      ${state.view === 'subscriptions' ? renderSubscriptionsPage() : ''}
      ${state.view === 'reminders' ? renderRemindersPage() : ''}
      ${state.view === 'prompts' ? renderPromptsPage() : ''}
      ${state.view === 'archive' ? renderArchivePage() : ''}
      ${state.view === 'ai-reports' ? renderAIReportsPage() : ''}
    </main>
    ${renderTaskEditorModal()}
    ${state.taskCompletionModal ? renderTaskCompletionModal() : ''}
    ${state.undoToast ? renderUndoToast() : ''}
    ${state.saveError ? renderSaveErrorToast() : ''}
    ${state.recurringEditor ? renderRecurringEditorModal() : ''}
    ${state.subscriptionEditor ? renderSubscriptionEditorModal() : ''}
    ${state.reminderEditor ? renderReminderEditorModal() : ''}
    ${state.promptEditor ? renderPromptEditorModal() : ''}
  `;
  // every render rebuilds the tabs; if a group ever has more than fit, keep
  // the strip where it was and bring a newly opened tab into view
  const strip = document.querySelector('.subnav-scroll');
  if(strip){
    strip.classList.toggle('overflowing', strip.scrollWidth > strip.clientWidth + 1);
    strip.scrollLeft = stripScroll;
    if(revealActiveTab){
      revealActiveTab = false;
      const a = strip.querySelector('button.active');
      if(a) a.scrollIntoView({block:'nearest', inline:'nearest'});
    }
  }
}

/* ---------- navigation ----------
   Sections are grouped by what they're for. Phones and tablets show the groups
   in the bar and the current group's sections as tabs under the header, so a new
   section only adds a tab to its group and the bar never gets more crowded.
   Laptops list every section in the sidebar. To add a section, add it to the
   group it belongs in; add a new group only if nothing fits (phones hold 5). */
const NAV_GROUPS = [
  { id:'plan',   label:'برنامه‌ریزی', icon:'calendar', items:[
    { id:'today',     label:'امروز',      icon:'sun' },
    { id:'tasks',     label:'تسک‌ها',      icon:'check' },
    { id:'calendar',  label:'تقویم',       icon:'calendar' },
    { id:'reminders', label:'یادآوری‌ها',  icon:'bell' },
  ]},
  { id:'notes',  label:'یادداشت‌ها', icon:'bulb', items:[
    { id:'ideas',     label:'ایده‌ها',      icon:'bulb' },
    { id:'prompts',   label:'پرامپت‌ها',   icon:'prompt' },
  ]},
  { id:'money',  label:'هزینه‌ها', icon:'card', items:[
    { id:'purchases',     label:'خریدها',    icon:'cart' },
    { id:'subscriptions', label:'اشتراک‌ها', icon:'card' },
  ]},
  { id:'review', label:'مرور', icon:'archive', items:[
    { id:'archive',    label:'آرشیو',         icon:'archive' },
    { id:'ai-reports', label:'گزارش هوشمند', icon:'sparkle' },
  ]},
];
const groupOfView = v => NAV_GROUPS.find(g => g.items.some(i => i.id === v)) || NAV_GROUPS[0];
// the section last opened in each group, so tapping a group returns you there
const lastViewInGroup = {};
function navigateTo(view){
  if(state.view !== view) window.scrollTo(0, 0);
  lastViewInGroup[groupOfView(view).id] = view;
  revealActiveTab = true;
  setView(view);
}
function openGroup(groupId){
  const g = NAV_GROUPS.find(g => g.id === groupId);
  navigateTo(lastViewInGroup[g.id] || g.items[0].id);
}
let revealActiveTab = false;
function renderNav(){
  const current = groupOfView(state.view);
  return `
    <nav class="main-nav" aria-label="بخش‌ها">
      <div class="nav-groups">
        ${NAV_GROUPS.map(g => `
          <button class="nav-group-btn ${g === current ? 'active' : ''}" onclick="openGroup('${g.id}')"
            ${g === current ? 'aria-current="true"' : ''}>
            <span class="nav-icon">${icon(g.icon, 22)}</span>
            <span>${g.label}</span>
          </button>
        `).join('')}
      </div>
      <div class="nav-scroll">
        ${NAV_GROUPS.map(g => `
          <div class="nav-group" role="group" aria-label="${g.label}">
            <div class="nav-group-title" aria-hidden="true">${g.label}</div>
            ${g.items.map(n => `
              <button class="nav-item ${state.view===n.id ? 'active' : ''}" onclick="navigateTo('${n.id}')"
                ${state.view===n.id ? 'aria-current="page"' : ''}>
                <span class="nav-icon">${icon(n.icon, 18)}</span>
                <span>${n.label}</span>
              </button>
            `).join('')}
          </div>
        `).join('')}
      </div>
      <button class="nav-add" onclick="openTaskEditorNew()" aria-label="افزودن تسک">
        <span class="nav-icon">${icon('plus', 18)}</span>
        <span>افزودن</span>
      </button>
    </nav>
  `;
}
function renderSubnav(){
  const g = groupOfView(state.view);
  if(g.items.length < 2) return '';
  return `
    <div class="subnav">
      <div class="subnav-scroll" role="tablist" aria-label="${g.label}">
        ${g.items.map(n => `
          <button role="tab" class="${state.view===n.id ? 'active' : ''}" aria-selected="${state.view===n.id}"
            onclick="navigateTo('${n.id}')">${n.label}</button>
        `).join('')}
      </div>
    </div>
  `;
}
function renderTaskCompletionModal(){
  const m = state.taskCompletionModal;
  const t = state.tasks.find(t => t.id === m.taskId);
  if(!t){ state.taskCompletionModal = null; return ''; }
  const quickVals = [15,30,45,60];
  const customVal = (m.minutes && !quickVals.includes(m.minutes)) ? m.minutes : '';
  return `
    <div class="modal-overlay" onclick="if(event.target===this) skipTaskCompletion()">
      <div class="modal-box">
        <h3>✓ ${escapeHtml(t.title)}</h3>
        <div class="modal-section">
          <span class="modal-section-label">چقدر واقعاً طول کشید؟ (اختیاری)</span>
          <div class="quick-group">
            ${quickVals.map(v => `<span class="quick-chip ${m.minutes===v?'active':''}" onclick="completionSetMinutes(${v})">${toFaDigits(v)}</span>`).join('')}
            <input type="text" inputmode="numeric" class="num-text" placeholder="سفارشی" value="${customVal}"
              oninput="normalizeNumericInput(this); completionSetCustomMinutes(this.value)" />
          </div>
        </div>
        <div class="modal-section">
          <span class="modal-section-label">سختیش چقدر بود؟ (اختیاری)</span>
          <div class="quick-group">
            <span class="quick-chip ${m.difficulty==='easy'?'active':''}" onclick="completionSetDifficulty('easy')">${icon('check',13)} راحت</span>
            <span class="quick-chip ${m.difficulty==='medium'?'active':''}" onclick="completionSetDifficulty('medium')">${icon('clock',13)} معمولی</span>
            <span class="quick-chip ${m.difficulty==='hard'?'active':''}" onclick="completionSetDifficulty('hard')">${icon('flame',13)} سخت</span>
          </div>
        </div>
        <div class="modal-actions">
          <button class="confirm" onclick="confirmTaskCompletion()">ثبت</button>
          <button class="cancel" onclick="skipTaskCompletion()">رد کردن</button>
        </div>
      </div>
    </div>
  `;
}
function renderUndoToast(){
  return `
    <div class="undo-toast">
      <span>${escapeHtml(state.undoToast.message)}</span>
      <button onclick="triggerUndo()">واگرد</button>
      <button class="undo-close" onclick="dismissUndoToast()" title="بستن">✕</button>
    </div>
  `;
}
function renderSaveErrorToast(){
  return `
    <div class="undo-toast failed">
      <span>${escapeHtml(state.saveError.message)}</span>
      <button class="undo-close" onclick="dismissSaveError()" title="بستن">✕</button>
    </div>
  `;
}

loadAll();
loadEncouragement();

/* ---------- PWA: register the app-shell service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.error('SW register failed', e));
  });
}
</script>
