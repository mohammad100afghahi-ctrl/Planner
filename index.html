/* ---------- streak (Duolingo-style: consecutive days with >=1 task completed on that task's own date) ----------
   Streak freezes are derived from history rather than stored, so every device
   agrees and nothing can drift: replay each day from the first completion. Every
   STREAK_FREEZE_EVERY active days earns one freeze (holding at most
   STREAK_FREEZE_MAX); a missed day while a streak is alive spends one
   automatically. A frozen day keeps the streak alive but doesn't add to it. */
const STREAK_FREEZE_EVERY = 7;
const STREAK_FREEZE_MAX = 2;
const STREAK_MILESTONES = [3, 7, 14, 21, 30, 50, 75, 100, 150, 200, 300, 365, 500, 730, 1000];
const STREAK_MAP_WEEKS = 16;
function computeStreak(){
  const doneCounts = new Map(); // day -> how many tasks were finished on it
  state.tasks.forEach(t => {
    if(!t.done) return;
    // same fix as the weekly goals: a completed task counts toward the day it was
    // actually FINISHED, not the day it was originally scheduled for — otherwise
    // finishing an overdue task today never credits today's streak
    const completedKey = t.completedAt ? dateKey(new Date(t.completedAt)) : t.date;
    if(completedKey) doneCounts.set(completedKey, (doneCounts.get(completedKey) || 0) + 1);
  });

  const todayKey = dateKey(new Date());
  const atRisk = !doneCounts.has(todayKey);

  let streak = 0, freezes = 0, towardFreeze = 0, frozeYesterday = false;
  let best = 0, bestEnd = null, since = null;
  const log = new Map(); // day -> 'frozen' | 'miss', for the days nothing was finished
  const first = [...doneCounts.keys()].sort()[0];
  if(first && first <= todayKey){
    const [y, m, d] = first.split('-').map(Number);
    const cursor = new Date(y, m - 1, d);
    for(let key = dateKey(cursor); key <= todayKey; cursor.setDate(cursor.getDate() + 1), key = dateKey(cursor)){
      if(doneCounts.has(key)){
        if(++streak === 1) since = key;
        if(streak > best){ best = streak; bestEnd = key; }
        if(++towardFreeze >= STREAK_FREEZE_EVERY){
          towardFreeze = 0;
          if(freezes < STREAK_FREEZE_MAX) freezes++;
        }
        frozeYesterday = false;
      } else if(key === todayKey){
        // today isn't over yet: not a miss, just at risk
      } else if(streak > 0 && freezes > 0){
        freezes--;
        frozeYesterday = true;
        log.set(key, 'frozen');
      } else {
        streak = 0; towardFreeze = 0; frozeYesterday = false; since = null;
        log.set(key, 'miss');
      }
    }
  }
  return { streak, atRisk, freezes, frozeYesterday, best, bestEnd, since, towardFreeze, first, doneCounts, log };
}

/* The phone's back button. Without this, «back» in any tab left the app,
   because switching tabs never touched the browser history. One extra history
   entry (the guard) sits on top of the page: «back» pops it, popstate undoes
   the topmost thing on screen — an open sheet/editor first, then the previous
   tab — and puts the guard back. With nothing left to undo the guard stays
   gone, so the next «back» leaves the app as before. Layers are found in the
   DOM (each one is a .modal-overlay with a close button or a closing
   backdrop) rather than tracked one by one, so every dialog closed some other
   way can't leave the history out of step. */
const viewHistory = [];
let viewGoingBack = false;
// called after every render: a guard exists exactly while «back» has something to undo
function syncBackGuard(){
  const undoable = viewHistory.length || state.moreMenuOpen || state.taskEditor || document.querySelector('#app .modal-overlay');
  if(undoable && !(history.state && history.state.medarGuard)) history.pushState({ medarGuard:true }, '');
}
function closeTopLayer(){
  const layers = [...document.querySelectorAll('#app .modal-overlay')];
  const top = layers[layers.length - 1];
  if(!top) return false;
  const btn = top.querySelector('[aria-label="بازگشت"], [aria-label="بستن"]');
  if(btn) btn.click();
  else top.click(); // backdrop closers check event.target === this
  return true;
}
window.addEventListener('popstate', () => {
  if(!appStarted) return;
  if(state.moreMenuOpen) return toggleMoreMenu();
  if(state.taskEditor && !document.querySelector('#app .modal-overlay')) return closeTaskEditor();
  if(closeTopLayer()) return syncBackGuard();
  const prev = viewHistory.pop();
  if(prev){
    viewGoingBack = true;
    try{ navigateTo(prev); }finally{ viewGoingBack = false; }
    return;
  }
  // nothing left to undo: step past the page's own entry so «back» leaves
  history.back();
});

/* Every render() replaces the whole #app, which destroys a focused textarea —
   on a phone that closes the keyboard mid-sentence. Background renders (realtime
   echoes, the reconnect reload, toast timers) arrive with no user event behind
   them, so while a [data-preserve] field has focus they're held back and flushed
   once it blurs. Renders caused by the user's own taps/typing still run at once. */
const USER_EVENT_TYPES = new Set(['click','change','input','keydown','keyup','submit','pointerdown','pointerup','mousedown','mouseup','touchstart','touchend']);
let renderDeferred = false;
function preservedFieldFocused(){
  const ae = document.activeElement;
  return !!(ae && ae.matches && ae.matches('[data-preserve]'));
}
document.addEventListener('focusout', e => {
  if(!renderDeferred || !(e.target.matches && e.target.matches('[data-preserve]'))) return;
  // wait out the tap that caused the blur, so its click still lands on the old DOM
  setTimeout(() => { if(renderDeferred && !preservedFieldFocused()) render(); }, 300);
});

/* ---------- push notifications ----------
   The browser hands us a subscription (endpoint + keys) once the user says yes;
   we store it in push_subscriptions and the send-push edge function uses it
   every morning at 08:00 to send the day's reminders, renewals and task count.
   iPhone only allows this for the app added to the home screen (iOS 16.4+). */
function pushSupported(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
}
function b64urlToBytes(s){
  const b64 = (s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/');
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}
async function callSendPush(action){
  const { data:{ session } } = await sb.auth.getSession();
  const res = await fetch(`${SUPABASE_URL}/functions/v1/send-push`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${session?.access_token}` },
    body: JSON.stringify({ action }),
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error(data.error || 'send-push ' + res.status);
  return data;
}
async function savePushSubscription(sub){
  const j = sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({
    endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth,
    user_agent: navigator.userAgent.slice(0, 200),
  }, { onConflict:'endpoint' });
  if(error) throw error;
}
/* On every boot: work out the state, and re-save an existing subscription so a
   row the server pruned (or a browser that rotated its endpoint) heals itself. */
async function refreshPushStatus(){
  if(!pushSupported()){
    state.pushStatus = isIOS() && !isStandalone() ? 'ios-install' : 'unsupported';
    render();
    return;
  }
  if(Notification.permission === 'denied'){ state.pushStatus = 'denied'; render(); return; }
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    state.pushStatus = sub && Notification.permission === 'granted' ? 'on' : 'off';
    render();
    if(state.pushStatus === 'on') await savePushSubscription(sub);
  }catch(e){
    console.error('push status check failed', e);
    if(state.pushStatus === 'checking'){ state.pushStatus = 'off'; render(); }
  }
}
function togglePushMenu(){
  state.pushMenuOpen = !state.pushMenuOpen;
  if(state.pushMenuOpen) state.backupMenuOpen = false;
  render();
}
async function enablePush(){
  state.pushStatus = 'busy';
  render();
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){
      state.pushStatus = permission === 'denied' ? 'denied' : 'off';
      render();
      return;
    }
    const { publicKey } = await callSendPush('publicKey');
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    // a subscription made with another key can't be reused — replace it
    if(sub && sub.options && sub.options.applicationServerKey){
      const cur = new Uint8Array(sub.options.applicationServerKey);
      const want = b64urlToBytes(publicKey);
      if(cur.length !== want.length || cur.some((b, i) => b !== want[i])){ await sub.unsubscribe(); sub = null; }
    }
    if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64urlToBytes(publicKey) });
    await savePushSubscription(sub);
    state.pushStatus = 'on';
    showInfoToast('اعلان‌ها روشن شد — هر روز ساعت ۸ صبح خبرت می‌کنم.');
  }catch(e){
    console.error('enable push failed', e);
    state.pushStatus = 'off';
    showSaveError('روشن کردن اعلان‌ها انجام نشد — اینترنتت رو چک کن و دوباره امتحان کن.');
  }
}
async function disablePush(){
  state.pushStatus = 'busy';
  render();
  try{
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if(sub){
      const { error } = await sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
      if(error) throw error;
      await sub.unsubscribe();
    }
    state.pushStatus = 'off';
    showInfoToast('اعلان‌ها روی این دستگاه خاموش شد.');
  }catch(e){
    console.error('disable push failed', e);
    state.pushStatus = 'on';
    showSaveError('خاموش کردن اعلان‌ها انجام نشد — دوباره امتحان کن.');
  }
}
async function sendTestPush(){
  state.pushStatus = 'busy';
  render();
  try{
    const r = await callSendPush('test');
    state.pushStatus = 'on';
    if(r.sent) showInfoToast('اعلان آزمایشی فرستاده شد — تا چند ثانیه دیگه می‌رسه.');
    else showSaveError('اعلان به این دستگاه نرسید — یک بار خاموش و دوباره روشنش کن.');
  }catch(e){
    console.error('test push failed', e);
    state.pushStatus = 'on';
    showSaveError('ارسال اعلان آزمایشی انجام نشد — اینترنتت رو چک کن.');
  }
}

/* ---------- پشتیبان‌گیری ----------
   Everything the account owns is dumped by backup_now() (SQL, see backups.sql)
   into one JSON file. The server also keeps copies: 4 weekly automatic ones,
   the last 3 downloads and the last 3 "before restore" snapshots. Those sit in
   the same Supabase project, so they cover mistakes — the downloaded file is
   the only thing that survives losing the project, hence the red dot after 30
   days without a download. A restore runs as a single transaction on the server
   and snapshots the current data first, which is what its واگرد restores. */
const BACKUP_TABLE_LABELS = {
  tasks:'کارها', subtasks:'زیرکارها', tags:'تگ‌ها', recurring_templates:'کارهای تکراری',
  ideas:'ایده‌ها', idea_images:'عکس‌های ایده', wins:'دستاوردها', prompts:'پرامپت‌ها',
  reminders:'یادآورها', subscriptions:'اشتراک‌ها', purchases:'خریدها', ai_reports:'گزارش‌های هوش مصنوعی',
  tag_goals:'اهداف هفتگی', mother_care:'تنظیمات مادر', mother_care_items:'ملاحظه‌های مادر',
  home_repairs:'تعمیرات خونه', home_repair_parts:'قطعه‌های تعمیر', home_maintenance:'نگهداری دوره‌ای خونه',
  english_settings:'تنظیمات انگلیسی', english_homework:'تکلیف‌های انگلیسی', english_chunks:'تکه‌های تکلیف انگلیسی', english_practice:'روزهای تمرین انگلیسی',
};
const BACKUP_KIND_LABELS = { auto:'خودکار هفتگی', download:'دانلود دستی', 'pre-restore':'قبل از بازیابی' };
const BACKUP_OVERDUE_DAYS = 30;

function backupDaysAgo(iso){
  return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
}
function backupWhen(iso){
  const n = backupDaysAgo(iso);
  const rel = n <= 0 ? 'امروز' : n === 1 ? 'دیروز' : `${toFaDigits(n)} روز پیش`;
  const d = new Date(iso);
  return `${fmtWinDate(dateKey(d))} — ${rel}`;
}
function lastBackupDownload(){
  return (state.backups || []).find(b => b.kind === 'download') || null;
}
function backupOverdue(){
  if(!state.backups) return false; // not loaded yet — don't flash a warning
  const last = lastBackupDownload();
  return !last || backupDaysAgo(last.createdAt) >= BACKUP_OVERDUE_DAYS;
}
async function loadBackups(){
  const { data, error } = await sb.from('backups').select('id, kind, created_at, counts').order('created_at', { ascending:false });
  if(error){ console.error('load backups failed', error); return; }
  state.backups = data.map(b => ({ id:b.id, kind:b.kind, createdAt:b.created_at, counts:b.counts || {} }));
  render();
}
function toggleBackupMenu(){
  state.backupMenuOpen = !state.backupMenuOpen;
  if(state.backupMenuOpen){ state.pushMenuOpen = false; loadBackups(); }
  render();
}
function backupOnlineOrWarn(){
  if(!isOfflineNow()) return true;
  showSaveError('برای پشتیبان‌گیری و بازیابی باید آنلاین باشی.');
  return false;
}
function saveJsonFile(payload, filename){
  const blob = new Blob([JSON.stringify(payload)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function backupFilename(iso){
  return `madar-backup-${dateKey(new Date(iso))}.json`;
}
async function downloadBackup(){
  if(state.backupBusy || !backupOnlineOrWarn()) return;
  state.backupBusy = true; render();
  try{
    const { data, error } = await sb.rpc('backup_now');
    if(error) throw error;
    saveJsonFile(data, backupFilename(data.created_at));
    showInfoToast('فایل پشتیبان دانلود شد — یه جای امن غیر از همین گوشی هم نگهش دار (مثلاً Google Drive).');
    await loadBackups();
  }catch(e){
    console.error('backup failed', e);
    showSaveError('ساختن فایل پشتیبان انجام نشد — اینترنتت رو چک کن و دوباره امتحان کن.');
  }finally{
    state.backupBusy = false; render();
  }
}
async function downloadStoredBackup(id){
  if(state.backupBusy || !backupOnlineOrWarn()) return;
  state.backupBusy = true; render();
  try{
    const { data, error } = await sb.from('backups').select('data, created_at').eq('id', id).single();
    if(error) throw error;
    saveJsonFile(data.data, backupFilename(data.created_at));
  }catch(e){
    console.error('stored backup download failed', e);
    showSaveError('دانلود این نسخه انجام نشد — دوباره امتحان کن.');
  }finally{
    state.backupBusy = false; render();
  }
}
function pickRestoreFile(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => { if(input.files[0]) readRestoreFile(input.files[0]); };
  input.click();
}
async function readRestoreFile(file){
  let payload;
  try{ payload = JSON.parse(await file.text()); }catch(_e){ payload = null; }
  if(!payload || payload.app !== 'madar' || !payload.tables || typeof payload.tables !== 'object'){
    showSaveError('این فایل، پشتیبان مدار نیست.');
    return;
  }
  if(payload.version > 1){
    showSaveError('این پشتیبان با نسخهٔ جدیدتری از مدار ساخته شده — اول صفحه رو رفرش کن.');
    return;
  }
  const counts = {};
  for(const [t, rows] of Object.entries(payload.tables)) if(Array.isArray(rows)) counts[t] = rows.length;
  state.restorePreview = { payload, backupId:null, label:`فایل ${file.name}`, createdAt:payload.created_at, counts, mode:'merge' };
  state.backupMenuOpen = false;
  render();
}
function openStoredRestore(id){
  const b = (state.backups || []).find(x => x.id === id);
  if(!b) return;
  state.restorePreview = { payload:null, backupId:id, label:`نسخهٔ ${BACKUP_KIND_LABELS[b.kind]}`, createdAt:b.createdAt, counts:b.counts, mode:'merge' };
  state.backupMenuOpen = false;
  render();
}
function setRestoreMode(mode){
  if(state.restorePreview){ state.restorePreview.mode = mode; render(); }
}
function cancelRestore(){ state.restorePreview = null; render(); }
function currentBackupCounts(){
  const n = arr => (arr || []).length;
  let subtasks = 0, images = 0;
  (state.tasks || []).forEach(t => subtasks += n(t.subtasks));
  (state.ideas || []).forEach(i => images += n(i.images));
  return {
    tasks: n(state.tasks), subtasks, tags: n(state.tags), recurring_templates: n(state.recurringTemplates),
    ideas: n(state.ideas), idea_images: images, wins: n(state.wins), prompts: n(state.prompts),
    reminders: n(state.reminders), subscriptions: n(state.subscriptions), purchases: n(state.purchases),
    ai_reports: n(state.aiReports), tag_goals: n(state.tagGoals),
    mother_care: state.motherSettings ? 1 : 0, mother_care_items: n(state.motherItems),
    home_repairs: n(state.homeRepairs), home_repair_parts: n(state.homeParts), home_maintenance: n(state.homeMaint),
    english_settings: state.englishSettings ? 1 : 0, english_homework: n(state.englishHomework), english_chunks: n(state.englishChunks), english_practice: n(state.englishPractice),
  };
}
async function confirmRestore(){
  const rp = state.restorePreview;
  if(!rp || state.backupBusy || !backupOnlineOrWarn()) return;
  if(outbox.length){
    showSaveError('چند تغییر هنوز روی سرور ذخیره نشده — صبر کن آنلاین بشی و ذخیره بشن، بعد بازیابی کن.');
    return;
  }
  state.backupBusy = true; render();
  try{
    const { data: preId, error } = rp.backupId
      ? await sb.rpc('restore_backup_id', { p_id: rp.backupId, p_mode: rp.mode })
      : await sb.rpc('restore_backup', { p_data: rp.payload, p_mode: rp.mode });
    if(error) throw error;
    state.restorePreview = null;
    await loadAll();
    loadBackups();
    showUndoToast('بازیابی انجام شد.', () => undoRestore(preId));
  }catch(e){
    console.error('restore failed', e);
    showSaveError('بازیابی انجام نشد و چیزی تغییر نکرد — اینترنتت رو چک کن و دوباره امتحان کن.');
  }finally{
    state.backupBusy = false; render();
  }
}
/* The server saved everything as it was just before the restore; putting that
   back in 'replace' mode lands exactly where we started. After the toast is
   gone, the same copy is still in the menu as «قبل از بازیابی». */
async function undoRestore(preId){
  const { error } = await sb.rpc('restore_backup_id', { p_id: preId, p_mode: 'replace' });
  if(error){
    console.error('undo restore failed', error);
    showSaveError('واگرد بازیابی انجام نشد — از منوی پشتیبان، نسخهٔ «قبل از بازیابی» رو برگردون.');
    return;
  }
  await loadAll();
  loadBackups();
  showInfoToast('اطلاعات به حالت قبل از بازیابی برگشت.');
}

/* ---------- auth gate ----------
   Every table is locked to its owner by RLS (user_id = auth.uid()), so nothing
   loads until there's a session. The account is created in the Supabase
   dashboard (sign-ups are off), which is why there's no register form here. */
let appStarted = false;
/* Separate from appStarted: paintLocalCopyEarly() sets that one as soon as the
   on-device copy is on screen, which is usually before the login token has
   been refreshed — bootApp() must still run once after it. */
let appBooted = false;
function bootApp(){
  if(appBooted) return;
  appBooted = true;
  startApp();
  loadAll();
  loadEncouragement();
  refreshPushStatus();
  loadBackups();
}
function startApp(){
  appStarted = true;
  document.body.classList.remove('signed-out');
}
/* Opening the app used to mean staring at «در حال بارگذاری» until the login
   token was refreshed and every table had answered. Instead the on-device copy
   is painted straight away, and bootApp() → loadAll() swaps in the server's
   data once it arrives. Only when a login is stored on this device — signOut()
   wipes the copy, and without a stored login the next thing shown is the
   login form anyway. */
let loginShown = false;
(async function paintLocalCopyEarly(){
  let hasLogin = false;
  try{ hasLogin = !!localStorage.getItem(sb.auth.storageKey || 'sb-byqowlvyupcusjjyxwaf-auth-token'); }catch(_e){}
  if(!hasLogin) return;
  await outboxReady; // so the offline bar's queue count is right on the first paint
  if(dataLoaded || loginShown || !(await restoreSnapshot())) return;
  if(dataLoaded || loginShown) return;
  dataLoaded = true;
  usingLocalCopy = true;
  startApp();
  render();
})();
async function submitLogin(e){
  e.preventDefault();
  const btn = document.getElementById('loginSubmit');
  const errEl = document.getElementById('loginError');
  btn.disabled = true;
  errEl.textContent = '';
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value.trim(),
    password: document.getElementById('loginPassword').value,
  });
  if(error){
    btn.disabled = false;
    errEl.textContent = /invalid/i.test(error.message)
      ? 'ایمیل یا رمز عبور درست نیست.'
      : 'ورود انجام نشد — اینترنتت رو چک کن و دوباره امتحان کن.';
  }
  // on success onAuthStateChange boots the app
}
async function signOut(){
  const unsynced = outbox.length
    ? `\n\n${toFaDigits(outbox.length)} تغییر هنوز روی سرور ذخیره نشده و با خروج از بین می‌ره.`
    : '';
  if(!confirm('از حسابت خارج بشی؟' + unsynced)) return;
  try{ localStorage.removeItem('medar-encouragement-v5'); }catch(_e){}
  // the outbox and the snapshot belong to this account — don't leave them for the next one
  dataLoaded = false;
  clearTimeout(snapshotTimer); snapshotTimer = null;
  outbox = [];
  try{ await offlineDB.clear('outbox'); await offlineDB.del('kv', 'snapshot'); }catch(_e){}
  await sb.auth.signOut();
}
sb.auth.onAuthStateChange((event, session) => {
  // supabase-js warns against awaiting its own calls inside this callback,
  // so hand off to the next tick before loadAll() starts querying
  if(event === 'SIGNED_OUT') location.reload();
  else if(session){ state.userEmail = (session.user && session.user.email) || ''; setTimeout(bootApp, 0); }
  else if(event === 'INITIAL_SESSION') renderLogin();
});

/* ---------- PWA: register the app-shell service worker ----------
   The worker serves the cached copy first so the app opens instantly, and
   fetches the new release in the background. Once that release takes over
   (controllerchange) the page reloads into it — right away if nothing is being
   typed or edited, otherwise the next time the app goes to the background — so
   an update shows within seconds instead of on the next launch. */
if('serviceWorker' in navigator){
  const hadController = !!navigator.serviceWorker.controller;
  let updatePending = false;
  const editing = () => !!(preservedFieldFocused() || document.querySelector('.modal-overlay')
    || (document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)));
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(!hadController || updatePending) return; // first install: nothing old on screen
    updatePending = true;
    if(!editing()) location.reload();
  });
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden' && updatePending) location.reload();
    // a PWA can sit open for days; look for a new release whenever it comes back
    if(document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(e => console.error('SW register failed', e));
  });
}
