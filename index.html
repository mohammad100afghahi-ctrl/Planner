/**
* Jalaali years that begin a new 33-year leap cycle. Used by the
* Borkowski algorithm to locate the correct cycle for any given year.
*/
const BREAKS = [
	-61,
	9,
	38,
	199,
	426,
	686,
	756,
	818,
	1111,
	1181,
	1210,
	1635,
	2060,
	2097,
	2192,
	2262,
	2324,
	2394,
	2456,
	3178

/** Minimum supported Jalaali year (inclusive). */

function toJalaali(gyOrDate, gm, gd) {
	if (gyOrDate instanceof Date) return d2j(g2d(gyOrDate.getFullYear(), gyOrDate.getMonth() + 1, gyOrDate.getDate()));

/**
* Converts a Jalaali date to Gregorian.
*
* @example
* toGregorian(1395, 1, 23) // { gy: 2016, gm: 4, gd: 11 }
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/

	return d2g(j2d(jy, jm, jd));

* Returns `true` if `(jy, jm, jd)` is a real date in the Jalaali calendar.
*
* The check is **lenient** — non-integer inputs that happen to fall inside
* the allowed numeric ranges are accepted. Pass integers in production code.
*
* @example
* isValidJalaaliDate(1394, 12, 30) // false (1394 is a common year)
* isValidJalaaliDate(1395, 12, 30) // true  (1395 is leap)

	return jy >= MIN_JALAALI_YEAR && jy <= MAX_JALAALI_YEAR && jm >= 1 && jm <= 12 && jd >= 1 && jd <= jalaaliMonthLength(jy, jm);

* Returns `true` if the given Jalaali year is leap (366 days).
*
* @example
* isLeapJalaaliYear(1394) // false
* isLeapJalaaliYear(1395) // true

* Returns the number of days in the given Jalaali month.

* out-of-range `jm` will return whichever branch happens to match.
* For input validation, use {@link isValidJalaaliDate} instead.

* @example
* jalaaliMonthLength(1394, 12) // 29 (common year)
* jalaaliMonthLength(1395, 12) // 30 (leap year)
*/

	if (jm <= 6) return 31;
	if (jm <= 11) return 30;
	return isLeapJalaaliYear(jy) ? 30 : 29;
}
/**
* Computes the leap-cycle state of a Jalaali year and the Gregorian date
* of Farvardin 1 in that year.
*
* Use this directly when you need the leap field; if you only need
* `{ gy, march }`, prefer {@link jalCalShort}.
*
* @example
* jalCal(1391) // { leap: 0, gy: 2012, march: 20 }
* jalCal(1395) // { leap: 0, gy: 2016, march: 20 }
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/
function jalCal(jy) {
	const { gy, march, jump, n } = jalCalCore(jy);
	return {
		leap: leapFromCycle(jump, n),
		gy,
		march
	};
}
/**
* Like {@link jalCal} but omits the leap-cycle computation.
*
* @remarks
* Equivalent to v1's `jalCal(jy, true)` — extracted to its own export
* in v2 to give it a proper return type. Prefer this when the leap field
* isn't needed; it avoids a small amount of work per call.
*
* @example
* jalCalShort(1391) // { gy: 2012, march: 20 }
*
* @throws {RangeError} if `jy` falls outside `[-61, 3177]`.
*/

	const { gy, march } = jalCalCore(jy);

		gy,
		march

}
/**
* Converts a Jalaali date to a Julian Day number.
*
* The result is an integer corresponding to noon UT on the given calendar
* day. Inputs are not range-checked — pass valid dates.
*
* @example
* j2d(1395, 1, 23) // 2457490
*/

	const r = jalCalShort(jy);
	return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
}
const FIRST_JALAALI_JDN = j2d(MIN_JALAALI_YEAR, 1, 1);
const LAST_JALAALI_JDN = j2d(MAX_JALAALI_YEAR, 12, jalaaliMonthLength(MAX_JALAALI_YEAR, 12));
/**
* Converts a Julian Day number to a Jalaali date.
*
* @example
* d2j(2457490) // { jy: 1395, jm: 1, jd: 23 }
*
* @throws {RangeError} if `jdn` falls outside the supported Jalaali range
*   `[-61, 3177]`.
*/
function d2j(jdn) {
	if (jdn < FIRST_JALAALI_JDN || jdn > LAST_JALAALI_JDN) throw new RangeError(`Invalid Julian Day number ${jdn}: outside the supported Jalaali range [${MIN_JALAALI_YEAR}, ${MAX_JALAALI_YEAR}]`);
	const gy = d2g(jdn).gy;
	let jy = Math.min(gy - 621, MAX_JALAALI_YEAR);
	const r = jalCal(jy);
	let k = jdn - g2d(r.gy, 3, r.march);
	if (k >= 0) {
		if (k <= 185) return {
			jy,
			jm: 1 + div(k, 31),
			jd: mod(k, 31) + 1
		};
		k -= 186;
	} else {
		jy -= 1;
		k += 179;
		if (r.leap === 1) k += 1;
	}
	return {
		jy,
		jm: 7 + div(k, 30),
		jd: mod(k, 30) + 1
	};
}
/**
* Converts a Gregorian date to a Julian Day number.
*
* Tested correct from 1 March, -100100 (of both calendars) through several
* million years into the future.
*
* @example
* g2d(2016, 4, 11) // 2457490
*/
function g2d(gy, gm, gd) {
	let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
	d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
	return d;
}
/**
* Converts a Julian Day number to a Gregorian date.
*
* Valid for `jdn ≥ -34839655` (year -100100 of both calendars).
*
* @example
* d2g(2457490) // { gy: 2016, gm: 4, gd: 11 }
*/
function d2g(jdn) {
	let j = 4 * jdn + 139361631;
	j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
	const i = div(mod(j, 1461), 4) * 5 + 308;
	const gd = div(mod(i, 153), 5) + 1;
	const gm = mod(div(i, 153), 12) + 1;
	return {
		gy: div(j, 1461) - 100100 + div(8 - gm, 6),
		gm,
		gd
	};
}
/**
* Converts a Jalaali date (optionally with a time of day) to a JavaScript
* `Date` constructed in the local time zone.
*
* Time components default to `0`. Out-of-range time components are *not*
* clamped — they overflow the way the `Date` constructor handles them
* (e.g. `h = 25` rolls into the next day).
*
* @example
* jalaaliToDateObject(1400, 4, 30)
*   // → new Date(2021, 6, 21, 0, 0, 0, 0)
*
* jalaaliToDateObject(1400, 4, 30, 14, 30)
*   // → new Date(2021, 6, 21, 14, 30)
*/
function jalaaliToDateObject(jy, jm, jd, h = 0, m = 0, s = 0, ms = 0) {
	const g = toGregorian(jy, jm, jd);
	return new Date(g.gy, g.gm - 1, g.gd, h, m, s, ms);
}
/**
* Returns the Saturday and Friday bounding the Jalaali week that contains
* the given date. The Jalaali week starts on **Saturday**.
*
* @example
* jalaaliWeek(1400, 4, 30)
*   // → { saturday: { jy: 1400, jm: 4, jd: 26 },
*   //     friday:   { jy: 1400, jm: 5, jd:  1 } }
*
* @remarks
* Uses {@link jalaaliToDateObject} to read the day-of-week, which reflects
* the host's local time zone. For dates near a DST boundary the underlying
* `Date.getDay()` is still correct because the conversion is done in local
* time on both sides.
*/

	const dayOfWeek = jalaaliToDateObject(jy, jm, jd).getDay();
	const startDayDifference = dayOfWeek === 6 ? 0 : -(dayOfWeek + 1);
	const endDayDifference = 6 + startDayDifference;
	return {
		saturday: d2j(j2d(jy, jm, jd + startDayDifference)),
		friday: d2j(j2d(jy, jm, jd + endDayDifference))
	};
}
/**
* Core of the Borkowski algorithm: locate the Jalaali year inside the
* cycle table and compute Farvardin 1's Gregorian date.
*/
function jalCalCore(jy) {
	if (!Number.isFinite(jy) || jy < MIN_JALAALI_YEAR || jy > MAX_JALAALI_YEAR) throw new RangeError(`Invalid Jalaali year ${jy}: must be a finite number between ${MIN_JALAALI_YEAR} and ${MAX_JALAALI_YEAR} (inclusive)`);
	const gy = jy + 621;
	let leapJ = -14;
	let jp = BREAKS[0];
	let jm = 0;
	let jump = 0;
	for (let i = 1; i < BREAKS.length; i += 1) {
		jm = BREAKS[i];
		jump = jm - jp;
		if (jy < jm) break;
		leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
		jp = jm;
	}
	const n = jy - jp;
	leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
	if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
	const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
	return {
		gy,
		march: 20 + leapJ - leapG,
		jump,
		n
	};
}
/**
* Given a 33-year cycle length `jump` and the year offset `n` within that
* cycle, returns the number of years since the last leap year (`0 … 4`).
* `0` means the current year is leap.
*/
function leapFromCycle(jump, n) {
	let adjusted = n;
	if (jump - n < 6) adjusted = n - jump + div(jump + 4, 33) * 33;
	let leap = mod(mod(adjusted + 1, 33) - 1, 4);
	if (leap === -1) leap = 4;

* the Gregorian fields. Kept separate to avoid the per-call object
* allocation on the hot `isLeapJalaaliYear` path.
*/

	if (!Number.isFinite(jy) || jy < MIN_JALAALI_YEAR || jy > MAX_JALAALI_YEAR) throw new RangeError(`Invalid Jalaali year ${jy}: must be a finite number between ${MIN_JALAALI_YEAR} and ${MAX_JALAALI_YEAR} (inclusive)`);
	let jp = BREAKS[0];
	let jm = 0;
	let jump = 0;
	for (let i = 1; i < BREAKS.length; i += 1) {
		jm = BREAKS[i];
		jump = jm - jp;
		if (jy < jm) break;
		jp = jm;
	}
	return leapFromCycle(jump, jy - jp);

* Integer division — `Math.trunc(a / b)` equivalent that's faster on V8
* for values that fit in 32 bits. Used pervasively inside the algorithm.
*/

	return ~~(a / b);

* when `b` is positive (matches Python's `%` semantics, not JavaScript's).
*/

	return a - ~~(a / b) * b;
}

  toJalaali: toJalaali,
  toGregorian: toGregorian,
  isValidJalaaliDate: isValidJalaaliDate,
  isLeapJalaaliYear: isLeapJalaaliYear,
  jalaaliMonthLength: jalaaliMonthLength,
  jalCal: jalCal,
  jalaaliToDateObject: jalaaliToDateObject,
  jalaaliWeek: jalaaliWeek,
  MIN_JALAALI_YEAR: MIN_JALAALI_YEAR,
  MAX_JALAALI_YEAR: MAX_JALAALI_YEAR
};
})(window);
</script>

<script>
/* ---------- storage keys ---------- */
const SUPABASE_URL = 'https://byqowlvyupcusjjyxwaf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5cW93bHZ5dXBjdXNqanl4d2FmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MzAwMDUsImV4cCI6MjEwMzQwNjAwNX0.T2miyC7NU5u0bkyxA4JKtXML9RSiqeTzk-OAqvx59QM';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { global: { fetch: offlineFetch } });

/* ---------- offline mode ----------
   Every write in this file goes through supabase-js, and supabase-js goes
   through offlineFetch — so offline support lives here, at the network edge,
   instead of at ~80 call sites.

   Writes (POST/PATCH/DELETE on /rest/v1) that can't reach the server — the
   phone says it's offline, or the request dies with a network error — are
   stored in an IndexedDB outbox and answered with a fake 204. The caller sees
   success, so its optimistic state stays put instead of rolling back. While
   the outbox holds anything, new writes queue behind it too, so the server
   always sees them in the order they were made. flushOutbox() replays the
   queue on reconnect with a fresh access token.

   Replay rules: 2xx → done. 409 duplicate key on an insert → it already landed
   (the response was lost, not the request), done. 401 → refresh the session
   once and retry. 5xx / 429 / network → stop, try again later. Any other 4xx
   is a real rejection (RLS, bad row): dropped, and the user is told.

   Reads: the loaded data (plus local, not-yet-synced edits) is snapshotted to
   IndexedDB after renders, and loadAll() falls back to it when the server
   can't be reached — so the app opens with your data even with no internet. */
const offlineDB = (function(){
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      const req = indexedDB.open('medar-offline', 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        db.createObjectStore('outbox', { keyPath:'seq' });
        db.createObjectStore('kv');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbp;
  }
  async function run(store, mode, fn){
    const db = await open();
    return new Promise((resolve, reject) => {
      const t = db.transaction(store, mode);
      const r = fn(t.objectStore(store));
      t.oncomplete = () => resolve(r ? r.result : undefined);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }
  return {
    getAll: store => run(store, 'readonly', s => s.getAll()),
    get: (store, key) => run(store, 'readonly', s => s.get(key)),
    put: (store, val, key) => run(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key)),
    del: (store, key) => run(store, 'readwrite', s => s.delete(key)),
    clear: store => run(store, 'readwrite', s => s.clear()),
  };
})();

let outbox = []; // [{ seq, url, method, headers, body, label }] — oldest first
let outboxSeq = Date.now();
let outboxFlushing = null; // the in-flight flush promise, shared by every caller
let lastSyncNetworkFailed = false; // the last flush attempt couldn't reach the server
let usingLocalCopy = false; // state came from the on-device snapshot, not the server
let restWriteSeq = 0; // counts writes sent (or queued) — loadAll() uses it to spot answers an edit has overtaken
const outboxReady = offlineDB.getAll('outbox')
  .then(items => {
    outbox = (items || []).sort((a, b) => a.seq - b.seq);
    if(outbox.length) outboxSeq = Math.max(outboxSeq, outbox[outbox.length - 1].seq);
  })
  .catch(e => console.error('outbox load failed', e));

function isRestWrite(url, method){
  return method !== 'GET' && method !== 'HEAD'
    && url.startsWith(SUPABASE_URL + '/rest/v1/')
    && !url.startsWith(SUPABASE_URL + '/rest/v1/rpc/');
}
function outboxLabel(url, method){
  const table = url.slice((SUPABASE_URL + '/rest/v1/').length).split('?')[0];
  return method + ' ' + table;
}
async function enqueueWrite(url, init){
  const headers = {};
  new Headers(init.headers || {}).forEach((v, k) => { if(k !== 'authorization') headers[k] = v; });
  const item = { seq: ++outboxSeq, url, method: init.method.toUpperCase(), headers, body: init.body == null ? null : String(init.body), label: outboxLabel(url, init.method.toUpperCase()) };
  outbox.push(item);
  try{ await offlineDB.put('outbox', item); }catch(e){ console.error('outbox persist failed', e); }
  renderSoon();
  return new Response(null, { status:204, statusText:'Queued offline' });
}

async function offlineFetch(input, init){
  const url = typeof input === 'string' ? input : input.url;
  const method = ((init && init.method) || 'GET').toUpperCase();
  if(!isRestWrite(url, method)) return fetch(input, init);
  restWriteSeq++;
  await outboxReady;
  if(outbox.length || !navigator.onLine){
    const res = await enqueueWrite(url, init);
    flushOutbox();
    return res;
  }
  try{
    return await fetch(input, init);
  } catch(e){
    if(e && e.name === 'AbortError') throw e;
    lastSyncNetworkFailed = true;
    return enqueueWrite(url, init);
  }
}

async function replayWrite(item, token){
  return fetch(item.url, {
    method: item.method,
    headers: Object.assign({}, item.headers, { apikey: SUPABASE_ANON_KEY, authorization: 'Bearer ' + token }),
    body: item.body,
  });
}
function flushOutbox(){
  if(outboxFlushing) return outboxFlushing;
  outboxFlushing = (async () => {
    await outboxReady;
    let synced = 0, rejected = 0;
    while(outbox.length){
      if(!navigator.onLine){ lastSyncNetworkFailed = true; break; }
      const item = outbox[0];
      const { data: { session } } = await sb.auth.getSession();
      if(!session) break;
      let res;
      try{
        res = await replayWrite(item, session.access_token);
        if(res.status === 401){
          const { data: refreshed } = await sb.auth.refreshSession();
          if(refreshed && refreshed.session) res = await replayWrite(item, refreshed.session.access_token);
        }
      } catch(e){
        lastSyncNetworkFailed = true;
        break;
      }
      lastSyncNetworkFailed = false;
      let done = res.ok;
      if(!done && res.status === 409 && item.method === 'POST'){
        const body = await res.json().catch(() => ({}));
        done = body && body.code === '23505';
        if(!done) rejected++;
      } else if(!done){
        if(res.status === 401 || res.status === 429 || res.status >= 500) break;
        console.error('queued write rejected', item.label, res.status, await res.text().catch(() => ''));
        rejected++;
      }
      outbox.shift();
      try{ await offlineDB.del('outbox', item.seq); }catch(e){ console.error('outbox delete failed', e); }
      if(done) synced++;
    }
    if(rejected) writeFailed('queued write', new Error(rejected + ' rejected'), 'بعضی از تغییراتی که آفلاین زدی رو سرور قبول نکرد — صفحه با نسخه‌ی سرور هماهنگ شد.');
    else if(synced && !outbox.length){
      showInfoToast(`${toFaDigits(synced)} تغییرِ آفلاین روی سرور ذخیره شد`);
    }
    renderSoon();
  })().finally(() => { outboxFlushing = null; });
  return outboxFlushing;
}

/* A render outside a user event is deferred while a text field has focus, so
   status changes (offline pill, queue count) go through here rather than
   poking render() directly from network callbacks. */
let renderSoonTimer = null;
function renderSoon(){
  if(renderSoonTimer) return;
  renderSoonTimer = setTimeout(() => { renderSoonTimer = null; if(appStarted) render(); }, 50);
}

async function goOnline(){
  lastSyncNetworkFailed = false;
  renderSoon();
  await flushOutbox();
  // booted from the local copy: now that the server answers, load the real data
  if(usingLocalCopy && !outbox.length && !lastSyncNetworkFailed) loadAll();
}
window.addEventListener('online', goOnline);
window.addEventListener('offline', () => { lastSyncNetworkFailed = true; renderSoon(); });
// flaky links often never fire 'online' — keep nudging a non-empty queue
setInterval(() => { if(outbox.length && navigator.onLine) goOnline(); }, 30000);

/* ---------- offline snapshot of loaded data ---------- */
const SNAPSHOT_KEYS = ['tags','tasks','recurringTemplates','tagGoals','aiReports','purchases','ideas','subscriptions','reminders','prompts','wins','motherItems','motherSettings','homeRepairs','homeParts','homeMaint','englishSettings','englishHomework','englishChunks','englishPractice','aiHealth'];
let dataLoaded = false; // state holds real data (server or snapshot), safe to snapshot
let snapshotTimer = null;
function scheduleSnapshot(){
  if(!dataLoaded || snapshotTimer) return;
  snapshotTimer = setTimeout(() => {
    snapshotTimer = null;
    const snap = { savedAt: Date.now() };
    SNAPSHOT_KEYS.forEach(k => { snap[k] = state[k]; });
    offlineDB.put('kv', snap, 'snapshot').catch(e => console.error('snapshot save failed', e));
  }, 1500);
}
async function restoreSnapshot(){
  try{
    const snap = await offlineDB.get('kv', 'snapshot');
    if(!snap) return false;
    SNAPSHOT_KEYS.forEach(k => { if(snap[k] !== undefined) state[k] = snap[k]; });
    state.localCopySavedAt = snap.savedAt;
    return true;
  } catch(e){
    console.error('snapshot restore failed', e);
    return false;
  }
}
function isOfflineNow(){ return !navigator.onLine || lastSyncNetworkFailed; }

const MONTHS_JALALI = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

function toFaDigits(str){
  const map = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  return String(str).replace(/[0-9]/g, d => map[d]);
}
/* Shared utility: normalize Persian/Arabic-Indic digits to standard English digits.
   Reusable for any numeric input field on the site. */
function toEnDigits(str){
  const faMap = {'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
  const arMap = {'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  return String(str).replace(/[۰-۹٠-٩]/g, d => faMap[d] || arMap[d] || d);
}
/* Shared helper: live-normalizes a text input's value to plain English digits
   (strips anything else that isn't a digit). Call from oninput on numeric text fields. */
function normalizeNumericInput(el){
  const converted = toEnDigits(el.value).replace(/[^0-9]/g, '');
  if(el.value !== converted) el.value = converted;
  return converted;
}

/* ---------- Jalali conversion (Gregorian -> Jalali) ---------- */
function gregorianToJalali(gy, gm, gd){
  const gDayNo = [0,31,59,90,120,151,181,212,243,273,304,334];
  const gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = 355666 + 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) + gd + gDayNo[gm-1];
  let jy = -1595 + 33*Math.floor(days/12053);
  days %= 12053;
  jy += 4*Math.floor(days/1461);
  days %= 1461;
  if(days > 365){
    jy += Math.floor((days-1)/365);
    days = (days-1) % 365;
  }
  let jm, jd;
  if(days < 186){
    jm = 1 + Math.floor(days/31);
    jd = 1 + (days % 31);
  } else {
    jm = 7 + Math.floor((days-186)/30);
    jd = 1 + ((days-186) % 30);
  }
  return [jy, jm, jd];
}

function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function tomorrowDate(){ const d = new Date(); d.setDate(d.getDate()+1); return d; }

function fmtHeaderDate(d){
  const wd = WEEKDAYS_FA[d.getDay()];
  const gDay = toFaDigits(d.getDate());
  const gMonth = MONTHS_GREG_FA[d.getMonth()];
  const gYear = toFaDigits(d.getFullYear());
  const [jy, jm, jd] = gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  const jalali = `${toFaDigits(jd)} ${MONTHS_JALALI[jm-1]} ${toFaDigits(jy)}`;
  const gregorian = `${gDay} ${gMonth} ${gYear}`;
  return { wd, jalali, gregorian };
}
function formatDateShort(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  const [jy, jm, jd] = gregorianToJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
  return `${toFaDigits(jd)} ${MONTHS_JALALI[jm-1]}`;
}
function formatDuration(min){
  if(!min) return '۰ دقیقه';
  const h = Math.floor(min/60), m = min%60;
  if(h>0 && m>0) return `${toFaDigits(h)} ساعت و ${toFaDigits(m)} دقیقه`;
  if(h>0) return `${toFaDigits(h)} ساعت`;
  return `${toFaDigits(m)} دقیقه`;
}

/* No server to load from (offline, or edits still queued that the server
   hasn't seen — fetching now would paint over them). Keep what's on screen,
   or on a cold start fall back to the on-device snapshot. */
async function loadFromLocalCopy(){
  if(!dataLoaded){
    if(await restoreSnapshot()){ dataLoaded = true; usingLocalCopy = true; }
    else { loadError = true; applyEmptyDefaults(); }
  }
  ensureRealtimeSync();
  render();
}
function applyEmptyDefaults(){
  if(!state.tags) state.tags = DEFAULT_TAGS;
  if(!state.tasks) state.tasks = [];
  if(!state.recurringTemplates) state.recurringTemplates = [];
  if(!state.tagGoals) state.tagGoals = [];
  if(!state.aiReports) state.aiReports = [];
  if(!state.purchases) state.purchases = [];
  if(!state.ideas) state.ideas = [];
  if(!state.subscriptions) state.subscriptions = [];
}

      sb.from('ideas')
        .select('*, idea_tags(tag_id), idea_images(id, data_url, position)')
        .order('created_at', { ascending:false })
        .order('position', { foreignTable:'idea_images', ascending:true }),
      sb.from('subscriptions').select('*').order('next_renewal', { ascending:true, nullsFirst:false }),
    ].map(ask)),

/* ---------- realtime sync (incremental — no full reload per change) ----------
   Registers per-table INSERT/UPDATE/DELETE handlers on a shared channel. Each
   handler patches only the affected slice of local state, so the cost of every
   change stays constant no matter how much data or how many tables exist.
   To wire up a future table: call registerRealtimeSync(channel, 'table_name',
   { onInsert, onUpdate, onDelete }) inside startRealtimeSync — the rest of the
   plumbing (channel, subscribe, reconnect-reconcile) is already shared. */
function registerRealtimeSync(channel, table, handlers){
  if(handlers.onInsert) channel.on('postgres_changes', { event:'INSERT', schema:'public', table }, payload => handlers.onInsert(payload.new));
  if(handlers.onUpdate) channel.on('postgres_changes', { event:'UPDATE', schema:'public', table }, payload => handlers.onUpdate(payload.new, payload.old));

async function addTag(){

  const name = nameInput.value.trim();
  if(!name) return;

  render();

  if(error) writeFailed('addTag', error);
}
async function updateTagColor(tagId, color){
  const tag = state.tags.find(t => t.id === tagId);
  if(!tag || tag.color === color) return;
  tag.color = color;
  render();
  const { error } = await sb.from('tags').update({ color }).eq('id', tagId);
  if(error) writeFailed('updateTagColor', error);
}
const pendingTagDeleteTimers = {}; // tagId -> timeoutId, while the undo window is open
function deleteTag(tagId){
  const idx = state.tags.findIndex(t => t.id === tagId);
  if(idx === -1) return;
  const [removed] = state.tags.splice(idx, 1);
  /* remember everything that carried the tag, so undo can put it back exactly */
  const holders = [...state.tasks, ...state.recurringTemplates, ...state.ideas, ...state.wins].filter(x => (x.tagIds || []).includes(tagId));
  const inTodayFilter = state.todayFilters.tagIds.includes(tagId);
  const inTasksFilter = state.tasksFilters.tagIds.includes(tagId);
  const goal = state.tagGoals.find(g => g.tagId === tagId);
  holders.forEach(x => { x.tagIds = x.tagIds.filter(id => id !== tagId); });
  state.todayFilters.tagIds = state.todayFilters.tagIds.filter(id => id !== tagId);
  state.tasksFilters.tagIds = state.tasksFilters.tagIds.filter(id => id !== tagId);
  state.tagGoals = state.tagGoals.filter(g => g.tagId !== tagId);
  showUndoToast(`تگ «${removed.name}» حذف شد`, () => {
    clearTimeout(pendingTagDeleteTimers[tagId]);
    delete pendingTagDeleteTimers[tagId];
    state.tags.splice(Math.min(idx, state.tags.length), 0, removed);
    holders.forEach(x => { if(!x.tagIds.includes(tagId)) x.tagIds.push(tagId); });
    if(inTodayFilter) state.todayFilters.tagIds.push(tagId);
    if(inTasksFilter) state.tasksFilters.tagIds.push(tagId);
    if(goal) state.tagGoals.push(goal);
    render();
  });
  render();
  pendingTagDeleteTimers[tagId] = setTimeout(async () => {
    delete pendingTagDeleteTimers[tagId];
    const { error } = await sb.from('tags').delete().eq('id', tagId);
    if(error) writeFailed('deleteTag', error);
  }, 5000);
}

const IDEA_IMAGE_MAX_DIM = 1400;   // downscale before storing — keeps rows small and loads fast
const IDEA_IMAGE_QUALITY = 0.82;
function readAndCompressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, IDEA_IMAGE_MAX_DIM / Math.max(width, height));
        width = Math.round(width * scale);
        height = Math.round(height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', IDEA_IMAGE_QUALITY));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function getCurrentWeekRange(){
  const today = new Date();
  const daysSinceSaturday = (today.getDay() + 1) % 7; // Sat=0, Sun=1, ... Fri=6
  const start = new Date(today);
  start.setDate(start.getDate() - daysSinceSaturday);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  return { start: dateKey(start), end: dateKey(end) };
}
/* Minutes a single task contributes toward weekly goals.
   Prefers real logged Pomodoro time; falls back to the planned estimate only for
   tasks that were actually completed without ever running a Pomodoro on them, so
   finishing work without the timer still counts. Never sums both — that would
   conflate estimate with reality. */
function taskGoalMinutes(t){
  if(t.actualMin && t.actualMin > 0) return t.actualMin;
  if(t.done && t.durationMin) return t.durationMin;
  return 0;
}
function computeTagWeeklyMinutes(tagId){
  const { start, end } = getCurrentWeekRange();
  return state.tasks
    .filter(t => t.tagIds.includes(tagId))
    .filter(t => {
      // count a completed task toward the week it was actually FINISHED in,
      // not the week it was originally scheduled for — otherwise an overdue
      // task from last week never counts even though you just did the work now
      const relevantDate = (t.done && t.completedAt) ? dateKey(new Date(t.completedAt)) : t.date;
      return relevantDate && relevantDate >= start && relevantDate <= end;
    })
    .reduce((s,t) => s + taskGoalMinutes(t), 0)
    + (isEnglishTag(tagId) ? englishChunkMinutesBetween(start, end) : 0);
}
/* Homework chunks aren't tasks, so they carry no tag — a finished chunk counts
   toward the weekly goal of the tag named «انگلیسی» (generate-ai-report does
   the same; keep the two in step). Real minutes if they were given when it was
   ticked, the planned ones otherwise — same rule as taskGoalMinutes. */
function isEnglishTag(tagId){
  const tag = state.tags.find(t => t.id === tagId);
  return !!tag && /انگلیسی|english/i.test(tag.name);
}
function englishChunkMinutesBetween(start, end){
  return (state.englishChunks || []).filter(c => c.done).reduce((n, c) => {
    const day = c.doneAt ? dateKey(new Date(c.doneAt)) : c.day;
    return day >= start && day <= end ? n + (c.actualMin || c.minutes) : n;
  }, 0);
}

  const f = state[pageKey];

  if(f.tagIds.length) list = list.filter(t => t.tagIds.some(id => f.tagIds.includes(id)));
  if(f.priorities.length) list = list.filter(t => f.priorities.includes(t.priority));
  if(opts && opts.dateFilter && f.date){
    if(f.date === 'none') list = list.filter(t => !t.date);
    else list = list.filter(t => t.date === f.date);
  }
  if(f.sortBy === 'today-first'){
    // today's own tasks on top, then overdue ones (oldest overdue last),
    // so opening the app shows what you planned for today rather than a
    // wall of things you already missed
    const todayStr = dateKey(new Date());
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const aOver = !!(a.date && a.date < todayStr);
      const bOver = !!(b.date && b.date < todayStr);
      if(aOver !== bOver) return aOver ? 1 : -1;
      if(aOver && bOver && a.date !== b.date) return b.date.localeCompare(a.date);
      const ar = a.priority ? PRIORITY_RANK[a.priority] : 3;
      const br = b.priority ? PRIORITY_RANK[b.priority] : 3;

      const ad = (a.durationMin==null) ? Infinity : a.durationMin;
      const bd = (b.durationMin==null) ? Infinity : b.durationMin;

      const bd = (b.durationMin==null) ? -1 : b.durationMin;

    list = [...list].sort((a,b) => {

      const ad = a.date || '9999-99-99';

      if(ad !== bd) return ad.localeCompare(bd);
      const ar = a.priority ? PRIORITY_RANK[a.priority] : 3;
      const br = b.priority ? PRIORITY_RANK[b.priority] : 3;
      return ar - br;
    });
  } else {
    list = [...list].sort((a,b) => {
      if(a.done !== b.done) return a.done ? 1 : -1;
      const ar = a.priority ? PRIORITY_RANK[a.priority] : 3;
      const br = b.priority ? PRIORITY_RANK[b.priority] : 3;

/* ---------- write guard ----------
   Every write here is optimistic: local state changes and the screen repaints
   before the server has confirmed anything. That is what makes the app feel
   instant, but it also means a write that never lands — offline, a flaky
   connection, a missing grant — used to be invisible. The failure was logged to
   the console and nothing else: the row sat there looking saved until the next
   reload quietly dropped it.

   Two entry points close that gap, and both say so out loud:
     persist(promise, { message, rollback })  — for a single write whose inverse
       is cheap and obvious. Reverts exactly that change.
     writeFailed(label, error)                — for everything else, including
       multi-statement saves (task + tags + subtasks) where a hand-written
       inverse would be its own source of bugs. It schedules one reconciliation
       against the server, which is authoritative, so local state snaps back to
       what actually got stored.
   scheduleReconcile() is deliberately hard to loop: loadAll() itself writes (it
   rolls over reminders and generates recurring instances), so a dead connection
   could otherwise fail -> reconcile -> fail forever. One in flight at a time,
   and at most one per 10s. */
let saveErrorTimer = null;
function showSaveError(message){
  state.saveError = { message };
  render();
  if(saveErrorTimer) clearTimeout(saveErrorTimer);
  saveErrorTimer = setTimeout(() => { state.saveError = null; render(); }, 8000);

const SAVE_FAILED_MSG = 'تغییرت ذخیره نشد — اینترنتت رو چک کن و دوباره امتحان کن.';

let reconcileTimer = null;
let reconcileInFlight = false;
let lastReconcileAt = 0;
function scheduleReconcile(){
  if(reconcileTimer || reconcileInFlight) return;
  if(Date.now() - lastReconcileAt < 10000) return;
  reconcileTimer = setTimeout(async () => {
    reconcileTimer = null;
    reconcileInFlight = true;
    try{ await loadAll(); }
    finally{ reconcileInFlight = false; lastReconcileAt = Date.now(); }
  }, 600);
}

/* Call from any `if(error) ...` branch on a write. Replaces the old bare
   console.error, which only ever reached the devtools console. */
function writeFailed(label, error, message){
  console.error(label + ' failed', error);
  showSaveError(message || SAVE_FAILED_MSG);
  scheduleReconcile();
  return false;
}

async function persist(promise, { message, rollback } = {}){
  let error = null;
  try{
    const res = await promise;
    error = res && res.error;
  } catch(e){
    error = e;
  }
  if(!error) return true;
  console.error('write failed', error);
  if(rollback){
    rollback();
    showSaveError(message || SAVE_FAILED_MSG);
    render();
    return false;
  }
  return writeFailed('write', error, message);
}

  if(evt) evt.stopPropagation();

  const s = t.subtasks.find(s => s.id === subId);
  s.done = !s.done;
  const wasDone = t.done;
  const allDone = t.subtasks.length && t.subtasks.every(s => s.done);
  /* only flip the parent when the completion state actually changes — calling
     markDone(t, true) unconditionally would re-tick every subtask and clobber the
     very unticking the user just did */
  if(allDone && !wasDone){
    t.done = true;

    t.done = false;
    t.completedAt = null;
  }
  render();
  const { error } = await sb.from('subtasks').update({ done:s.done }).eq('id', subId);
  if(error) writeFailed('toggleSubtask', error);
  if(t.done !== wasDone){
    const { error: taskErr } = await sb.from('tasks').update({ done:t.done, completed_at:t.completedAt }).eq('id', taskId);
    if(taskErr) writeFailed('parent sync', taskErr);
    // finishing a task by ticking its last subtask should prompt for time/difficulty
    // just like ticking the task itself does

      state.taskCompletionModal = { taskId, minutes:null, difficulty:null };

    }
  }

/* ---------- duration suggestion engine ----------
   Suggests a duration for a new/edited task based on ACTUAL time previously
   logged (via Pomodoro) on similar past tasks. Three tiers, most confident first:
   1. exact  — prior tasks with the exact same title (case-insensitive)
   2. keyword — prior tasks sharing a tag AND at least one meaningful title word
   3. tag     — prior tasks sharing a tag only (rough fallback)
   Never invented from nothing: each tier requires real matching history. */
const SUGGESTION_STOPWORDS = new Set([
  'و','در','با','برای','از','به','رو','این','آن','یک','تا','هم','که','یا','بر','را','های','ها',
  'می','شد','شده','کن','کردن','است','بود','چند','هر','یه','اون','این‌','روی','بین','چه',
]);
const SUGGESTION_NUMBER_WORDS = new Set([
  'صفر','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده',
  'یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده','بیست',
  'سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود','صد',
]);
function tokenizeTaskTitle(str){
  return toEnDigits(str || '')
    .replace(/[^\u0600-\u06FF\u0750-\u077Fa-zA-Z0-9\s]/g, ' ')
    .split(/\s+/)
    .map(w => w.trim())
    .filter(w => w.length >= 2)
    .filter(w => !SUGGESTION_STOPWORDS.has(w))
    .filter(w => !SUGGESTION_NUMBER_WORDS.has(w))
    .filter(w => !/^[0-9]+$/.test(w));
}
function computeDurationSuggestion(){
  const ed = state.taskEditor;
  if(!ed) return null;
  const title = (ed.draft.title || '').trim();
  const tagIds = ed.draft.tagIds;
  if(!tagIds.length) return null;

  const candidates = state.tasks.filter(t =>
    t.actualMin && t.actualMin > 0 &&
    t.tagIds.some(id => tagIds.includes(id)) &&
    (!ed.taskId || t.id !== ed.taskId)
  );
  if(!candidates.length) return null;

  if(title){
    const exact = candidates.filter(t => t.title.trim().toLowerCase() === title.toLowerCase());
    if(exact.length){
      const avg = Math.round(exact.reduce((s,t) => s + t.actualMin, 0) / exact.length);
      return { minutes: avg, tier:'exact', count: exact.length };
    }
  }

  const myTokens = new Set(tokenizeTaskTitle(title));
  if(myTokens.size){
    const keywordMatches = candidates.filter(t => tokenizeTaskTitle(t.title).some(tok => myTokens.has(tok)));
    if(keywordMatches.length >= 3){
      const avg = Math.round(keywordMatches.reduce((s,t) => s + t.actualMin, 0) / keywordMatches.length);
      return { minutes: avg, tier:'keyword', count: keywordMatches.length };
    }
  }

  if(candidates.length >= 3){
    const avg = Math.round(candidates.reduce((s,t) => s + t.actualMin, 0) / candidates.length);
    return { minutes: avg, tier:'tag', count: candidates.length };
  }
  return null;
}

async function confirmTaskEditor(){
  const titleInput = document.getElementById('editor-title');
  const title = titleInput.value.trim();
  if(!title){ titleInput.focus(); return; }
  const ed = state.taskEditor;
  ed.draft.title = title;
  ed.draft.notes = (ed.draft.notes || '').trim();
  const reminderRow = taskReminderRow(ed.draft);
  if(!reminderRow) return;

  if(ed.mode === 'create' && ed.draft.recurring.enabled){
    if(ed.draft.recurring.weekdays.length === 0){ return; } // need at least one day picked
    await createRecurringTemplate();
    return;
  }

  const taskRow = {
    title: ed.draft.title, notes: ed.draft.notes || null, priority: ed.draft.priority,
    date: ed.draft.date || null, duration_min: ed.draft.durationMin, ...reminderRow,
  };

  if(ed.mode === 'create'){
    const newTask = {
      id: uid(), title: ed.draft.title, notes: ed.draft.notes, done:false, completedAt:null,
      tagIds: ed.draft.tagIds, priority: ed.draft.priority,
      subtasks: ed.draft.subtasks, date: ed.draft.date, durationMin: ed.draft.durationMin, actualMin: null,
      recurringTemplateId: null, ...taskReminderFromRow(reminderRow),
    };
    state.tasks.unshift(newTask);
    state.taskEditor = null;
    render();

    const { error: taskErr } = await sb.from('tasks').insert({ id:newTask.id, ...taskRow, done:false });
    if(taskErr){ writeFailed('create task', taskErr); return; }
    if(newTask.tagIds.length){
      const { error: tagErr } = await sb.from('task_tags').insert(newTask.tagIds.map(tagId => ({ task_id:newTask.id, tag_id:tagId })));
      if(tagErr) writeFailed('link tags', tagErr);
    }
    if(newTask.subtasks.length){
      const { error: subErr } = await sb.from('subtasks').insert(newTask.subtasks.map((s,i) => ({ id:s.id, task_id:newTask.id, title:s.title, done:false, position:i })));
      if(subErr) writeFailed('create subtasks', subErr);
    }
  } else {
    const t = state.tasks.find(t => t.id === ed.taskId);
    if(!t){ state.taskEditor = null; render(); return; }
    const prevSubtasks = t.subtasks;
    const prevDate = t.date;
    t.title = ed.draft.title; t.notes = ed.draft.notes; t.tagIds = ed.draft.tagIds; t.priority = ed.draft.priority;
    Object.assign(t, taskReminderFromRow(reminderRow));
    t.date = ed.draft.date; t.durationMin = ed.draft.durationMin; t.subtasks = ed.draft.subtasks;
    const applyToFuture = ed.isRecurringInstance && ed.applyToFutureRecurring && ed.recurringTemplateId;
    state.taskEditor = null;
    render();

    const { error: taskErr } = await sb.from('tasks').update(taskRow).eq('id', t.id);
    if(taskErr) writeFailed('update task', taskErr);
    if(prevDate !== t.date) logTaskDateChange(t.id, prevDate, t.date);

    const { error: delTagErr } = await sb.from('task_tags').delete().eq('task_id', t.id);
    if(delTagErr) writeFailed('clear tags', delTagErr);
    if(t.tagIds.length){
      const { error: tagErr } = await sb.from('task_tags').insert(t.tagIds.map(tagId => ({ task_id:t.id, tag_id:tagId })));
      if(tagErr) writeFailed('relink tags', tagErr);
    }

    /* Sync subtasks by diffing against what existed before, instead of deleting
       everything and reinserting with brand-new ids — that used to desync local
       state from the DB (and made realtime echo back a spurious delete). */
    const prevIds = new Set(prevSubtasks.map(s => s.id));
    const currIds = new Set(t.subtasks.map(s => s.id));
    const removedIds = prevSubtasks.filter(s => !currIds.has(s.id)).map(s => s.id);
    const newOnes = t.subtasks.filter(s => !prevIds.has(s.id));
    const keptOnes = t.subtasks.filter(s => prevIds.has(s.id));

    if(removedIds.length){
      const { error } = await sb.from('subtasks').delete().in('id', removedIds);
      if(error) writeFailed('delete removed subtasks', error);
    }
    if(newOnes.length){
      const { error } = await sb.from('subtasks').insert(newOnes.map(s => ({
        id:s.id, task_id:t.id, title:s.title, done:s.done, position:t.subtasks.indexOf(s),
      })));
      if(error) writeFailed('insert new subtasks', error);
    }
    await Promise.all(keptOnes.map(s =>
      sb.from('subtasks').update({ title:s.title, done:s.done, position:t.subtasks.indexOf(s) }).eq('id', s.id)
        .then(({ error }) => { if(error) writeFailed('update subtask', error); })
    ));

    if(applyToFuture){
      await updateRecurringTemplateFromInstance(ed.recurringTemplateId, t);
    }
  }
}
async function createRecurringTemplate(){
  const ed = state.taskEditor;

    id: uid(), title: d.title, notes: d.notes, priority: d.priority, durationMin: d.durationMin,
    weekdays: [...d.recurring.weekdays], active:true, tagIds: [...d.tagIds], reminderTime:d.reminderEnabled ? d.reminderTime : null, reminderDaysBefore:d.reminderDaysBefore || 0,
  };
  state.recurringTemplates.push(tpl);

  const { error: tplErr } = await sb.from('recurring_templates').insert({
    id: tpl.id, title: tpl.title, notes: tpl.notes || null, priority: tpl.priority, duration_min: tpl.durationMin,
    weekdays: tpl.weekdays, active: true, reminder_time:tpl.reminderTime, reminder_days_before:tpl.reminderDaysBefore,
  });
  if(tplErr){ writeFailed('create recurring template', tplErr); return; }
  if(tpl.tagIds.length){
    const { error: tagErr } = await sb.from('recurring_template_tags').insert(tpl.tagIds.map(tagId => ({ template_id:tpl.id, tag_id:tagId })));
    if(tagErr) writeFailed('link recurring template tags', tagErr);

async function updateRecurringTemplateFromInstance(templateId, instance){
  const tpl = state.recurringTemplates.find(t => t.id === templateId);
  if(!tpl) return;
  tpl.title = instance.title; tpl.notes = instance.notes || ''; tpl.priority = instance.priority; tpl.durationMin = instance.durationMin; tpl.tagIds = [...instance.tagIds];
  tpl.reminderTime = null; tpl.reminderDaysBefore = 0;
  if(instance.reminderAt){
    const local = new Date(Date.parse(instance.reminderAt)+3*3600000).toISOString();
    tpl.reminderTime = local.slice(11,16);

/* A recurring instance that was never finished stays on "today" as an overdue
   item ONLY until the task comes round again. The moment the next scheduled day
   arrives, the stale instance is dropped and a fresh one takes its place — an
   overdue chore never stacks up, and what you see is always the current turn. */
async function dropStaleRecurringInstances(templateId, todayStr){
  const stale = state.tasks.filter(t =>
    t.recurringTemplateId === templateId && !t.done && t.date && t.date < todayStr
  );
  if(!stale.length) return;
  const ids = stale.map(t => t.id);
  state.tasks = state.tasks.filter(t => !ids.includes(t.id));
  const { error } = await sb.from('tasks').delete().in('id', ids);
  if(error) writeFailed('drop stale recurring instances', error);
}
async function maybeGenerateTodayForTemplate(tpl){
  if(!tpl.active) return;

  const todayWeekday = new Date().getDay();
  if(!tpl.weekdays.includes(todayWeekday)) return;
  if(state.tasks.some(t => t.recurringTemplateId === tpl.id && t.date === todayStr)) return;
  await dropStaleRecurringInstances(tpl.id, todayStr);

  const newTask = {
    id: uid(), title: tpl.title, notes: tpl.notes || '', done:false, completedAt:null,
    tagIds: [...tpl.tagIds], priority: tpl.priority, subtasks:[], date: todayStr,
    durationMin: tpl.durationMin, actualMin: null, recurringTemplateId: tpl.id, reminderAt:recurringTaskReminderAt(tpl, todayStr), reminderKind:"once", reminderLeadDays:0,
  };
  state.tasks.unshift(newTask);

  const { error: taskErr } = await sb.from('tasks').insert({
    id:newTask.id, title:newTask.title, notes:newTask.notes || null, priority:newTask.priority, date:newTask.date,
    duration_min:newTask.durationMin, done:false, recurring_template_id:tpl.id, reminder_at:newTask.reminderAt,
  });
  if(taskErr){
    if(taskErr.code === '23505'){
      state.tasks = state.tasks.filter(t => t.id !== newTask.id);
      await loadAll(); render(); return;
    }
    writeFailed('generate recurring instance', taskErr); return;
  }
  if(newTask.tagIds.length){
    const { error: tagErr } = await sb.from('task_tags').insert(newTask.tagIds.map(tagId => ({ task_id:newTask.id, tag_id:tagId })));
    if(tagErr) writeFailed('link recurring instance tags', tagErr);
  }
}

/* ---------- مرور هفتگی ----------
   The weekly report (generate-ai-report → proposeWeek) no longer reshuffles
   anything by itself. Each change it proposes waits here as 'pending' until the
   user accepts it, picks another date, or rejects it; whatever is still pending
   at replan_apply_after the cron applies on its own ('auto'). Reports from
   before this have no status — they were applied at once, so they count as
   'auto' and keep «برگردون همه‌چی». Deleting the task from a card needs no
   status: a task that's gone simply counts as decided. */
const REVIEW_MAX_FOCUS = 3;
const changeStatus = c => c.status || 'auto';
function reviewPending(r){
  if(!r || !r.replan || !r.replan.changes) return [];
  return r.replan.changes.filter(c => changeStatus(c) === 'pending' && state.tasks.some(t => t.id === c.task_id && !t.done));

async function saveReview(r, label){

function applyChangeToTask(c, after){
  const t = state.tasks.find(t => t.id === c.task_id);
  if(!t || t.done) return null;
  t.date = after.date || '';
  t.priority = after.priority;
  t.durationMin = after.duration_min;
  return sb.from('tasks').update({ date:after.date, priority:after.priority, duration_min:after.duration_min }).eq('id', t.id);
}
async function decideChange(reportId, taskId, decision, customDate){
  const r = state.aiReports.find(r => r.id === reportId);
  const c = r && r.replan && r.replan.changes.find(c => c.task_id === taskId);
  if(!c || changeStatus(c) !== 'pending') return;
  let write = null;
  if(decision === 'accept'){
    c.status = 'accepted';
    write = applyChangeToTask(c, c.after);
  } else if(decision === 'date'){
    if(!customDate) return;
    c.status = 'edited';
    c.after = { ...c.after, date:customDate };
    write = applyChangeToTask(c, c.after);
  } else {
    c.status = 'rejected';
  }
  render();
  if(write){
    const { error } = await write;
    if(error) return writeFailed('decideChange', error);
  }

  render();
  const failed = (await Promise.all(writes)).find(res => res.error);
  if(failed) return writeFailed('acceptAllChanges', failed.error);

async function rejectAllChanges(reportId){

async function toggleFocus(reportId, taskId){

  if(chosen.includes(taskId)) r.focus.chosen = chosen.filter(id => id !== taskId);

  else return showSaveError(`حداکثر ${toFaDigits(REVIEW_MAX_FOCUS)} اولویت — اول یکی رو بردار.`);
  render();

/* «برگردون همه‌چی» — only for changes هوشواره applied by itself ('auto'). It
   puts each task's date/priority/duration back, but only fields still holding
   the AI's value, so anything the user has changed by hand since is left alone. */
async function revertReplan(reportId){
  const r = state.aiReports.find(r => r.id === reportId);
  if(!r || !r.replan || r.replanRevertedAt) return;
  const keys = { date:'date', priority:'priority', duration_min:'durationMin' };
  const writes = [];
  r.replan.changes.filter(c => changeStatus(c) === 'auto').forEach(c => {
    const t = state.tasks.find(t => t.id === c.task_id);
    if(!t || t.done) return;
    const patch = {};
    Object.entries(keys).forEach(([col, prop]) => {
      const now = col === 'date' ? (t.date || null) : (t[prop] ?? null);
      if(c.after[col] !== c.before[col] && now === c.after[col]) patch[col] = c.before[col];
    });
    if(!Object.keys(patch).length) return;
    Object.entries(patch).forEach(([col, v]) => { t[keys[col]] = col === 'date' ? (v || '') : v; });
    writes.push(sb.from('tasks').update(patch).eq('id', t.id));
  });
  r.replanRevertedAt = new Date().toISOString();
  render();
  const results = await Promise.all(writes);
  const failed = results.find(res => res.error);
  if(failed) return writeFailed('revertReplan', failed.error);
  const { error } = await sb.from('ai_reports').update({ replan_reverted_at: r.replanRevertedAt }).eq('id', r.id);
  if(error) writeFailed('revertReplan mark', error);
}

/* ---------- subscriptions ---------- */
function daysUntil(dateStr){
  if(!dateStr) return null;
  const todayStr = dateKey(new Date());
  const a = new Date(todayStr + 'T00:00:00');
  const b = new Date(dateStr + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
const SUB_CYCLES = [
  { id:'monthly',    label:'ماهانه',   months:1 },
  { id:'bimonthly',  label:'دوماهه',   months:2 },
  { id:'quarterly',  label:'سه‌ماهه',  months:3 },
  { id:'semiannual', label:'شش‌ماهه',  months:6 },
  { id:'yearly',     label:'سالانه',   months:12 },
];
function subCycle(id){ return SUB_CYCLES.find(c => c.id === id) || SUB_CYCLES[0]; }
function advanceRenewal(dateStr, cycle){
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDate();
  d.setDate(1);
  d.setMonth(d.getMonth() + subCycle(cycle).months);
  // clamp: renewing on Jan 31 lands on the last day of the target month, not spills into the next
  const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  d.setDate(Math.min(day, lastDay));
  return dateKey(d);
}
function subDueLabel(sub){
  const n = daysUntil(sub.nextRenewal);
  if(n === null) return { text:'تاریخ تمدید ثبت نشده', cls:'' };
  if(n < 0) return { text:`${toFaDigits(Math.abs(n))} روز از تمدید گذشته`, cls:'late' };
  if(n === 0) return { text:'امروز تمدید می‌شه', cls:'late' };
  if(n === 1) return { text:'فردا تمدید می‌شه', cls:'' };
  return { text:`${toFaDigits(n)} روز تا تمدید`, cls:'' };
}
function subState(sub){
  if(!sub.active) return 'inactive';
  const n = daysUntil(sub.nextRenewal);
  if(n === null) return '';
  if(n < 0) return 'overdue';
  if(n <= (sub.notifyDaysBefore || 0)) return 'due';
  return '';
}
function toggleInactiveSubs(){ state.subscriptionShowInactive = !state.subscriptionShowInactive; render(); }
function openSubscriptionEditor(subId){
  const s = subId ? state.subscriptions.find(x => x.id === subId) : null;
  state.subscriptionEditor = s
    ? { subId:s.id, name:s.name, cycle:s.cycle, nextRenewal:s.nextRenewal, notifyDaysBefore:s.notifyDaysBefore, note:s.note }
    : { subId:null, name:'', cycle:'monthly', nextRenewal:'', notifyDaysBefore:3, note:'' };
  render();
}
function closeSubscriptionEditor(){ state.subscriptionEditor = null; render(); }
function subEditorSet(field, value){
  if(!state.subscriptionEditor) return;
  state.subscriptionEditor[field] = field === 'notifyDaysBefore' ? (parseInt(value,10) || 0) : value;
  if(field === 'cycle') render();
}
async function confirmSubscriptionEditor(){
  const ed = state.subscriptionEditor;
  if(!ed || !ed.name.trim()) return;
  const payload = {
    name: ed.name.trim(),
    cycle: ed.cycle,
    next_renewal: ed.nextRenewal || null,
    notify_days_before: ed.notifyDaysBefore,
    note: ed.note || null,
  };
  if(ed.subId){
    const sub = state.subscriptions.find(s => s.id === ed.subId);
    const before = { name:sub.name, cycle:sub.cycle, nextRenewal:sub.nextRenewal, notifyDaysBefore:sub.notifyDaysBefore, note:sub.note };
    Object.assign(sub, { name:payload.name, cycle:payload.cycle, nextRenewal:ed.nextRenewal, notifyDaysBefore:ed.notifyDaysBefore, note:ed.note });
    state.subscriptionEditor = null; render();
    await persist(sb.from('subscriptions').update(payload).eq('id', ed.subId), {
      message: `تغییرات «${before.name}» ذخیره نشد — اینترنتت رو چک کن و دوباره امتحان کن.`,
      rollback: () => Object.assign(sub, before),
    });
  } else {
    const id = crypto.randomUUID();
    state.subscriptions.push({ id, name:payload.name, cycle:payload.cycle, nextRenewal:ed.nextRenewal, active:true, notifyDaysBefore:ed.notifyDaysBefore, note:ed.note });
    state.subscriptionEditor = null; render();
    await persist(sb.from('subscriptions').insert({ id, ...payload, active:true }), {
      message: `«${payload.name}» ذخیره نشد — اینترنتت رو چک کن و دوباره اضافه‌ش کن.`,
      rollback: () => { state.subscriptions = state.subscriptions.filter(s => s.id !== id); },
    });
  }
}
async function toggleSubActive(subId){
  const sub = state.subscriptions.find(s => s.id === subId);
  if(!sub) return;
  sub.active = !sub.active;
  render();
  await persist(sb.from('subscriptions').update({ active: sub.active }).eq('id', subId), {
    message: `وضعیت «${sub.name}» ذخیره نشد — اینترنتت رو چک کن.`,
    rollback: () => { sub.active = !sub.active; },
  });
}
async function markSubRenewed(subId){
  const sub = state.subscriptions.find(s => s.id === subId);
  if(!sub || !sub.nextRenewal) return;
  const before = sub.nextRenewal;
  sub.nextRenewal = advanceRenewal(sub.nextRenewal, sub.cycle);
  render();
  await persist(sb.from('subscriptions').update({ next_renewal: sub.nextRenewal }).eq('id', subId), {
    message: `تمدید «${sub.name}» ذخیره نشد — اینترنتت رو چک کن.`,
    rollback: () => { sub.nextRenewal = before; },
  });
}
const pendingSubDeleteTimers = {}; // subId -> timeoutId, while the undo window is open
function deleteSubscription(subId){
  const idx = state.subscriptions.findIndex(s => s.id === subId);
  if(idx === -1) return;
  const [removed] = state.subscriptions.splice(idx, 1);
  showUndoToast(`«${removed.name}» حذف شد`, () => {
    clearTimeout(pendingSubDeleteTimers[subId]);
    delete pendingSubDeleteTimers[subId];
    state.subscriptions.splice(Math.min(idx, state.subscriptions.length), 0, removed);
    render();
  });
  render();
  pendingSubDeleteTimers[subId] = setTimeout(async () => {
    delete pendingSubDeleteTimers[subId];
    await persist(sb.from('subscriptions').delete().eq('id', subId), {
      message: `حذف «${removed.name}» ذخیره نشد — اینترنتت رو چک کن.`,
      rollback: () => { state.subscriptions.splice(Math.min(idx, state.subscriptions.length), 0, removed); },
    });
  }, 5000);
}

/* ---------- prompts ----------
   A personal library of prompts worth keeping. Search and the copy button are
   the two things used most, so search repaints only the list (the input keeps
   focus while typing) and copying never re-renders the page. */
function promptFromRow(row){
  return {
    id:row.id, title:row.title || '', body:row.body || '',
    category:row.category || '', note:row.note || '',
    favorite:!!row.favorite, createdAt:row.created_at,
  };
}
function promptCategories(){
  return [...new Set((state.prompts || []).map(p => p.category).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'fa'));
}
function filteredPrompts(){
  const q = state.promptSearch.trim().toLowerCase();
  const f = state.promptFilter;
  return (state.prompts || [])
    .filter(p => f === 'all' || (f === 'fav' ? p.favorite : p.category === f))
    .filter(p => !q || [p.title, p.body, p.note, p.category].some(s => s.toLowerCase().includes(q)))
    // favorites float to the top; otherwise newest first, as loaded
    .sort((a, b) => (b.favorite - a.favorite) || (b.createdAt || '').localeCompare(a.createdAt || ''));
}
function setPromptSearch(v){
  state.promptSearch = v;
  const el = document.getElementById('prompt-list');
  if(el) el.innerHTML = renderPromptList();
}
function setPromptFilter(v){ state.promptFilter = v; render(); }
/* true on success; shows the error toast itself on failure */
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  } catch(e){
    // older iOS Safari / non-secure origins: fall back to a hidden textarea
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    if(!ok){ showSaveError('کپی نشد — متن رو دستی انتخاب و کپی کن.'); render(); return false; }
  }
  return true;
}
async function copyIdea(id, btn){
  const idea = state.ideas.find(x => x.id === id);
  if(!idea || !idea.body) return;
  if(!(await copyText(idea.body))) return;
  if(btn){
    btn.classList.add('copied');
    btn.innerHTML = '<i class="fa-solid fa-check text-[10px] text-emerald-400"></i>';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = '<i class="fa-solid fa-copy text-[10px]"></i>'; }, 1500);
  }
}
async function copyPrompt(id, btn){
  const p = state.prompts.find(x => x.id === id);
  if(!p) return;
  if(!(await copyText(p.body))) return;
  if(btn){
    btn.classList.add('copied');
    const before = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-check text-[10px] text-emerald-400"></i>';
    setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = before; }, 1500);
  }
}

  state.promptEditor = p

function pickPromptCategory(c){

/* ---------- wins («تونستم») ----------
   Evidence for the days my mind only counts the failures. Each entry is
   written by hand — what I managed, what stood in the way («با اینکه…»), and
   why it mattered — and the page is a wall of them under one big count.
   The «مغزم داره شکست‌هامو می‌شمره» button opens them one at a time, shuffled,
   so on a bad day they're read one by one instead of skimmed as a list. */
function winFromRow(row){
  return {
    id:row.id, title:row.title || '', hardship:row.hardship || '', why:row.why || '',
    tagIds:row.tag_ids || [], happenedOn:row.happened_on, createdAt:row.created_at,
  };
}
function sortWins(){
  state.wins.sort((a, b) => (b.happenedOn || '').localeCompare(a.happenedOn || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
}
function fmtWinDate(dateStr){
  if(!dateStr) return '';
  const j = window.jalaali.toJalaali(new Date(dateStr + 'T00:00:00'));
  const thisYear = window.jalaali.toJalaali(new Date()).jy;
  return `${toFaDigits(j.jd)} ${MONTHS_JALALI[j.jm-1]}${j.jy !== thisYear ? ` ${toFaDigits(j.jy)}` : ''}`;
}
function winColor(w){
  const tag = w.tagIds.map(id => state.tags.find(t => t.id === id)).find(Boolean);
  return tag ? tag.color : 'var(--accent)';
}
function toggleWinsFilterTag(tagId){
  const f = state.winsFilterTagIds;
  state.winsFilterTagIds = f.includes(tagId) ? f.filter(id => id !== tagId) : [...f, tagId];
  render();
}
function clearWinsFilter(){ state.winsFilterTagIds = []; render(); }

/* ---------- wins: editor ---------- */
function openWinEditor(winId){
  const w = winId ? state.wins.find(x => x.id === winId) : null;
  const base = w ? { winId:w.id, title:w.title, hardship:w.hardship, why:w.why, tagIds:[...w.tagIds], happenedOn:w.happenedOn }
                 : { winId:null, title:'', hardship:'', why:'', tagIds:[], happenedOn:dateKey(new Date()) };
  const j = window.jalaali.toJalaali(new Date(base.happenedOn + 'T00:00:00'));
  state.winEditor = Object.assign(base, { calendarOpen:false, calJY:j.jy, calJM:j.jm });
  render();
}
function closeWinEditor(){ state.winEditor = null; render(); }
function winEditorToggleTag(tagId){
  const ed = state.winEditor;
  ed.tagIds = ed.tagIds.includes(tagId) ? ed.tagIds.filter(id => id !== tagId) : [...ed.tagIds, tagId];
  render();
}
function winEditorQuickDate(daysAgo){
  const d = new Date(); d.setDate(d.getDate() - daysAgo);
  state.winEditor.happenedOn = dateKey(d);
  state.winEditor.calendarOpen = false;
  render();
}
function toggleWinCalendar(){
  const ed = state.winEditor;
  ed.calendarOpen = !ed.calendarOpen;
  if(ed.calendarOpen){
    const j = window.jalaali.toJalaali(new Date(ed.happenedOn + 'T00:00:00'));
    ed.calJY = j.jy; ed.calJM = j.jm;
  }
  render();
}
function winCalPrevMonth(){
  const ed = state.winEditor;
  ed.calJM--; if(ed.calJM < 1){ ed.calJM = 12; ed.calJY--; }
  render();
}
function winCalNextMonth(){
  const ed = state.winEditor;
  ed.calJM++; if(ed.calJM > 12){ ed.calJM = 1; ed.calJY++; }
  render();
}
function winCalPick(jy, jm, jd){
  const g = window.jalaali.toGregorian(jy, jm, jd);
  const ed = state.winEditor;
  ed.happenedOn = dateKey(new Date(g.gy, g.gm - 1, g.gd));
  ed.calendarOpen = false;
  render();
}
async function confirmWinEditor(){
  const ed = state.winEditor;
  if(!ed || !ed.title.trim()) return;
  const fields = {
    title: ed.title.trim(),
    // the label already says «با اینکه», so don't let it read twice on the card
    hardship: ed.hardship.trim().replace(/^با\s*این\s*‌?\s*که\s*/, ''),
    why: ed.why.trim(),
    tagIds: ed.tagIds.filter(id => state.tags.some(t => t.id === id)),
    happenedOn: ed.happenedOn,
  };
  const payload = { title:fields.title, hardship:fields.hardship || null, why:fields.why || null, tag_ids:fields.tagIds, happened_on:fields.happenedOn };
  if(ed.winId){
    const w = state.wins.find(x => x.id === ed.winId);
    if(!w){ closeWinEditor(); return; }
    const before = { title:w.title, hardship:w.hardship, why:w.why, tagIds:w.tagIds, happenedOn:w.happenedOn };
    Object.assign(w, fields);
    sortWins();
    state.winEditor = null; render();
    await persist(sb.from('wins').update(payload).eq('id', w.id), {
      message: 'تغییرات ذخیره نشد — اینترنتت رو چک کن و دوباره امتحان کن.',
      rollback: () => { Object.assign(w, before); sortWins(); },
    });
  } else {
    const id = crypto.randomUUID();
    state.wins.push({ id, ...fields, createdAt:new Date().toISOString() });
    sortWins();
    state.winEditor = null; render();
    await persist(sb.from('wins').insert({ id, ...payload }), {
      message: `«${fields.title}» ذخیره نشد — اینترنتت رو چک کن و دوباره اضافه‌ش کن.`,
      rollback: () => { state.wins = state.wins.filter(x => x.id !== id); },
    });
  }
}

  for(let i = order.length - 1; i > 0; i--){

/* ---------- reminders ("یادت نره") ----------
   Things that aren't tasks and have no place on a to-do list, but must not slip
   your mind: a subscription you paid for and haven't used, a birthday, a date
   you promised someone. Four shapes, one surface:
     once     — a single day ("۲۰ دی تبریک بگم")
     yearly   — the same Jalali day every year (birthdays, anniversaries)
     deadline — use-it-before-it-expires; counts down from far out
     always   — no date at all; sits at the top until you retire it
   Each one starts showing `leadDays` before its date and keeps showing until
   you tick it off, so nothing quietly passes while you weren't looking. */
const REMINDER_KIND_LABEL = { once:'یک‌بار', yearly:'سالانه', deadline:'مهلت‌دار', always:'همیشگی' };
const REMINDER_DEFAULT_LEAD = { once:3, yearly:7, deadline:14, always:0 };
const REMINDER_STATUS_RANK = { late:0, expired:0, today:1, soon:2, pinned:3 };
/* a yearly reminder you never ticked off rolls to next year once it's this far past */
const REMINDER_YEARLY_GRACE_DAYS = 30;

/* Same Jalali day, next Jalali year — not +365 days, so «۲۰ دی» stays ۲۰ دی. */
function advanceJalaliYear(dateStr){
  const j = window.jalaali.toJalaali(new Date(dateStr + 'T00:00:00'));
  const jy = j.jy + 1;
  const jd = Math.min(j.jd, window.jalaali.jalaaliMonthLength(jy, j.jm)); // ۳۰ اسفند in a common year
  const g = window.jalaali.toGregorian(jy, j.jm, jd);
  return dateKey(new Date(g.gy, g.gm - 1, g.gd));
}
function reminderStatus(r){
  if(r.kind === 'always' || !r.date) return 'pinned';
  const n = daysUntil(r.date);
  if(n < 0) return r.kind === 'deadline' ? 'expired' : 'late';
  if(n === 0) return 'today';
  return 'soon';
}
function reminderVisible(r){
  if(r.done) return false;
  if(r.kind === 'always' || !r.date) return true;
  return daysUntil(r.date) <= (r.leadDays || 0);
}
function activeReminders(){
  return (state.reminders || []).filter(reminderVisible).sort((a,b) => {
    const ra = REMINDER_STATUS_RANK[reminderStatus(a)], rb = REMINDER_STATUS_RANK[reminderStatus(b)];
    if(ra !== rb) return ra - rb;
    const da = a.date ? daysUntil(a.date) : 9999, db = b.date ? daysUntil(b.date) : 9999;
    return da - db;
  });
}
function reminderDueLabel(r){
  if(r.kind === 'always' || !r.date) return 'همیشه یادت باشه';
  const n = daysUntil(r.date);
  if(r.kind === 'deadline'){
    if(n < 0)  return `${toFaDigits(Math.abs(n))} روز از مهلتش گذشته`;
    if(n === 0) return 'امروز آخرین مهلته';
    if(n === 1) return 'فردا مهلتش تموم می‌شه';
    return `${toFaDigits(n)} روز تا تموم شدن مهلت`;
  }
  if(n < 0)   return `${toFaDigits(Math.abs(n))} روز گذشته`;
  if(n === 0) return 'همین امروزه';
  if(n === 1) return 'فرداست';
  return `${toFaDigits(n)} روز مونده`;
}

async function completeReminder(id){

/* A birthday you never ticked shouldn't sit there red forever — once it's a
   month past, it quietly books itself for next year. */
function rolloverYearlyReminders(){
  (state.reminders || []).forEach(r => {
    if(r.kind !== 'yearly' || r.done || !r.date) return;
    let d = r.date, guard = 0;
    while(daysUntil(d) < -REMINDER_YEARLY_GRACE_DAYS && guard++ < 200) d = advanceJalaliYear(d);
    if(d === r.date) return;
    r.date = d;
    sb.from('reminders').update({ date:d }).eq('id', r.id)
      .then(({ error }) => { if(error) writeFailed('rollover yearly reminder', error); });
  });
}

function sortForPrint(tasks){
  const order = { high:0, medium:1, low:2 };
  return [...tasks].sort((a,b) => {
    if(a.done !== b.done) return a.done ? 1 : -1;
    const pa = a.priority ? order[a.priority] : 3;
    const pb = b.priority ? order[b.priority] : 3;
    return pa - pb;
  });
}

/* Which consideration a day gets: the reminder days are counted from 1970-01-01
   and the list is walked in order, so every item comes round in turn. send-push
   runs the same count — change both or neither. */
function motherItemForDay(d){
  const s = motherSettings();
  const days = s.remindDays;
  const items = state.motherItems || [];
  if(!items.length || !days.includes(d.getDay())) return null;
  const e = Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  let n = Math.floor(e / 7) * days.length;
  for(let x = e - (e % 7); x <= e; x++) if(days.includes((x + 4) % 7)) n++; // 1970-01-01 was a Thursday
  return items[(n - 1) % items.length];
}

  if(n < 0) return `${toFaDigits(-n)} روز از موعدش گذشته`;
  if(n === 0) return 'موعدش امروزه';
  if(n === 1) return 'موعدش فرداست';
  if(n <= 45) return `${toFaDigits(n)} روز دیگه`;
  return `موعد: ${formatDateShort(m.nextDue + 'T00:00:00')}`;
}
const repairPartsOf = id => (state.homeParts || []).filter(p => p.repairId === id);
// the امروز task an item was sent to, while it's still open
const linkedOpenTask = taskId => taskId ? state.tasks.find(t => t.id === taskId && !t.done) : null;
const whoLabel = x => x.who === 'pro' ? (x.trade || 'استادکار') : 'خودم';
function sortRepairs(list){
  return [...list].sort((a, b) =>
    REPAIR_URGENCY_RANK[a.urgency] - REPAIR_URGENCY_RANK[b.urgency]
    || (a.createdAt || '').localeCompare(b.createdAt || ''));
}
function homePartsToBuy(){

/* «بفرست به امروز»: a task for today, linked back through task_id so the row
   shows «توی امروز» and ticking the task off finishes the job here too
   (syncHomeJobsFromTask, called from toggleTaskDone). */
async function sendHomeJobToToday(kind, id){
  const isRepair = kind === 'repair';
  const list = isRepair ? state.homeRepairs : state.homeMaint;
  const item = list.find(x => x.id === id);
  if(!item) return;
  if(linkedOpenTask(item.taskId)){ navigateTo('today'); return; }
  const parts = isRepair ? repairPartsOf(id).filter(p => !p.bought).map(p => p.name) : [];
  const notes = [
    [item.room, item.who === 'pro' ? (item.trade || 'استادکار') : ''].filter(Boolean).join(' · '),
    parts.length ? `قطعه‌ها: ${parts.join('، ')}` : '',
    item.note,
  ].filter(Boolean).join('\n');
  const priority = isRepair ? REPAIR_URGENCY_CHIP[item.urgency] : 'medium';
  const task = {
    id: uid(), title: isRepair ? `تعمیر: ${item.title}` : item.title, notes, done:false, completedAt:null,
    tagIds:[], priority, subtasks:[], date: dateKey(new Date()), durationMin:null, actualMin:null, recurringTemplateId:null,
  };
  state.tasks.unshift(task);
  item.taskId = task.id;
  render();
  showInfoToast('به کارهای امروز اضافه شد');
  const { error } = await sb.from('tasks').insert({ id:task.id, title:task.title, notes:notes || null, priority, date:task.date, done:false });
  if(error){ writeFailed('send home job to today', error); return; }
  const { error: linkErr } = await sb.from(isRepair ? 'home_repairs' : 'home_maintenance').update({ task_id:task.id }).eq('id', id);
  if(linkErr) writeFailed('link home job task', linkErr);
}
// what upkeep looked like before a task finished it, so un-ticking the task puts it back
const maintBeforeTask = {};
function syncHomeJobsFromTask(t){
  const r = (state.homeRepairs || []).find(x => x.taskId === t.id);
  if(r) setRepairDone(r, t.done);
  const m = (state.homeMaint || []).find(x => x.taskId === t.id);
  if(!m) return;
  if(t.done){
    maintBeforeTask[t.id] = { nextDue:m.nextDue, lastDone:m.lastDone };
    saveMaintDates(m, { lastDone:dateKey(new Date()), nextDue:addMonthsKey(dateKey(new Date()), m.everyMonths) });
  } else if(maintBeforeTask[t.id]){
    saveMaintDates(m, maintBeforeTask[t.id]);
    delete maintBeforeTask[t.id];
  }
}

async function confirmRepairEditor(){
  const ed = state.repairEditor;
  if(!ed || !ed.title.trim()) return;
  const r = state.homeRepairs.find(x => x.id === ed.repairId);
  if(!r){ closeRepairEditor(); return; }
  const fields = {
    title:ed.title.trim(), room:ed.room.trim(), urgency:ed.urgency, who:ed.who,
    trade: ed.who === 'pro' ? ed.trade.trim() : '', status:ed.status,
    estCost:parseCost(ed.estCost), actualCost:parseCost(ed.actualCost), note:ed.note.trim(),
  };
  Object.assign(r, fields);
  // parts: the editor worked on a copy — diff it against what's stored
  const before = repairPartsOf(r.id);
  const keep = new Set(ed.parts.map(p => p.id));
  const removed = before.filter(p => !keep.has(p.id));
  const added = ed.parts.filter(p => p.isNew);
  const changed = ed.parts.filter(p => !p.isNew && before.some(b => b.id === p.id && b.bought !== p.bought));
  state.homeParts = [
    ...state.homeParts.filter(p => p.repairId !== r.id),
    ...ed.parts.map(({ isNew, ...p }) => p),
  ];
  state.repairEditor = null;
  render();
  const { error } = await sb.from('home_repairs').update({
    title:fields.title, room:fields.room, urgency:fields.urgency, who:fields.who, trade:fields.trade, status:fields.status,
    est_cost:fields.estCost, actual_cost:fields.actualCost, note:fields.note,
  }).eq('id', r.id);
  if(error){ writeFailed('save repair', error); return; }
  if(removed.length){
    const { error: delErr } = await sb.from('home_repair_parts').delete().in('id', removed.map(p => p.id));
    if(delErr) writeFailed('remove repair parts', delErr);
  }
  if(added.length){
    const { error: insErr } = await sb.from('home_repair_parts').insert(added.map(p => ({ id:p.id, repair_id:r.id, name:p.name, bought:p.bought, created_at:p.createdAt })));
    if(insErr) writeFailed('add repair parts', insErr);
  }
  for(const p of changed){
    const { error: upErr } = await sb.from('home_repair_parts').update({ bought:p.bought }).eq('id', p.id);
    if(upErr) writeFailed('update repair part', upErr);
  }
}

/* ---------- انگلیسی ----------
   Classes with a teacher (Top Notch), and the homework that wasn't getting
   done. After each class the homework is written down in one line; هوشواره
   (the english-plan edge function) cuts it into 10–15 minute chunks and
   spreads them over the days until the next class, and each day's chunks sit
   in a card on امروز. A chunk whose day went by is asked «چرا نشد؟» with one
   tap (english_chunks.skips) — that pattern feeds the next plan and the
   weekly review. The chain counts days with a chunk done or the 5-minute
   minimum (english_practice); it only breaks when two days in a row are
   missed, and class days don't count either way. The timed pushes (after
   class, daily practice time, the night before a class) are in send-push's
   englishFor — keep the class-day rules there in step with the ones here. */
const DEFAULT_ENGLISH_SETTINGS = { classDays:[], classTime:'18:00', classTimes:{}, classMinutes:90, practiceTime:'20:00', push:true };
const EN_SKIP_REASONS = { time:'وقت نشد', hard:'سخت بود', forgot:'یادم رفت', mood:'حوصله نداشتم' };
const EN_WEEKDAY_SHORT = ['ی','د','س','چ','پ','ج','ش']; // getDay() order
// what the 5-minute minimum can be, one per weekday so it isn't the same line every day
const EN_MIN_IDEAS = [
  'واژه‌های درس آخر رو یه بار بلند بخون.',
  'مکالمه‌ی درس آخر رو با صدای بلند بخون.',
  'سه جمله درباره‌ی امروزت به انگلیسی بنویس.',
  'فایل صوتی درس آخر رو یه بار گوش بده.',
  'گرامر درس آخر رو نگاه کن و دو تا مثال بساز.',
  'یه صفحه از درس آخر رو مرور کن.',
  'واژه‌هایی که سر کلاس یاد گرفتی رو مرور کن.',
];
const EN_NOHW_KEY = 'medar-english-nohw'; // the class date «تکلیف نداشتیم» was tapped for
const EN_PLAN_MAX_DAYS = 14;

function englishSettingsFromRow(r){
  return {
    classDays:(r.class_days || []).map(Number), classTime:r.class_time || '18:00',
    classTimes:(r.class_times && typeof r.class_times === 'object') ? r.class_times : {},
    classMinutes:Number(r.class_minutes) || 90, practiceTime:r.practice_time || '20:00', push:r.push !== false,
  };
}
function englishHomeworkFromRow(r){
  return { id:r.id, title:r.title || '', unit:r.unit || '', assignedOn:r.assigned_on, dueOn:r.due_on, createdAt:r.created_at };
}
function englishChunkFromRow(r){
  return {
    id:r.id, homeworkId:r.homework_id, title:r.title || '', minutes:Number(r.minutes) || 10, day:r.day,
    position:r.position || 0, done:!!r.done, doneAt:r.done_at || null,
    actualMin:r.actual_min || null, difficulty:r.difficulty || null,
    skips:Array.isArray(r.skips) ? r.skips : [], createdAt:r.created_at,
  };
}
function englishSettings(){ return state.englishSettings || DEFAULT_ENGLISH_SETTINGS; }

function enAddDays(key, n){ const d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + n); return dateKey(d); }
const enWeekday = key => new Date(key + 'T00:00:00').getDay();
const enIsClassDay = key => englishSettings().classDays.includes(enWeekday(key));
const enMinutesOf = t => { const [h, m] = String(t || '').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
// each class day can start at its own time; a day without one uses the general classTime
const enClassTime = weekday => { const s = englishSettings(); return (s.classTimes || {})[weekday] || s.classTime; };
function enNowMin(){ const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function enClassEndedToday(){
  const today = dateKey(new Date());
  return enIsClassDay(today) && enNowMin() >= enMinutesOf(enClassTime(enWeekday(today))) + englishSettings().classMinutes;
}
// the first class day after `key` — null while no class days are set
function enNextClass(key){
  if(!englishSettings().classDays.length) return null;
  for(let i = 1; i <= 7; i++){ const k = enAddDays(key, i); if(enIsClassDay(k)) return k; }
  return null;
}
// the most recent class that is already over
function enLastClass(){
  if(!englishSettings().classDays.length) return null;
  const today = dateKey(new Date());
  if(enClassEndedToday()) return today;
  for(let i = 1; i <= 7; i++){ const k = enAddDays(today, -i); if(enIsClassDay(k)) return k; }
  return null;
}
// the class this homework is for: today's if it hasn't started yet, else the next one
function enUpcomingClass(){
  const today = dateKey(new Date());
  if(enIsClassDay(today) && enNowMin() < enMinutesOf(enClassTime(enWeekday(today)))) return today;
  return enNextClass(today);
}
function enDayLabel(key){
  const n = daysUntil(key);
  if(n === 0) return 'امروز';
  if(n === 1) return 'فردا';

/* Days that count: a chunk ticked off that day, or the 5-minute minimum. */
function enPracticedDays(){
  const days = new Set((state.englishPractice || []).map(p => p.day));
  (state.englishChunks || []).forEach(c => { if(c.done && c.doneAt) days.add(dateKey(new Date(c.doneAt))); });

/* «دو روز پشت سر هم جا نیفتد»: one missed day is forgiven, the second in a row
   ends the chain. Class days are skipped over — not a miss, not a point. */
function englishStreak(){
  const days = enPracticedDays();
  const today = dateKey(new Date());
  const doneToday = days.has(today);
  const first = [...days].sort()[0];
  let streak = doneToday ? 1 : 0, misses = 0, missedLast = null;
  if(first){
    for(let k = enAddDays(today, -1); k >= first; k = enAddDays(k, -1)){
      if(days.has(k)){ streak++; misses = 0; if(missedLast === null) missedLast = false; }
      else if(enIsClassDay(k)) continue;
      else { if(missedLast === null) missedLast = true; if(++misses >= 2) break; }
    }
  }
  // the last day that counted was missed and today isn't done yet: one more and it's gone
  return { streak, doneToday, atRisk: streak > 0 && !!missedLast && !doneToday };
}

function enTodayChunks(){

// the days a new homework may be spread over: from today (tomorrow, right after
// a class) to the day before the next class
function enPlanDays(hw){
  const today = dateKey(new Date());
  const start = enClassEndedToday() ? enAddDays(today, 1) : today;
  let end = enAddDays(hw.dueOn, -1);
  if(end < start) end = hw.dueOn >= start ? hw.dueOn : start; // class is tomorrow: the morning before it is all there is
  const days = [];
  for(let k = start; k <= end && days.length < EN_PLAN_MAX_DAYS; k = enAddDays(k, 1)) days.push(k);
  return days;
}
// هوشواره didn't answer (offline, no credit): an even split, so the homework still lands on the days
function enFallbackChunks(hw, days){
  const n = Math.min(days.length, 3);
  const title = hw.title.length > 90 ? hw.title.slice(0, 89) + '…' : hw.title;
  return days.slice(0, n).map((day, i) => ({ day, minutes:15, title: n === 1 ? title : `بخش ${toFaDigits(i + 1)} از ${toFaDigits(n)}: ${title}` }));
}

    const res = await fetch(`${SUPABASE_URL}/functions/v1/english-plan`, {
      method:'POST', signal: ctl.signal,
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${session?.access_token}` },
      body: JSON.stringify(payload),

    return data.chunks;
  } finally { clearTimeout(timer); }
}
