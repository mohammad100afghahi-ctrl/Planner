<!doctype html>
<html lang="fa" dir="rtl"><meta charset="utf-8"><title>مقایسهٔ طرح و پیاده‌سازی مدار</title>
<style>body{margin:0;background:#182132;color:#e2e8f0;font:14px sans-serif;padding:14px}nav{display:flex;gap:12px;align-items:center;margin-bottom:14px}button,select{font:inherit;color:#e2e8f0;background:#0f172a;border:1px solid #475569;border-radius:8px;padding:8px 12px}.compare{display:flex;justify-content:center;gap:18px;direction:rtl}.panel{overflow:hidden;background:#020617;border:1px solid #475569;position:relative}iframe{border:0;display:block;transform-origin:top right}h2{font-size:13px;font-weight:500;margin:0 0 8px}.column{min-width:0}label{font-size:12px}</style>
<nav><label>دستگاه <select id="device" onchange="show()"><option value="desktop">دسکتاپ ۱۴۴۰</option><option value="mobile">موبایل ۳۷۵</option><option value="narrow">موبایل ۳۲۰</option></select></label><label>صفحه <select id="view" onchange="show()"><option value="today">امروز</option><option value="tasks">تسک‌ها</option><option value="editor">ویرایش تسک</option><option value="calendar">تقویم</option><option value="ideas">ایده‌ها</option><option value="settings">تنظیمات</option><option value="english">انگلیسی</option><option value="prompts">پرامپت‌ها</option><option value="purchases">خریدها</option><option value="subscriptions">اشتراک‌ها</option><option value="wins">تونستم</option><option value="mother">مادر</option><option value="repairs">تعمیرات</option><option value="archive">آرشیو</option><option value="ai-reports">گزارش هوشمند</option></select></label><button onclick="detail=!detail;show()">نمای کامل / جزئیات</button><output id="layout" aria-live="polite"></output></nav>
<div class="compare"><div class="column"><h2>طرح تأییدشدهٔ UX Pilot</h2><div class="panel"><iframe id="reference" title="مرجع طرح"></iframe></div></div><div class="column"><h2>پیاده‌سازی با منطق اصلی · دادهٔ ساختگی</h2><div class="panel"><iframe id="implementation" title="پیاده‌سازی"></iframe></div></div></div>
<script>
const ids={today:['Q7pbgNwfW4q7j5PTzn9i','s02MoXt3u4YjAnSUS5zz'],tasks:['2fiGBYM7crNc6yL52J96','uJFnbriN8GQ6XbS4fuXT'],editor:['2fiGBYM7crNc6yL52J96','QNkUVZaCdsbMaVQvoqSF'],calendar:['hsUthMdVU2qVDNq3Azob','hpZbdqYk7VAEHGta9zgy'],ideas:['txrmQJTW8toKbIJFSKVI','nMGbQ9Jr5wJcgaWv9ETx'],settings:['qQaJvC8qAHaJaUT1wDhi','tAb0AcSzpRoSgSmpXE2t']};
let detail=false;
Object.assign(ids,{english:['0JsBelTVsnwmPmQACPti','Lm0ifwh8bSfvcwL8PPbz'],prompts:['acJm4qIhsysAGJSjrsfP','jvOsjBUBYcR2xv6yDhVP'],purchases:['UafyUnVmot8LKLayuxUl','afAKa3J9dNyrJ2neqHqK'],subscriptions:['Mcam1FJozcsT1tb17yFr','4qjypGrVaQYkjZmQo5Bm'],wins:['5IWKDBaSdoRXX8n2j0c8','bf3mnGCh46lUfHMQYJ74'],mother:['2RuTmbO9zj6nnkhOvZxu','oH1yNuPz7gKHYIEIrQsl'],repairs:['QxkPUjlI3Jlux5Ws1agh','Qowg3sRpt1C2DimUCSZO'],archive:['4oNCwQG3fB2JffmSVxKJ','LlieWErsa2N3Y2Paci3M'],'ai-reports':['JpgtE3aP90xJm2VQf5sv','v5rdZPNIGB44EChbuFsS']});
function show(){document.getElementById('layout').textContent='در حال بررسی…';const dev=document.getElementById('device').value,view=document.getElementById('view').value,mobile=dev!=='desktop',w=mobile?(dev==='narrow'?320:375):1440,h=mobile?840:1024,scale=mobile?.72:(detail?.66:.40);document.querySelectorAll('.panel').forEach(el=>{el.style.width=(mobile?w*scale:576)+'px';el.style.height=(detail?650:h*scale)+'px';});document.querySelectorAll('iframe').forEach(el=>{el.style.width=w+'px';el.style.height=h+'px';el.style.transform=`scale(${scale})`;});document.getElementById('reference').src='/__reference/'+(mobile?'mobile':'desktop')+'/'+ids[view][mobile?1:0]+'.html';document.getElementById('implementation').src='/__review/index.html?view='+(view==='editor'?'tasks':view)+(view==='editor'?'&mode=edit':'');}
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==document.getElementById('implementation').contentWindow)return;if(e.data.kind==='madar-review-layout')document.getElementById('layout').textContent=`عرض ${e.data.width} · محتوا ${e.data.scroll} · ${e.data.scroll>e.data.width?'سرریز دارد':'بدون سرریز'}`;else if(e.data.kind==='madar-review-error')document.getElementById('layout').textContent=e.data.message;});
show();
</script></html>
