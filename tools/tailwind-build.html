<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Madar — Tailwind build</title>
<style>body{font:13px system-ui;margin:16px;background:#fff;color:#111}textarea{width:100%;height:60vh;font:11px monospace}</style>
</head>
<body>
<!--
  Builds tailwind.css for مدار without Node: every class-like token in the UI
  sources is put on a hidden element, the Tailwind Play CDN (the same build
  the UX Pilot exports use) generates the CSS for exactly those classes, and
  the result is shown below. Served by a dev server that accepts
  POST /__save?path=tailwind.css, "Save" writes it next to index.html;
  otherwise copy the text into tailwind.css by hand.
  Re-run whenever a template gains a class that isn't used anywhere yet.
-->
<p id="status">collecting classes…</p>
<button id="save" disabled>Save tailwind.css</button>
<textarea id="out" spellcheck="false"></textarea>
<div id="probe" hidden></div>
<script>
const SOURCES = ['../index.html', '../task-reminders.js', '../ui-shell.js', '../ui-today.js', '../ui-tasks.js', '../ui-pages.js', '../ui-system.js', '../hooshavar.js', '../hooshavar-morning.js', '../hooshavar-english.js'];
(async () => {
  const texts = await Promise.all(SOURCES.map(u => fetch(u, { cache:'no-store' }).then(r => r.ok ? r.text() : '')));
  const tokens = new Set();
  texts.join('\n').split(/[\s'"`<>=;{}\\]+/).forEach(t => {
    t = t.replace(/^\$+|[,)]+$/g, '');
    if(t && t.length < 120 && /[a-z]/.test(t)) tokens.add(t);
  });
  document.getElementById('probe').className = [...tokens].join(' ');
  document.getElementById('status').textContent = `${tokens.size} tokens — waiting for Tailwind…`;
  const s = document.createElement('script');
  s.src = 'https://cdn.tailwindcss.com';
  // the Play CDN builds on DOM changes, so touch the probe once it has loaded
  s.onload = () => {
    // تم سیاه و زرشکی: کلاس‌ها همون slate/indigo طرح مرجع‌ان، فقط مقدارشون اینجا عوض شده
    const neutral = { 50:'#fafafa', 100:'#f4f4f5', 200:'#e4e4e7', 300:'#d4d4d8', 400:'#a1a1aa', 500:'#71717a', 600:'#52525b', 700:'#303034', 800:'#1c1c1f', 900:'#0e0e10', 950:'#000000' };
    const indigo = { 50:'#fff1f1', 100:'#ffe6e6', 200:'#fbc9c8', 300:'#f69694', 400:'#f06868', 500:'#bc1c28', 600:'#8e101c', 700:'#760d18', 800:'#5c0b14', 900:'#460a10', 950:'#28060a' };
    tailwind.config = { theme:{ extend:{
      colors:{ slate:neutral, indigo },
      textColor:{
        slate:{ 50:'#fafafa', 100:'#f4f4f5', 200:'#f0f0f3', 300:'#e4e4e8', 400:'#d4d4d8', 500:'#c4c4ca', 600:'#b0b0b6', 700:'#96969c', 800:'#1c1c1f', 900:'#0e0e10', 950:'#000000' },
        indigo:{ ...indigo, 500:'#e24e50' },
        rose:{ 500:'#fb7185' },
      },
      backgroundColor:{ rose:{ 500:'#e11d48' } }, // نوشتهٔ سفید روی نشان‌های قرمز
      borderColor:{ slate:{ ...neutral, 700:'#404046', 800:'#26262a', 900:'#1c1c1f', 950:'#0e0e10' } },
    }}};
    setTimeout(() => { document.getElementById('probe').classList.add('block'); }, 300);
  };
  document.head.appendChild(s);
  const t0 = Date.now();
  let lastLen = -1;
  const timer = setInterval(() => {
    const style = [...document.querySelectorAll('style')].find(x => x.textContent.includes('--tw-') && x.textContent.length > 5000);
    // done once the generated sheet stops growing
    const len = style ? style.textContent.length : -1;
    // the CDN first builds without the config above; only the themed sheet counts
    const settled = style && len === lastLen && style.textContent.includes('14 14 16');
    lastLen = len;
    if(!settled && Date.now() - t0 < 20000) return;
    clearInterval(timer);
    const css = style ? `/* generated by tools/tailwind-build.html (Tailwind Play CDN) — do not edit by hand */\n${style.textContent}` : '';
    document.getElementById('out').value = css;
    document.getElementById('status').textContent = css ? `done: ${css.length} bytes` : 'Tailwind did not load';
    const btn = document.getElementById('save');
    btn.disabled = !css;
    btn.onclick = async () => {
      const r = await fetch('/__save?path=tailwind.css', { method:'POST', body:css }).catch(() => null);
      document.getElementById('status').textContent = r && r.ok ? 'saved tailwind.css' : 'save failed — copy the text by hand';
    };
    window.__twDone = { bytes: css.length };
  }, 500);
})();
</script>
</body>
</html>
